      first TEN by default, so /users was showing at most ten pending
      invitations and the rest were invisible, which on that page means
      unrevokable; /users and GET /api/users now drain via fetchAllClerkPages.
      58589c9 — the session brief,
      docs/prompts/DEBT-46_pending_invite_case_and_orphans.md.
      NOT SHIPPED, and carried by DEBT-52: the orphan surface. No page lists a
      PendingInvite on its own merits, so a row whose Clerk invitation is
      revoked, expired or accepted-without-webhook still renders nowhere. Two
      exist: kevajuice14@icloud.com on preview/staging
      (br-square-feather-a63z92vz) and the inherited karson@keva.com on
      preview/main (br-purple-rain-a6m62xww). The production copy of the latter
      was revoked and its deletion MEASURED — karson_rows = 0 on
      br-sparkling-block-a620qvg4. Also unshipped: two Clerk list calls still
      capped at ten (staff-termination.ts:73, users/[id]/route.ts:135), both

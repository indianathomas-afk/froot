      count cost is unchanged.
      THE OTHER WAY OUT, weighed and not taken: move that rationale to `notes`
      and mark the entry resolved, which would fix the count with no new
      vocabulary. Rejected by Gary 2026-08-01 because it would leave THIS ROW
      WITH ONE EXEMPLAR, and this row already says two is thin. Fixing the
      symptom by destroying the evidence is how a vocabulary problem never gets
      fixed.
      EXEMPLAR (a) IS GONE — RESOLVED BY RELOCATION 2026-08-01 (later the same
      day) by PERM-6d, and HOW it went matters more than that it went: THE

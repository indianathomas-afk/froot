      already remediated.
      WHY IT STILL MATTERS IF TRUE: a PAT in .git/config is not encrypted, is
      readable by any process running as the user, and survives in any copy of
      the working tree. Depending on scope it may grant push access to this repo
      or to every repo on the account.
      HANDLING RULES for whoever picks this up: never echo, paste, log or commit
      the token value — not into a terminal, a report, this file, or a commit
      message. Establish presence without printing the secret. If present:
      rotate the token on GitHub FIRST (rotation invalidates it regardless of
      where copies have spread), then switch the remote to SSH or a credential
      manager, then confirm .git/config no longer carries it. Rotating before
      cleaning is the right order — cleanup without rotation leaves a live
      credential in any copy already made.
      Related: DEBT-7 (same source file).


    status: open
    asked: 2026-08-05
    title: >
      Schedule the DEBT-55 org-blind lookup sweep, or leave it latent
    question: >
      Twenty pages — eighteen inventory, plus /hr and /items — still look up the
      user by Clerk id without checking the org, the same gap F1 closed
      centrally. UI-only today: every gate behind them refuses independently.
      It is why a cross-org session still sees an overpromising sidebar, and it
      is a HARD PREREQUISITE for the org-switcher half of DEBT-50.
    options:
      - >
        (a) Schedule the sweep soon — it is mechanical, one session, mostly one
        module.
      - >
        (b) Leave open until something needs it: the switcher, or a new page
        copying the pattern.
      - >
        (c) Fold it into the next inventory-touching session as a rider.
    recommendation: >
      (b), with one addition — a comment in CLAUDE.md or at the pattern's
      most-copied site saying new pages must use the org-guarded lookup, so the
      surface stops growing. The defect is latent, the centre is fixed, and no

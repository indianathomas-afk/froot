    notes: >
      COST OF DOING NOTHING: The same defect DEBT-36 describes for section
      headings, on the task text itself — a printed closing checklist from last
      month re-prints today with a task added yesterday, and with any
      description edited since, and nothing indicates it changed — LATENT
      (trigger: the first task edit or task addition on a template that already
      has completed historical checklists. Unlike DEBT-36's trigger this one is

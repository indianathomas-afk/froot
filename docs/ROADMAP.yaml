  - id: BUG-3
    title: "Migrations bypass Neon pooler via directUrl"
    status: shipped
    shipped: 2026-07-27
    commits: [f6818f1]
    notes: >
      Intermittent P1002 on deploy — Prisma's migration advisory lock leaked
      onto recycled pgbouncer backends (hit ecee728, 7-25, no migration in it).
      Prisma 7 removed schema directUrl; fix is prisma.config.ts datasource.url
      = DATABASE_URL_UNPOOLED ?? DATABASE_URL (loud console.warn on fallback).
      No migration, no schema change. DATABASE_URL_UNPOOLED pre-exists in all
      Vercel envs (Neon integration); local .env gets it manually. See
      DECISIONS.md BUG-3. Staging proof required: build log Datasource "db"
      host without -pooler; a green deploy alone is not proof (P1002 is
      intermittent).
      History: f6818f1 reached main via c463af3 (2026-07-26), but status was
      deliberately held at in_progress through the 2026-07-26 reconcile because
      the required proof had never been recorded. Code shipped ≠ bug closed.
      PROOF SATISFIED 2026-07-27 — flipped to shipped. Both build logs show the
      Datasource resolving to the DIRECT endpoint, neither host ending
      `-pooler`:
        staging    (13:14): Datasource "db": ... at "ep-odd-rain-a6gr4xmm..."
        production (14:49): Datasource "db": ... at
                            "ep-green-smoke-a6xthq4r.us-west-2.aws.neon.tech"
      The production log (deployment EHfDfAKJR) also reads "31 migrations found;
      No pending migrations to apply."
      The NEGATIVE evidence is what closes it, and it is the half a green deploy
      could never supply: NEITHER log contains the
      `[prisma.config] DATABASE_URL_UNPOOLED is not set` warning that
      prisma.config.ts emits on fallback. Because the fix is a `??` fallback
      rather than strict, a pooled connection would still have deployed
      green — so "no warning" is the only thing that distinguishes the fix
      working from the fix silently degrading. That is precisely why the notes
      above insisted a green deploy was not proof.

  - id: BUG-4
    title: "Labor Budget card and Weekly Plan disagree on schedulable hours when no weather adjustment exists"
    status: planned
    notes: >
      Logged 2026-07-27, not fixed. The dashboard Labor Budget card shows
      `totalSchedulableHours` unless a weather adjustment exists, while the
      Weekly Plan ALWAYS shows `adjustedTotalSchedulableHours`. Confirmed in
      source: src/app/(app)/dashboard/labor-budget-card.tsx:179 reads
      `adjusted ? res.adjustedTotalSchedulableHours ?? budget.totalSchedulableHours
      : budget.totalSchedulableHours`, whereas
      src/app/(app)/labor/weekly-plan-client.tsx:206 renders
      `adjustedTotalSchedulableHours` unconditionally. On a week with NO weather
      adjustment the two values still differ — they are computed by different
      paths (src/lib/labor-budget.ts:100 sums salaried + hourly; the adjusted
      figure at src/lib/labor-plan.ts:285 re-sums salaried + the per-day
      hourlyHours AFTER the floor-first 0.5-step flooring), so the adjusted
      total carries flooring residue even with no adjustment applied.
      The card's behavior is DELIBERATE per its own inline comment, so this is
      not a straightforward bug — but two screens showing different
      schedulable-hour totals for the same store and the same week is a
      correctness problem for the operator regardless of which number is
      defensible. Decide which figure is canonical and make both surfaces say
      it, or label them differently. Numbered BUG-4 because BUG-1…BUG-3 exist;
      docs/prompts/verification-smoke-pass.md already referenced a "BUG-4" in
      its holds list before any BUG-4 row existed — this fills that reference.

  - id: BUG-5
    title: "Duplicating a template creates it ACTIVE — the client's isActive:false is dropped"
    status: planned
    notes: >
      Logged 2026-07-30, found while auditing DEBT-1a (21dd712); NOT fixed, that
      session was audit-only and its writable set was two docs files.
      src/app/(app)/templates/templates-client.tsx:137 POSTs `isActive: false`
      when duplicating a template, but the create block in
      src/app/api/templates/route.ts:60 never reads `isActive` — it is absent
      from the `data` object — so Prisma applies the schema default
      `isActive Boolean @default(true)` (prisma/schema.prisma:283). The copy is
      live the moment it is created.
      IT THEN PROPAGATES: the bulk generator at
      src/app/api/checklists/route.ts:138 selects every `isActive: true` template
      for the org, so the duplicate starts generating checklists for every
      applicable store on the next generation run — the original's checklists
      silently double. The admin who clicked Duplicate to draft a variant gets a
      second live checklist per store instead.
      This is a DROPPED FIELD, not a design choice: the client sends the flag
      explicitly, and the intent (a copy you review before going live) matches
      the import route, which does hardcode `isActive: false`
      (src/app/api/templates/import/route.ts:134). Fix is one line in the POST
      route's `data`. Before changing it, check each branch for duplicates
      already created live — the current behaviour has shipped since the field
      existed, so someone may be relying on a copy that went live immediately.

# COST OF DOING NOTHING — THE DEFINITION, so nobody re-derives a different one.
# Ruled by Gary 2026-08-02, applied by DEBT-TRIAGE-2 to every open row below.
#
#   LIVE   — a user OF THE PRODUCT is affected today. A merchant, an operator
#            running a store, someone using the app.
#   LATENT — it bites on a NAMED trigger. Name the trigger, always.
#   NONE   — no consequence to any user or operator. NONE IS A LEGITIMATE AND
#            USEFUL ANSWER; say it where it is true rather than inflating it.
#
# THE LINE THAT MATTERS IS PRODUCT vs PROCESS. Costs that fall on Gary, on
# Claude, or on the tooling — a red lint baseline, an over-reporting panel
# count, staging fixtures that make a query ambiguous — are LATENT with the
# trigger named, HOWEVER REAL THEY ARE. They are not LIVE.
#
# The reason is the whole point of the field: a list where six things are LIVE
# is a list you cannot read a priority off, which is the list this existed to
# fix. DEBT-TRIAGE-2 first derived six LIVE rows and Gary moved three of them
# (DEBT-33, DEBT-41, DEBT-44) to LATENT on exactly this distinction.
#
# IF A ROW'S COST IS GENUINELY PRODUCT-FACING AND HAS BEEN CALLED PROCESS, THAT
# IS WORTH ARGUING AGAIN. The definition is settled; its application to any
# individual row is not.
#
# Every cost line below is marked DERIVED-AT-HEAD-BY-DEBT-TRIAGE-2 because it
# was derived by reading the code and the files at HEAD, NOT inherited from the
# DEBT-TRIAGE audit — whose own 22 assessments exist nowhere in this repo. That
# hole is DEBT-45.

      `{ success: true }` at :34 regardless. An admin clicked revoke, was told it
      worked, and nothing was deleted. A destructive operation that cannot
      distinguish "deleted the row" from "matched nothing" reports the same
      success for both.
      THE MIXED CASE IS LEGITIMATE AND DATED, so this is a real class and not
      one malformed row. POST /api/users normalises to lowercase at write time
      (users/route.ts:102, via normalizeEmail in lib/clerk.ts:4-7), but that
      landed in 3c7d0a0 on 2026-07-22 — thirteen days AFTER the Taylin row was
      created on 2026-07-09. Every PendingInvite written before that commit may
      hold mixed case, which is exactly the class (1)'s comment was written for
      and exactly the class (2) and (3) mishandle.
      FIX DIRECTION, not yet ruled: normalise on read in all three paths, or
      backfill `lower(email)` and add a case-insensitive uniqueness constraint,
      or both. Whatever is chosen, the render must be able to show a
      PendingInvite that has no matching Clerk invitation — otherwise the row
      stays invisible even after the case bug is fixed, since revoked and
      expired invitations leave the same orphan. Checking deleteMany's count and
      returning 404 on zero is separable and smaller than either.
      A CHECK WHOSE COUNT AND DETAIL CAN DISAGREE, recorded here on Gary's
      instruction rather than left in a transcript, because it is the kind of
      thing that gets trusted later. DEBT-44a's own confirmation query returned
      `n = 1` with an EMPTY detail string for this very row: the detail
      expression concatenated `array_length(p."storeIds", 1)`, which is NULL for
      an empty array, and NULL || text is NULL, so string_agg had nothing to
      aggregate. Zero stores — the thing that made the invite notable — is what
      blanked the evidence describing it. A second, broader check in the same
      query is the only reason the id was recovered. Use
      `coalesce(array_length(...), 0)` in any re-run, and treat a check whose
      count and whose detail can disagree as a defective check.
      THE CASE TRAP HAS EXACTLY ONE KNOWN INSTANCE AND IT IS NOW DELETED —
      measured 2026-08-02 on branch preview/staging (br-square-feather-a63z92vz)
      by an all-invites query carrying `email <> lower(email)` as a column. After
      the Taylin delete the whole branch holds ONE PendingInvite:
      cmr07sljf000004l5yhwqzzme, kevajuice14@icloud.com, mixed_case_unrevokable
      FALSE. Recorded because a measured negative is evidence and usually goes
      unwritten — the trap is narrower than it looked.
      DO NOT READ THAT AS "THE CLASS IS CLOSED" (Gary, 2026-08-02). The query
      looked at ONE BRANCH. Every PendingInvite written before 3c7d0a0
      (2026-07-22) is still in scope on `production` and `preview/main`, neither
      of which has been examined, and the same three read paths are deployed
      there. One branch measuring clean is one branch.
      SECOND LIVE INSTANCE OF THE PRECEDENCE — NOT THE CASE BUG, AND NOT
      DANGEROUS, and it is the reason this row's scope is wider than the case
      trap that produced it. That surviving row is the one DEBT-17 already found
      and set aside: its Q1 on this branch returned kevajuice14@icloud.com with a
      User at role MANAGER against a PendingInvite at role STORE, correctly ruled
      NOT DEBT-17's bug because that error runs DOWNWARD (STAFF is the floor)
      while this discrepancy runs UPWARD (ROADMAP.yaml:4448-4451, verified at the
      row 2026-08-02 rather than from recollection). Role STORE, created
      2026-06-30, still pending after five weeks, in
      cf888f2d-f234-48c7-8097-fd5b44b5b3dd — the org whose provenance is unknown
      (DEBT-44). Direction is downward, so it grants nothing and is benign; it is
      the same mechanism as Taylin wearing the opposite sign.
      AND IT IS NARROWER THAN IT FIRST READS, per the create-branch correction on
      DEBT-44: because a User row for that address ALREADY EXISTS at MANAGER,
      re-adding that same Clerk identity hits the upsert's UPDATE branch and
      changes no role at all. STORE lands only if the User row is gone or the
      Clerk identity is new. So this instance is armed but not aimed — which is
      exactly why it is worth recording rather than actioning: it is what the
      mechanism looks like when it is NOT an escalation, and the pair
      (Taylin ADMIN-upward, this one STORE-downward) is the clearest available
      statement of what the precedence actually does.
      SCOPE WIDENED BY IT, DELIBERATELY, AND THE CALL IS ARGUABLE. This lands
      here rather than on a row of its own (Claude's recommendation, Gary's
      ruling 2026-08-02) because the defect a future reader needs to find is one
      thing — a PendingInvite can carry a live role grant that outlives its
      invitation and that the product does not surface — and splitting it across
      two rows fragments exactly the thing that took a query to see. The
      ARGUMENT AGAINST is real and is kept: this row's title is about a row that
      is unreachable AND unremovable, and kevajuice14 is neither — its case flag
      is FALSE, so the revoke button would work on it. What it shares is the
      payload, not the mechanism. If a third instance turns up that is removable
      and visible and still stale, the lifecycle question — nothing expires a
      PendingInvite, nothing reconciles one against Clerk, and Clerk invitations
      expire on their own while the database row does not — has outgrown this row
      and should be split out then.
      Related: DEBT-44 (the row this was found in, the delete, and the
      create-branch condition on the precedence), DEBT-47 (the other half of the
      Clerk/database asymmetry), DEBT-39 (unmirrored writers — the same family,
      one layer over), DEBT-17 (same page, /users, and the row that first saw
      kevajuice14 and correctly declined it).

  - id: DEBT-47
    title: >
      The Clerk webhook has no organization.deleted and no user.deleted handler,
      and organization.updated bare-updates — so deletion never reaches the
      database and a deleted row makes the webhook 500 on retry forever
    notes: >
      UPGRADED 2026-08-04: the consequence is no longer hypothetical. The
      production database (br-sparkling-block-a620qvg4) carries a User row
      (user_3Fq6iuvkhK4TSsmdaJ8yMMcT4rf, STAFF, kevajuice14@icloud.com,
      created 2026-07-03) whose Clerk identity no longer exists — deleted in
      Clerk, row orphaned, still counted by every org-scoped query (the
      live org shows 6 DB rows vs 5 Clerk members). The 2026-08-04 Clerk
      cleanup (blankettegirl user + My Organization org + Keva Smoothie
      Company org) added three more orphans by the same mechanism, tallied
      in DEBT-57. COST OF DOING NOTHING: LIVE — member counts and rosters
      silently disagree with Clerk today.
      ── ORIGINAL TEXT BELOW, UNCHANGED ──
      COST OF DOING NOTHING: Cleaning up an organization or a user requires a
      hand-sequenced two-sided dance that the product cannot perform and nothing
      records, and getting the order wrong silently regenerates what was deleted
      — LATENT (trigger: the next attempt to delete an Organization or User row
      whose Clerk identity survives, which is DEBT-44's staging cleanup and any
      future tenant offboarding; also fires unprompted the first time anyone
      renames a Clerk org whose database row is missing).
      FILED 2026-08-02 by DEBT-44a. Established from code at HEAD, from reading
      every handler in src/app/api/webhooks/clerk/route.ts.
      THE COMPLETE HANDLER SET is five events: organization.created (:41),
      organization.updated (:54), organizationMembership.created (:62),
      user.updated (:223), organizationMembership.deleted (:243). There is NO
      organization.deleted and NO user.deleted. Deletion is the only lifecycle
      verb the mirror does not implement.
      THREE CONSEQUENCES, and the second is the one that bites:
      (1) DELETION DOES NOT PROPAGATE. Deleting a Clerk org leaves the
      Organization row; deleting a Clerk user leaves the User row.
      organizationMembership.deleted fires per member and unlinks
      StaffMember.userId and deletes StoreUserAssignment rows (:264-266) — but
      it does NOT delete the User row, so even removing every member leaves the
      org undeletable, since User is one of the 44 RESTRICT FKs.
      (2) THE DATABASE ROW REGENERATES. organizationMembership.created UPSERTS
      the Organization on clerkOrgId (:71), explicitly because Clerk does not
      guarantee webhook ordering. So a row deleted while its Clerk org survives
      comes back the moment anyone is added — with a NEW cuid, the same
      clerkOrgId and the same name. The cleanup undoes itself, and the
      replacement is HARDER to reason about than what was deleted, because its
      id no longer matches anything on any row.
      (3) A RENAME AGAINST A DELETED ROW NEVER STOPS FAILING.
      organization.updated does a bare `prisma.organization.update` (:56), not
      an upsert. With no row it throws P2025, the handler 500s, and Svix retries.
      This one needs no cleanup to trigger it — it fires the first time anyone
      renames an org whose row is missing for any reason.
      WHY IT IS FILED RATHER THAN FIXED: DEBT-44a was an audit session with no
      code changes in scope, and the fix is a design question rather than a
      patch. Deletion semantics are not obvious — whether organization.deleted
      should cascade, refuse, or soft-delete is a product ruling, and with 44
      RESTRICT FKs a naive cascade handler would be the most destructive code
      path in the app, reachable from a Clerk dashboard button. Related: HR-14's
      Clerk-org-rename issue, which lives on the same handler this row calls out
      at (3).
      THE WORKAROUND, WHICH IS NOT THE FIX, and it is recorded on DEBT-44
      because that is where someone will be standing: delete the CLERK side
      first, then the database row, and only where the Clerk org is being
      deleted too. Where the Clerk organization is being KEPT there is no safe
      order at all and the ruling is do not clean it up. That is a live
      constraint on DEBT-44's Tier 1, and the reason its Tier 2 needs a third
      step nobody has authorised.
      Related: DEBT-44 (the cleanup this blocks, and the ordering ruling),
      DEBT-46 (the other half of the Clerk/database asymmetry), DEBT-39
      (unmirrored writers), HR-14 (the rename issue on handler (3)).

  - id: DEBT-48
    title: >
      AWAITING RULING — Implement the checklist availability window, or remove
      the fields — the half of DEBT-29 that a relabel could not settle
    notes: >
      COST OF DOING NOTHING: The form is now honest — it says the phase is a
      label and says the offsets are not yet used — so nobody is misled and
      nothing is broken; what is missing is a capability, not a fix — NONE.
      A legitimate NONE: DEBT-29 closed the harm on 2026-08-02, and what is left
      is a product decision that can wait indefinitely without anything
      degrading. DERIVED AT HEAD BY DEBT-29-RELABEL 2026-08-02, not
      DEBT-TRIAGE-2's — this row did not exist when that pass ran.
      CREATED 2026-08-02 by Gary's ruling when DEBT-29 closed on its RELABEL half.
      Same shape as DEBT-5 splitting into DEBT-27: closing DEBT-29 whole would
      have retired the subject from the open list while the capability question
      was still open and while three columns still collect values nothing reads.
      Prompt for the session that closed the other half:
      docs/prompts/DEBT-29-RELABEL_honest_copy.md.
      THE STATE AT HEAD, so nobody re-derives it: Template.operationalPhase,
      startOffsetHours and endOffsetHours are all collected, stored, exported and
      imported. The phase is a WORKING sequence key — it drives handoff-note date
      resolution, the note's shift_phase, and which templates you may hand off to
      (src/lib/messages.ts:38-67; handoff-notes.tsx:130, :138, :141). The two
      offsets are read by NOTHING. No code path joins either to StoreHours
      (prisma/schema.prisma:168-177), at generation or at listing.
      AWAITING GARY'S RULING: whether to build the window, or to remove the two
      offset columns and keep the phase as the label it already is.
      A THIRD OPTION, surfaced by DEBT-29-RELABEL and explicitly kept here rather
      than folded into the relabel: make the offsets OPTIONAL and blank by
      default, so templates stop carrying an invented 1/2 window nobody chose.
      Today they default to 1 and 2 (template-form.tsx:637-638) and are written
      on every StoreHours save, so the day a gate goes live those unchosen
      defaults become real windows for every existing row. That is a change to
      what the form writes, which is why it belongs to this decision and not to a
      copy change.
      SEQUENCING AGAINST DEBT-1 AND DEBT-32, carried over from DEBT-29 and still
      binding on the IMPLEMENT direction only: today a dirty phase string can at
      worst misorder a handoff note. Implementing the gate makes it decide WHEN A
      CHECKLIST APPEARS. DEBT-1 is `status: verified` — writers plugged in
      c17ccc1, backfill clean on all three branches, promoted to production
      2026-08-01 in 63407be — so the soak it demanded has happened; this is a
      pointer to the reason, not an open blocker. DEBT-32 (retire the I-14b alias,
      fold the three phase lists into one) is the natural thing to do first if
      this is built, since a gate should read one list rather than three.
      ────────────────────────────────────────────────────────────────
      GARY'S THINKING ON THE EVENTUAL SHAPE — RECORDED 2026-08-02 AS THINKING,
      NOT AS A RULING, AND NOT AS A SPEC. It is here so it is not lost. Nobody
      should implement from it without Gary scoping the phase first.
      THE SHAPE: availability is PER TEMPLATE, not per org, and a closed window
      makes a checklist OVERDUE — visible, flagged, still completable — never
      hidden.
      WHY, from two real operating scenarios. (1) An opener arrives late and
      misses the window. Under hard enforcement the morning checklist disappears
      and the cash-drawer count and petty-cash audit go undone. Nobody skipped
      them; the system withdrew them. For a compliance product a task that
      VANISHES is worse than one left unfinished, because unfinished is visible
      and vanished is not. (2) An owner-operator ignores the opening checklist
      because they can. The 11am employee opens the app and sees it untouched —
      is it theirs? was it skipped? should they do it four hours late? With no
      enforcement at all the list stops meaning "what you need to do" and starts
      meaning "everything that exists".
      OVERDUE-NOT-HIDDEN ANSWERS BOTH: (1) keeps the tasks completable, and (2)
      gives the 11am employee "Opening — overdue, not completed", which is an
      answer rather than a puzzle.
      PER TEMPLATE because the two scenarios differ BY CHECKLIST, not by org. A
      cash-drawer count is genuinely time-bound; a deep-clean list is "do this
      today". One org-wide switch forces one answer for both. Per-template also
      makes the whole question lower-stakes: with overdue-not-hidden the worst
      case is a longer list, not a missed audit.
      TWO QUESTIONS THIS SHAPE RAISES, UNANSWERED, recorded so they are not
      rediscovered. (a) What does OVERDUE do across day boundaries? A closing
      checklist unfinished at 11pm is overdue; at 6am is it still overdue, or
      closed out and recorded as missed? Without an answer the opening crew
      inherits a growing pile from previous shifts. There is probably a point
      where an unfinished checklist stops being actionable and becomes a
      compliance record. (b) What do the OFFSETS mean once the window is soft?
      Today they read as a hard boundary. Under overdue-not-hidden they describe
      an EXPECTED start and end, not an allowed one — the same two numbers
      carrying a different meaning. State it, or someone will implement them as
      enforcement later.
      ────────────────────────────────────────────────────────────────
      SCOPE NOTE, AND IT IS THE POINT OF THIS ROW: this has outgrown a debt row.
      Per-template availability with overdue states and a day-boundary policy is
      a FEATURE PHASE, not a cleanup. THIS ROW'S JOB IS TO HOLD THE THINKING
      UNTIL GARY SCOPES IT AS ONE. Do not let it ride along with a debt session.
      Disconfirmed by: any availability filter keyed on operationalPhase or the
      offsets appearing in the codebase — at which point the IMPLEMENT direction
      was taken and this row describes history. Related: DEBT-29 (the relabel
      half, closed), DEBT-1, DEBT-32, DEBT-30.

  - id: DEBT-49
    title: >
      No admin control sets StaffMember.isCorporate — the DEBT-9 designation is
      SQL-only, so a corporate hire cannot be marked without a Neon console
    notes: >
      COST OF DOING NOTHING: The two known corporate staff are set by SQL in
      DEBT-9 Phase 4 and every read path honours the flag, so nothing is wrong
      for anyone who exists today; the gap opens only when a THIRD corporate
      person is hired and no one in the product can mark them — LATENT (trigger:
      the next corporate hire, or any store-homed employee moving to corporate.
      Until then the flag is correct for 100% of rows).
      CREATED 2026-08-02 by Gary's ruling deferring DEBT-9 Phase 3d. The reason
      for the defer was scope, not doubt: DEBT-9 Phase 0 finding 4 added the
      whole self-serve signing path to that session, which put HR-11 ceremony
      re-verification on the critical path, and the toggle has no users today.
      Prompt: docs/prompts/DEBT-9_corporate_work_location.md.
      THE ASSESSMENT IS THE CONTENT OF THIS ROW — measured at head during
      DEBT-9 Phase 0, recorded so it is not re-derived. Two things make this
      bigger than a checkbox, and both are easy to miss on a second look:
      (1) THE GATE ASYMMETRY. The natural home, StaffEditActions, renders for
      ADMIN *and* in-scope MANAGER — src/app/(app)/staff/[id]/page.tsx:545 gates
      it on canSeeNotes (:87, ADMIN || MANAGER). But the brief requires this
      control to match the PRIMARY-STORE CHIP path, which is ADMIN-only:
      src/app/(app)/staff/page.tsx:266 passes canEdit={isAdmin}. PATCH
      /api/staff/[id] admits managers wholesale (route.ts:29-32) and documents
      the asymmetry it already lives with at :94-98. So isCorporate would be the
      FIRST field in that route needing its own per-field role gate. The
      recommendation at the time — not ruled on — was a separate ADMIN-gated
      control rendered NEXT TO StaffEditActions rather than a field inside the
      manager-visible dialog, precisely to avoid adding a per-field gate to a
      shared route.
      (2) THE STALE-STAR RULE, genuinely undecided. Flagging someone Corporate
      while they still hold an isPrimary assignment leaves a starred chip on
      /staff/[id] (page.tsx:501-507) that primaryStoreName() now ignores — the
      UI would assert a home store the signed record contradicts. Whoever builds
      this must pick one: clear isPrimary on flagging, refuse the flag while a
      primary is set, or render the star suppressed for corporate staff. The
      Zod schema (route.ts:7-17), the dialog state (staff-edit-actions.tsx:56)
      and BOTH transaction branches (route.ts:125-153) have to agree on whichever
      is chosen — the branch that replaces assignments wholesale and the
      light-touch branch that only moves the flag.
      NOT A BLOCKER ON ANYTHING. DEBT-9's read paths, surfaces and data all ship
      without it; this row is purely the write affordance.
      Disconfirmed by: an isCorporate control appearing in staff-edit-actions.tsx
      or beside it with an ADMIN check in PATCH /api/staff/[id]. Related: DEBT-9
      (the parent), BUILD-2 (the primary-store chip path this must match).

  - id: DEBT-50
    title: >
      No in-app organization switcher — once an active org is set there is no
      way to change it, and two orgs answer to the name "Keva Juice"
    notes: >
      RESTATED 2026-08-04 after the audit + fix + evidence cycle. The row's
      two halves now stand as: (A) DUPLICATE IDENTITIES — mechanism ruled
      (see DECISIONS.md 2026-08-04): no live duplicates on production, the
      dev pair is a known artifact of dev's open configuration, the
      measured production "duplicates" are fossils (one cross-instance, one
      DEBT-47 ghost). Production minting paths closed by F4 (3784c34) and
      restricted mode (F3 ruling). The Task 5 invite guard remains an
      optional hardening, deprioritised. (B) ORG SWITCHER / MULTI-ORG —
      unchanged: not supported by the schema (clerkUserId @unique + required
      organizationId), sized L (Option 1, composite uniqueness) in the
      2026-08-04 audit, and MUST NOT ship before the DEBT-55 sweep; the F1
      guard (5695aab) is the prerequisite that made the current state safe.
      This half stays planned.
      The row's title and Disconfirmed-by clause were wrong (tested the
      switcher, not the duplicates) — corrected with this restatement.
      ── ORIGINAL TEXT BELOW, UNCHANGED ──
      COST OF DOING NOTHING: Nobody is blocked from working, because a session
      that lands on the right org stays on it; the cost lands on whoever needs
      to CHANGE org — they must leave the app for the Clerk account portal or
      sign out — and on anyone verifying anything in a browser, who has no way
      to confirm in-app which org they are looking at — LATENT (trigger: named
      and it already fired once. Any user belonging to 2+ orgs, which on dev is
      gary@kevajuice.com today; and any browser verification session, which is
      how this was found).
      FOUND 2026-08-02 during DEBT-9 Phase 3, by walking into it. A ceremony
      walk was started against org_3FhMmIWVjja5HYpsou8n6rVtZn2 while the fixture
      under test lived in org_3FhYUR4l0ue7egug1I0Ig8wxOVn. /staff returned 200,
      rendered a plausible roster, and passed the hr module gate — both orgs
      carry hr in activeModules. Nothing errored. The session was simply looking
      at the wrong company. Prompt:
      docs/prompts/DEBT-9_corporate_work_location.md.
      CORRECTION, SAME SESSION, AND IT CHANGES WHAT THIS ROW IS FOR. The first
      draft of this row said the session was on the wrong org and needed a
      switcher. Measured afterwards in the page via window.Clerk, that was
      wrong: the signed-in account had membershipCount = 1. THERE WAS NO SWITCH
      TO MAKE. The actual condition is DUPLICATE CLERK ACCOUNTS SHARING AN
      EMAIL — two accounts both `gary@kevajuice.com`,
      user_3FhMl9WeyNaGexqdaCEa5gEkU6P (admin of the 0-store org) and
      user_3FhYUMgQoq9CFsnypYy3in9ajCg (admin of the 9-store org) — each a
      member of exactly one of the two same-named orgs. A switcher would NOT
      have resolved that incident; nothing in-app could have, because the
      account genuinely could not reach the other org.
      SO THE (a) HALF BELOW IS THE VALUABLE ONE, and this correction is why. A
      persistent active-org display would have shown the session was somewhere
      unexpected within seconds. The (b) switch half remains worth building on
      its own merits and would not have helped here. Recorded rather than
      quietly rewritten because the wrong diagnosis was ARRIVED AT from real
      evidence and held for several minutes — the roster was genuinely the
      wrong org's, which made "you're on the wrong org, switch" feel complete.
      THE STATE AT HEAD: src/app/(app)/layout.tsx:20 renders Clerk's
      <OrganizationList> ONLY inside `if (!orgId)`. Once Clerk has an active
      org that branch is unreachable, and nothing else in the app renders an
      OrganizationSwitcher — grepped at head, the only other setActive hits are
      unrelated useState calls in labor settings and the roadmap client. The
      sidebar shows the user's name and email and a Sign out button; it does
      NOT show which organization is active.
      TWO PARTS, and the cheap one is worth more than the expensive one.
      (a) DISPLAY the active org name somewhere persistent — the sidebar, next
      to the user block. Cheap, and it is what turns a silent wrong-org session
      into an obvious one. (b) SWITCH orgs in-app, via Clerk's
      <OrganizationSwitcher>. More involved: it needs a decision about what
      happens to in-flight state on switch, and every page is org-scoped.
      Doing (a) alone would have prevented the incident above.
      DISPLAY IS NOT ENOUGH ON ITS OWN, and this is the part not to lose: BOTH
      dev orgs are named "Keva Juice". A sidebar showing the NAME would have
      read "Keva Juice" in the wrong org too. Whatever is displayed must
      disambiguate duplicates — the org id, or a slug, or a store count. This
      is the same lesson as the branch-vs-branch-id rule in CLAUDE.md § Database
      Evidence: a name is not an identifier.
      RELATED CLEANUP, not this row: the duplicate orgs AND the duplicate
      accounts. DEBT-44 owns deleting dead org shells on staging; dev has the
      same condition and worse (four orgs, two named "Keva Juice", two empty;
      plus two Clerk accounts on one email). Cleaning dev is not tracked
      anywhere yet — but note that cleanup would NOT close this row, because a
      single-org user today is a two-org user tomorrow.
      MEASURED AT HEAD on branch dev (br-broad-wave-a6vpjdw0), 2026-08-02, so
      the next reader does not re-derive it:
        org_3FhYUR4l0ue7egug1I0Ig8wxOVn  "Keva Juice"  9 stores  6 staff
          ADMIN gary@kevajuice.com   user_3FhYUMgQoq9CFsnypYy3in9ajCg
          ADMIN taylin@keva.com      user_3G9oexUgTFFOEkH4Eu6UKLXdp4O
        org_3FhMmIWVjja5HYpsou8n6rVtZn2  "Keva Juice"  0 stores  1 staff
          ADMIN gary@kevajuice.com   user_3FhMl9WeyNaGexqdaCEa5gEkU6P
      Only the FIRST org can exercise anything store-shaped. Any future browser
      verification on dev should assert its org id before trusting a screen.
      Disconfirmed by: an OrganizationSwitcher, or a persistent active-org
      display that distinguishes two same-named orgs, appearing in the app
      shell. Related: DEBT-44 (org shell cleanup), CLAUDE.md § Browser Evidence
      (the precondition written the same day this was found).

  - id: DEBT-51
    title: >
      An orphaned PendingInvite soft-deadlocks /staff/[id] — the "Invite pending"
      badge hides the re-invite button and that page has no revoke control
    notes: >
      COST OF DOING NOTHING: A staff member whose self-service invite row is
      orphaned can never be re-invited from their own page — the button that
      would do it is hidden by the very row that is stuck — LATENT, and only
      for rows carrying a staffMemberId (trigger: any orphaned staff invite;
      zero measured today, since the one live orphan on preview/staging
      (kevajuice14@icloud.com) has staffMemberId null and the production row
      karson@keva.com was revoked 2026-08-03).
      CREATED 2026-08-03 by Gary's ruling during DEBT-46 Phase 0. Deferred on
      COST, not doubt — see the reasoning below. Prompt:
      docs/prompts/DEBT-46_pending_invite_case_and_orphans.md.
      THE MECHANISM, measured at head during DEBT-46 Phase 0.
      src/app/(app)/staff/[id]/page.tsx:92 reads invitePending with a
      findFirst on staffMemberId — NO Clerk call, so it is the one
      database-driven PendingInvite surface in the app and the only place an
      orphan renders at all. It renders as a warning badge (page.tsx:505) and,
      at self-service-actions.tsx:170, it GATES the "Invite to self-service"
      button: `email && !hasLogin && !invitePending`. So the orphan is not
      merely visible-but-stale, it actively blocks the recovery action. The
      page carries no revoke or delete control, so the only exits are accepting
      the dead invitation or terminating the member (staff-termination.ts:60
      deletes by staffMemberId and does clear it).
      WHY DEFERRED RATHER THAN FOLDED INTO DEBT-46 PHASE 3. Two reasons, and
      the second is the one that decided it.
      (1) PHASE 3 RELIEVES IT AS A SIDE EFFECT. Phase 3 lists orphaned
      PendingInvite rows on /users with a delete action; deleting the orphan
      there clears the row, which un-hides the button here. So an admin who
      knows about /users is never permanently stuck — the deadlock is on this
      page, not in the data.
      (2) THE FIX COSTS A CLERK CALL ON A PAGE THAT MAKES NONE. Making
      /staff/[id] self-sufficient means classifying the row against Clerk's
      invitation list — the same classification Phase 3 builds — which adds a
      Clerk round-trip to a staff detail page that currently makes zero, on
      every staff view. That is a real per-load cost for a case with no
      measured instances.
      WHAT A FIX WOULD LOOK LIKE, so it is not re-derived: either pass the
      classification down from a shared helper (cheapest if Phase 3 already
      built one and something upstream is already fetching invitations), or
      gate the button on `!invitePending || inviteIsOrphaned` with the orphan
      determination made server-side. Do NOT simply drop the badge — it is
      correct information; the defect is that it gates an action.
      Disconfirmed by: /staff/[id] offering a way to clear or ignore a stuck
      invite, or the re-invite button ceasing to be gated on a row whose Clerk
      invitation is not pending. Related: DEBT-46 (the parent — Phase 3 is the
      /users half of the same design gap), HR-7 (which created the
      staffMemberId invite path this deadlocks on).

  - id: DEBT-52
    title: >
      No surface lists an orphaned PendingInvite — a row whose Clerk invitation
      is gone still carries a role grant nothing can show, and expiry makes one
      with nobody touching anything
    notes: >
      COST OF DOING NOTHING: Two orphans exist right now and neither is visible
      in the product; each carries the app role its invite was written with, and
      that role BEATS the Clerk membership role on acceptance — ACTIVE, not
      latent (trigger: already fired twice, and expiry fires it again on every
      invitation that is neither accepted nor revoked before it lapses).
      CREATED 2026-08-03 by Gary's ruling scoping DEBT-46 Phase 3 to step 1
      only. Step 1 (pagination) SHIPPED; this row is the remainder, deferred for
      fresh attention rather than for doubt. Prompt:
      docs/prompts/DEBT-46_pending_invite_case_and_orphans.md.
      STILL UNREACHABLE AND STILL UNREMOVABLE — DEBT-46 CLOSED WITHOUT FIXING
      EITHER FOR EXISTING ROWS, and this paragraph is the reason that closure is
      not a claim of safety. DEBT-46's argument was that unreachable AND
      unremovable together are what make an orphan dangerous. Phase 1 fixed the
      revoke button MANUFACTURING orphans and fixed it reporting success when it
      deleted nothing. It did NOT make an existing orphan removable. The route
      reads the invitation first and returns 404 when Clerk has none or 409 when
      the status is not pending, and on both paths it declines to delete the row
      BY DESIGN — deleting on an error return would be a hidden destructive side
      effect. It is unreachable anyway: the route is keyed on a Clerk
      invitationId, and the only control that supplies one renders on pending
      invitations only. So for the two live orphans BOTH halves of DEBT-46's
      danger condition remain true today, and work item (c) below is the only
      planned path to removal. Until it ships, the sole way to delete an orphan
      is by hand in the Neon console, which is how karson@keva.com was cleared
      on production.
      THE DESIGN GAP. /users builds its pending list from CLERK
      (getOrganizationInvitationList, status pending) and uses the database rows
      only as a lookup map — so a PendingInvite whose Clerk invitation is
      revoked, expired or accepted-without-webhook renders NOWHERE. /stores
      reads the rows but only flattens them into takenEmails, where an orphan
      silently reserves an address and steers the admin to a plus-addressed
      variant for a reason it never states. /staff/[id] is the sole
      database-driven surface and shows only a boolean badge, for rows carrying
      a staffMemberId (DEBT-51). Rows written by POST /api/users — the dangerous
      shape, ADMIN with zero stores — have staffMemberId null and NO surface at
      all.
      WHY THE GRANT MATTERS: the webhook resolves the app role as
      `pending?.role ?? roleMap[membership.role] ?? "STAFF"`, so the row wins.
      It fires on the upsert's CREATE branch only — a first-time acceptor, a NEW
      Clerk account on the same address, or an identity whose User row was
      deleted while its Clerk user survived. It does NOT re-role an existing
      member; the broader claim is wrong and has been stated wrongly before.
      FOUR WAYS AN ORPHAN IS MADE, measured or code-derived 2026-08-03, one of
      them now closed:
      (1) revoke-first-delete-second on a case-mismatched row — CLOSED by
      426f07c, which reversed the order and made the delete insensitive;
      (2) a revoke performed in the CLERK DASHBOARD, which never reaches
      /api/users/invitations/[invitationId] — the webhook handles five event
      types and NONE of them are invitation events, so nothing in Froot reacts;
      (3) /users auto-sync creating the User without deleting the PendingInvite
      (page.tsx) — only the webhook deletes, so any acceptance the webhook does
      not complete strands the row, and merely LOADING /users is enough;
      (4) EXPIRY, which needs no user action at all: Clerk drops the invitation
      from the pending list, nothing deletes the row, and the grant goes
      invisible while everyone is asleep. This is the strongest argument for the
      row and it is the one nobody can be trained out of.
      THE TWO LIVE ORPHANS, both named by branch per CLAUDE.md § Database
      Evidence: preview/staging (br-square-feather-a63z92vz), org cf888f2d…
      (org_3FhYUR4l0ue7egug1I0Ig8wxOVn), kevajuice14@icloud.com STORE 1 store
      createdAt 2026-06-30 — a User exists for that address, so it was accepted
      and the row survived, which is path (3); Clerk logs FIVE invitations to it
      (3 accepted, 2 revoked), the revoked pair being path (2)'s own record.
      preview/main (br-purple-rain-a6m62xww) inherits karson@keva.com from
      production. The production copy was revoked 2026-08-03 and its deletion
      MEASURED (karson_rows = 0 on br-sparkling-block-a620qvg4) — that one is
      closed, and it is the reason this row is not urgent.
      THE WORK, in order. (a) classify every PendingInvite against Clerk by
      fetching all four statuses (pending/accepted/revoked/expired) — ONE call,
      not an extra one, since the pending list becomes a filter over the same
      data, and step 1's fetchAllClerkPages already drains it; (b) an "orphaned
      invites" section on /users rendered only when non-empty, showing role,
      stores, createdAt and WHICH of the four statuses explains it; (c) DELETE
      /api/users/pending-invites/[id], keyed on PendingInvite.id and NOT on a
      Clerk invitation id which by definition may not exist, 404 on count zero
      like 426f07c; (d) ONE-WORD HARDENING that (c) is what makes necessary —
      webhooks/clerk/route.ts delete -> deleteMany, because an admin deleting an
      accepted-bucket orphan in the seconds before the webhook fires would throw
      P2025 and Svix would retry that 500 forever.
      NOT A SUBSTITUTE: handling organizationInvitation.* webhook events would
      close paths (2) and (3) at the source, but it is unconfirmed that Clerk
      emits an EXPIRY event at all — and expiry is the path with no user action
      behind it. The UI surface is required either way.
      TWO CLERK LIST CALLS ARE STILL CAPPED, deferred by Gary 2026-08-03 with
      the severity analysis attached so it is not re-derived. Both are the same
      defect DEBT-46 Phase 3 step 1 fixed on /users and GET /api/users — Clerk's
      list endpoints return the first TEN by default — and both are three-line
      changes against the helper that now exists, src/lib/clerk.ts
      fetchAllClerkPages. Deferred because both fail in survivable directions,
      not because they are wrong:
      (i) src/lib/staff-termination.ts:73 — getOrganizationInvitationList with
      NO limit, so terminating a staff member revokes their pending Clerk
      invitation only if it sits in the first ten. Past that the invitation
      stays live and redeemable AFTER termination. LESS SEVERE THAN IT READS:
      the PendingInvite row is deleted by id regardless, so the role grant is
      already gone and an acceptor lands STAFF via roleMap, and the status gate
      catches an accepted-later invite (the catch block there says so). Residual
      is a terminated person obtaining a STAFF login — real, but not an
      escalation. Trigger: >10 pending invitations in the org at termination.
      (ii) src/app/api/users/[id]/route.ts:135 —
      clerk.users.getOrganizationMembershipList with NO limit. This lists the
      ORGS A USER belongs to, not the members of an org, so the threshold is a
      user in more than ten organizations. Past it the membership is not found
      and the route returns 409 "User has no Clerk membership in this
      organization" for a user who has one. FAILS CLOSED — it refuses the role
      edit rather than mis-granting, which is the right direction to fail, and
      is why this is the lower priority of the two. Note DEBT-50: multi-org
      users already exist here, so the trigger is not exotic, only distant.
      MEASUREMENT HAZARD INHERITED FROM DEBT-46, kept because this row will
      re-run these queries. DEBT-44a's confirmation query on the Taylin row
      returned `n = 1` with an EMPTY detail string: the detail concatenated
      `array_length(p."storeIds", 1)`, NULL for an empty array, and
      `NULL || text` is NULL, so `string_agg` aggregated nothing. Zero stores —
      the thing that made the invite notable — is what blanked the evidence
      describing it. Use `coalesce(array_length(...), 0)`, and treat any check
      whose count and whose detail can disagree as defective.
      Disconfirmed by: /users showing a PendingInvite whose Clerk invitation is
      not pending, with a way to delete it; and both call sites above draining
      through fetchAllClerkPages. Related: DEBT-46 (the parent, CLOSED
      2026-08-03 on the manufacturing paths only), DEBT-51 (the /staff/[id]
      half, which this relieves as a side effect), DEBT-50 (the multi-org
      condition behind (ii)'s trigger), DEBT-44 (where this was found, and the
      create-branch condition on the precedence), DEBT-17 (which first saw
      kevajuice14 and correctly declined it), DEBT-47 (the other half of the
      Clerk/database asymmetry).

  - id: DEBT-53
    status: staging
    commits: ["5695aab"]
    title: >
      Cross-org privilege escalation in getCurrentUser() — wrong-org User row
      was admitted with its role
    notes: >
      VERIFIED ON STAGING 2026-08-04 (Gary). Deployed SHA confirmed
      3784c34c511f898087af57ce9ffa3820db18f583. Guard-path test: a
      two-membership identity (indianathomas+f1test, dev instance) with its
      User row in org cmr431pps000004lgngxtm5ku ("Microsoft") and session
      under the dev Keva Juice org was refused — /users, /settings, /staff,
      /stores all bounced to /dashboard, store lists empty, and the Vercel
      runtime log shows "[auth] cross-org User row refused:
      clerkUserId=user_3HSdr0ylU1kkaYGlEnMQWQA8qx5 ..." firing on /stores
      (307) and /dashboard. Happy path unchanged for single-org users. Test
      account deleted after.
      COST OF DOING NOTHING: LATENT, one dashboard click from LIVE — a Clerk
      identity with memberships in two orgs was admitted to the second org
      carrying the first org's role, and isAdmin short-circuits store
      scoping, so an ADMIN of org A saw every store, staff member, count and
      message in org B. Trigger: adding any second org membership to any
      existing identity — a single Clerk-dashboard action, no code change.
      MECHANISM: clerkUserId is @unique on User, so exactly one row exists
      per Clerk identity globally. auth.ts:67 resolved that row by
      clerkUserId alone; requireAdmin() (:74) tested dbUser.role without
      comparing dbUser.organizationId to the session org.
      FIX: a wrong-org row is treated as ABSENT — the same shape
      getActiveStaffSelf() has used since HR-7. Mismatch fails closed with a
      console.warn naming both org ids (Gary's ruling), so a lockout is one
      log grep, not a silent bounce loop.
      WHY IT IS SAFE: the change introduces no new throw — it only turns a
      non-null dbUser into null, which all 171 call sites already handle
      because findUnique could always return null. Enumerated at fix time:
      94 requireAdmin/requireManagerOrAdmin sites (52 API files -> 403, all
      wrapped; 7 page sites -> redirect), ~60 getUserStoreScope sites
      (null-total: empty scope, can() denies role:null), 17 direct sites.
      CANNOT CAUSE A WRONG-ORG WRITE: both User writers upsert on
      clerkUserId; the UPDATE branch writes email alone.
      PRE-PROMOTION LOCKOUT CHECK RUN 2026-08-04, branch
      br-sparkling-block-a620qvg4: live org
      cf888f2d-f234-48c7-8097-fd5b44b5b3dd holds all 6 real User rows; every
      other org's rows are dev-instance fossils or deleted-vanity-org rows
      (see DEBT-57). No production user sits on a wrong-org row. SAFE TO
      PROMOTE.
      KNOWN LOCKOUT CLASS, named not assumed away: a User row left stale by
      an org move — membership.deleted leaves the row carrying the old org
      and no writer can correct it. Before this fix such a user was silently
      served the old org's role (this bug firing on a single-membership
      user); now they degrade to STAFF-level with no in-app repair. Own row:
      DEBT-56.
      NOT SWEPT: 21 page-level findUnique({ clerkUserId }) sites with the
      same missing guard — UI-only in effect (every gate behind them refuses
      independently) but the reason a mismatched user still sees an
      overpromising sidebar. Own row: DEBT-55, which carries the site list.

  - id: DEBT-54
    status: staging
    commits: ["3784c34"]
    title: >
      accept-invite failed toward sign-up — the one flow that can mint a
      duplicate identity
    notes: >
      VERIFIED ON STAGING 2026-08-04 (Gary), same deployed SHA as DEBT-53.
      Three tests: (1) real invite link for an existing dev-instance account
      (gary@kevajuice.com) landed on /sign-in with __clerk_ticket intact;
      (2) regression test — the same ticket loaded at /accept-invite with NO
      __clerk_status parameter landed on /sign-in (before this commit that
      URL went to /sign-up); (3) Clerk's own reused-ticket error also
      directs to sign-in. Invitation revoked after.
      COST OF DOING NOTHING: LATENT, armed by any invite to an existing
      address — every __clerk_status except the single literal "sign_in"
      sent the invitee to the sign-up form, the one flow that can mint a
      second Clerk identity for an email that already has one. Triggers:
      rehires, re-invites, link rewriters that strip parameters, future
      Clerk status values.
      MECHANISM: route.ts:28 was status === "sign_in" ? "/sign-in" :
      "/sign-up" — an exact-equality allow-list of one value; absent,
      malformed and future statuses all fell to sign-up. This is DEBT-50
      hypothesis H2.
      FIX: default inverted — /sign-up only on the explicit "sign_up"
      status; everything else including absent goes to /sign-in. The
      failure direction now points at the flow that cannot create an
      identity. Ticket passthrough unchanged (set after dest,
      destination-agnostic; both targets read it off the query string).
      RELATED, NOT DONE: the invite guard (DEBT-50 audit Task 5) remains
      open as an option, deprioritised — see the DEBT-50 mechanism ruling:
      with F4 shipped and production restricted mode ON, no active
      duplicate-minting path remains on production.


  - id: BUILD-1
    track: build
    size: S
    status: shipped
    shipped: 2026-07-27
    commits: [6a77e68, 06b1561]
    title: "Separate local builds from production migrations (vercel-build split)"
    notes: >
      Config only, no product code. Before: `build` was
      `prisma generate && prisma migrate deploy && next build`, so every local
      `npm run build` ran migrate deploy against whatever DATABASE_URL resolved
      to — which per DEBT-4 is the PRODUCTION branch. After: `build` is
      `prisma generate && next build` and a new `vercel-build` is
      `prisma migrate deploy && npm run build`. Verified at source, not assumed:
      @vercel/next resolves the build script via
      getScriptName(pkg, ["vercel-build", "now-build", "build"]), so vercel-build
      wins; and the project's Vercel Build Command is the default, NOT overridden
      (checked with `vercel project inspect`), which is what makes the approach
      valid. vercel-build delegates to `npm run build` rather than duplicating
      its body BECAUSE npm only fires pre-hooks matching the exact script name —
      verified empirically that `npm run vercel-build` runs prevercel-build, not
      prebuild. A copy-pasted vercel-build would skip
      scripts/generate-roadmap.mjs, and src/generated/roadmap.ts is gitignored
      and imported by the /internal/roadmap page, so the Vercel build would fail
      outright. Side benefit of the delegation: prisma generate now runs after
      migrations apply, not before. No CI exists (no .github/), and nothing else
      in the repo depended on `build` running migrate deploy.
      Local `.env` repoint is Gary's edit, not this session's — recommended a
      dedicated Neon dev branch over reusing staging, so local work cannot
      corrupt a staging verification run. Both DATABASE_URL (pooled) and
      DATABASE_URL_UNPOOLED (direct) need to point at it.
      CORRECTED 2026-07-27 — the sentence here previously read that
      DATABASE_URL_UNPOOLED was "ABSENT from local .env entirely", so
      prisma.config.ts had been falling back to the pooled production URL for
      every CLI command since BUG-3. That is now stale on BOTH counts. Verified
      2026-07-27: DATABASE_URL_UNPOOLED IS present in local .env, host
      `ep-late-water-a6k53nv2` with no `-pooler` suffix, and DATABASE_URL is the
      same endpoint's `-pooler` host. There is no fallback happening and
      prisma.config.ts emits no warning. Note the endpoint id: `ep-late-water`
      is neither production (`ep-green-smoke`) nor staging (`ep-odd-rain`), so
      the recommended dedicated dev branch appears to have been created and
      wired up — see DEBT-4, whose "NOT done yet" text is stale for the same
      reason.
      VERIFICATION STEP 3 SATISFIED 2026-07-27, IN PRODUCTION — stronger than
      the staging log this phase asked for. Production deployment EHfDfAKJR
      (14:49) logged:
        Running "npm run vercel-build"
        > prisma migrate deploy && npm run build
        Loaded Prisma config from prisma.config.ts
        31 migrations found; No pending migrations to apply.
      Both halves of the risk are answered by those four lines. `vercel-build`
      WAS picked up — Vercel invoked it by name, confirming the @vercel/next
      getScriptName precedence held against a real deployment rather than
      against a source reading. And migrate deploy ACTUALLY RAN — it enumerated
      31 migrations. The failure mode this phase feared was migrations silently
      ceasing to apply while builds stayed green, and a run that finds and
      reports the ledger is the opposite of that.
      STATUS CALL (Claude, 2026-07-27 — flag for Gary to overrule): flipped to
      `shipped`, blocker retained below. Reasoning: the code is in production
      via 06b1561 and this phase's own stated exit criterion is now met. The one
      remaining item is a Vercel-console configuration change that BUILD-1
      explicitly scoped OUT of itself ("out of scope for BUILD-1"), so holding
      `in_progress` would leave the phase permanently unclosable on work it
      disclaimed. Per this file's header, `blockers` are live problems "in a
      phase regardless of status" — a shipped row carrying an open blocker is
      the schema working as designed, not a contradiction. If Gary would rather
      the row stay open until the Preview vars exist, `in_progress` is the
      defensible alternative and only this line changes.
      Related: DEBT-4 (the finding this addresses), BUG-3 (closed by the same
      pair of build logs), SEC-2 and HR-14 (both schema-touching, both gated on
      this landing first — that gate is now lifted).
    blockers:
      - "CHANGED SHAPE 2026-07-27 — HALF CLOSED, HALF DEFERRED. This blocker is
         NOT the same problem it was this morning; read the new state before
         acting on it.
         CLOSED — step 1 of the two-step fix is DONE. Gary edited the Jun 26
         `DATABASE_URL` row in the Vercel console from **Production and
         Preview** to **Production only**. Preview deploys from non-staging
         branches therefore no longer resolve to the production database, and
         the original danger — a PR preview build running `migrate deploy`
         against production through pgbouncer, which was also the BUG-3 P1002
         condition — is gone. The edit was proven non-destructive: production

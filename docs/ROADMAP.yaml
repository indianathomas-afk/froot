  - id: DEBT-5
    title: "10 of 12 stores have storeNumber: null, degrading PERM-3's deterministic store sort"
    notes: >
      Logged 2026-07-27. Only Carson #0034 and Las Brisas #0014 carry a
      storeNumber; the other ten are null. PERM-3's no-storeId fallback
      (`forecastWindowForCaller`, used by /api/forecasting/audit, whose storeId
      is optional) sorts the caller's assigned stores by storeNumber THEN name,
      so with ten nulls it degrades to a name-only sort. Harmless today —
      name-only is still deterministic, and the sort only decides which store's
      timezone computes the window, where every store is currently in one
      timezone. It stops being harmless the moment stores span timezones, since
      the window boundary would then turn on a tiebreak nobody chose.
      The real fix is BUILD-2 (a primary-store flag mirroring
      StoreStaffAssignment.isPrimary); backfilling storeNumber is the cheaper
      interim and is a DATA change, not a code change — so it is gated on the
      same migration policy, not on BUILD-1. Related: BUILD-2, PERM-3's
      `deferred:` entry.

  - id: DEBT-6
    title: "Square sync fires from ~11 GET routes — a write path that greps as read-only"
    notes: >
      Logged 2026-07-27. `syncSalesForStore` / `ensureSalesCached` are invoked
      from roughly 11 GET routes — dashboard/summary, dashboard/rollup,
      dashboard/sales, and four inventory reports among them. Any org member's
      READ therefore triggers outbound Square API calls and SalesPeriodCache
      writes.
      Pre-existing, not goal data, and NOT a permission hole — the routes are
      gated and the cache is org-scoped. It is recorded for what it does to
      AUDIT METHOD: a write-path audit that greps only for non-GET handlers has
      a blind spot exactly here and would report these routes as read-only. Any
      future permissions or data-exposure audit should grep for the sync helpers
      BY NAME, not just for POST/PATCH/PUT/DELETE.
      Secondary consequence, relevant when SQ-3 is scoped: because these GETs
      reach getSquareClient, ordinary page loads are what currently triggers the
      lazy token refresh. That makes SQ-3's backstop cron insurance against a
      quiet week rather than a redundant addition.

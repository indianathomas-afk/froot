  - id: PERM-7
    track: permissions
    size: M
    status: staging
    commits: [6530d8b, bae09ed]
    title: "Store device logins — provision a store account from /stores, Square-seeded email, role-aware badge"
    notes: >
      Scoped 2026-07-27 with Gary.
      REFRAMED 2026-07-28 AGAINST PRODUCTION — this phase ESTABLISHES a
      convention; it does not formalise an existing one. The original framing
      ("makes an EXISTING CONVENTION first-class") rested on a single live
      example that does not survive contact with the production database. Every
      detail of it was wrong. Verified read-only on 2026-07-28 against the
      production Neon branch, org "Keva Juice" org_3FhYUR4l0ue7egug1I0Ig8wxOVn
      (the Square-connected one, 9 stores):
      the account assigned to Las Brisas is kevajuice14@icloud.com, NOT
      corporate@keva.com — no corporate@keva.com User row exists in production
      at all; its role is MANAGER, NOT STORE; it is assigned to TWO stores
      (Las Brisas AND South Reno), not one; Las Brisas has storeNumber NULL, so
      "#0014" does not exist; and User.name is null for all 8 production users,
      so nothing is named "Tommy Thomas" (the /users page composes its name
      column from Clerk's first/last name, not from the DB — see the Task 7
      note below, which turns on the same fact).
      THE LOAD-BEARING FINDING: there are ZERO users with role STORE anywhere
      in production. Role histogram across all orgs is ADMIN 5, MANAGER 2,
      STAFF 1. The pattern this phase claimed to make first-class has never
      been built once, and the nearest live account is a two-store MANAGER —
      a direct counterexample to "one store per device account".
      That does not invalidate the design, and one-store-per-device REMAINS
      THE RULE for accounts this flow creates (it is what sidesteps BUILD-2 for
      devices). It changes what the phase is: net-new convention, so the
      enforcement in (f) is the point rather than a tidy-up, and no existing
      account is evidence for the shape.
      Today a store device login would be built by hand: an admin invites a
      user on /users, picks role STORE, and ticks one store. Nothing names the
      pattern, nothing enforces it, and nothing provisions it in one step.
      NOT A SECOND PERMISSION MODEL — verified there is no direct
      user-creation path anywhere (provisioning is Clerk-invite-only), and Clerk
      authenticates an identity, not a database row. So "assign a Store as a
      User" necessarily mints a normal User with role STORE plus one
      StoreUserAssignment. Same objects the invite flow already produces,
      reached in one click from the page the admin is already on. Making Store a
      second permission-holding principal was considered and REJECTED: it would
      fork the capability layer PERM-1 deliberately unified, forcing every
      can() call site to ask "User or Store?" forever.
      SCOPE:
      (a) "Create device login" action on /stores, ADMIN-only, creating a User +
      a single StoreUserAssignment to that store. One store per device account —
      which also sidesteps BUILD-2 entirely for devices, since a one-store
      account has no primary-store ambiguity.
      (b) Role is CHOOSABLE at provisioning (Admin/Manager/Store), defaulting to
      STORE, with MANAGER marked recommended. See DECISIONS.md 2026-07-27 — this
      is role choice, not a capability override, so PERM-5's restrict-only
      invariant is untouched.
      (c) COUNT-AWARE warning AlertDialog when the chosen role is above STORE.
      The store picker is hidden for ADMIN
      (src/app/(app)/users/user-actions.tsx:104,230 — "Admins have access to all
      locations automatically"), so an ADMIN device account sees EVERY store.
      The warning must state the actual blast radius — "this gives the shared
      device at Carson access to all 12 of your locations" — so it is
      unalarming for a single-location operator and stopping for a twelve-store
      one, without the product judging who is sophisticated. Name concrete
      consequences: Square disconnect is ADMIN-gated by SEC-1 and drops the live
      org-wide token; dashboard goal PUT is ADMIN-only per PERM-2; F-5's audit
      log will record the device address, not a person.
      (d) Email SEEDED from Square, never live-synced. See DECISIONS.md.
      (e) Replace the ambiguous "Has Account" badge
      (src/app/(app)/stores/page.tsx:109-114), which is merely
      `store.userAssignments.length > 0` — a COUNT, not a concept. A MANAGER
      assigned to three stores lights it up on all three. Make it role-aware
      ("Device login" vs "Manager access"), show who, and LINK to /users. The
      first thing this phase buys is the ability to answer "does this store have
      a login, and whose is it?" on the page where the question is asked.
      (f) Enforce the STORE-is-a-device convention through the flow: default the
      account name to the store, not a person. Do NOT retro-repoint existing
      accounts; surface the drift instead.
      CORRECTED 2026-07-28 — the "Tommy Thomas on a corporate address" evidence
      cited here was wrong (see the reframe above; production User.name is null

    commits: [9dc6dc0]
    title: "Square token-refresh hardening — observability + refresh-ahead"
    notes: >
      Cherry-picked onto main alone (staging 81be8d9), ahead of the rest of the
      staging queue: the 2026-08-06 production token expiry made this the one
      time-critical item. BEHAVIOR CHANGE — the refresh trigger moved from
      "expires within 7 days" to "expires within 23 days". Square's guidance is
      to refresh every 7 days or less; with a 30-day token life and no issuedAt
      column, 23 days of remaining life (30 − 7) stands in for "older than 7
      days". Consequence: on the first production run, any token already inside
      that window refreshes immediately rather than at the old cliff. Also
      replaces the silent `if (!res.ok) return org` in refreshTokenIfNeeded with
      attempt/success/failure logging; no token value is ever logged, and any
      secret echoed back in a Square error body is redacted. VERIFIED on staging
      2026-07-26: runtime logs recorded `[square] token refresh success` against
      a real Square token (GET 200, org cmr54z65v000105jxczpt72w1) — the refresh
      call itself, not just the logging. Production's token (expiry 2026-08-06)
      was already inside the 23-day window at promotion, so the first Square
      request after deploy refreshes immediately rather than waiting; confirm it
      in the production runtime logs. Remaining SQ-1 follow-ups (cron backstop, helpers bypassing
      getSquareClient, oauth.authorization.revoked, settings UI showing expiry)
      are SQ-3 and stay on staging.
      Note text carried verbatim from main at the 2026-07-27 reconcile to
      pre-resolve the known merge conflict on this row; staging's own SQ-2
      commit is 81be8d9, recorded inline above rather than in `commits:` so
      both sides of the merge match byte-for-byte.

  - id: SQ-3
    track: square
    size: S-M
    status: planned
    title: "Square integration follow-ups — cron backstop, bypassing helpers, revocation webhook, expiry in settings"
    notes: >
      Created 2026-07-27. The SQ-1 findings SQ-2 deliberately did not carry;
      main's SQ-2 note already names SQ-3 as their destination, so this row
      makes an existing forward reference real rather than opening new scope.
      Scope: (a) a daily refresh cron as a BACKSTOP to the lazy path, never a
      replacement — viable on Hobby, where once-per-day is the cap (see F-1);
      (b) route the four helpers that bypass getSquareClient through it —
      fetchSquareTeamMembers / fetchSquareTeamMember /
      updateSquareTeamMemberName in src/lib/square.ts plus
      /api/square/locations — since a bypassing call never triggers a refresh;
      (c) handle the oauth.authorization.revoked webhook, so a revoked grant
      stops presenting as "Connected"; (d) surface token expiry in the settings
      UI, which today reports "Connected" off token presence alone.
    open:
      - >
        A static SQUARE_ACCESS_TOKEN exists in Vercel Production AND Preview
        (and in local .env). Determine whether anything still READS it — i.e. a
        helper bypassing the per-org OAuth tokens on Organization.
        squareAccessToken — or whether it is a stale credential to delete.
        These are opposite conclusions with opposite fixes: if it is read, it is
        a second, un-refreshed credential path that SQ-2's refresh work does not
        cover and that would outlive a disconnect; if it is unread, it is a live
        Square secret sitting in two environments for no reason. Note the
        overlap with (b) — the bypassing helpers are the most likely readers.

  # ---- Build / tooling ----

  - id: BUILD-1
    track: build
    size: S
    status: in_progress
    title: "Separate local builds from production migrations (vercel-build split)"
    notes: >
      Config only, no product code. Before: `build` was
      `prisma generate && prisma migrate deploy && next build`, so every local
      `npm run build` ran migrate deploy against whatever DATABASE_URL resolved
      to — which per DEBT-4 is the PRODUCTION branch. After: `build` is
      `prisma generate && next build` and a new `vercel-build` is
      `prisma migrate deploy && npm run build`. Verified at source, not assumed:
      @vercel/next resolves the build script via
      getScriptName(pkg, ["vercel-build", "now-build", "build"]), so vercel-build
      wins; and the project's Vercel Build Command is the default, NOT overridden
      (checked with `vercel project inspect`), which is what makes the approach
      valid. vercel-build delegates to `npm run build` rather than duplicating
      its body BECAUSE npm only fires pre-hooks matching the exact script name —
      verified empirically that `npm run vercel-build` runs prevercel-build, not
      prebuild. A copy-pasted vercel-build would skip
      scripts/generate-roadmap.mjs, and src/generated/roadmap.ts is gitignored
      and imported by the /internal/roadmap page, so the Vercel build would fail
      outright. Side benefit of the delegation: prisma generate now runs after
      migrations apply, not before. No CI exists (no .github/), and nothing else
      in the repo depended on `build` running migrate deploy.
      Local `.env` repoint is Gary's edit, not this session's — recommended a
      dedicated Neon dev branch over reusing staging, so local work cannot
      corrupt a staging verification run. Both DATABASE_URL (pooled) and
      DATABASE_URL_UNPOOLED (direct) need to point at it.
      CORRECTED 2026-07-27 — the sentence here previously read that
      DATABASE_URL_UNPOOLED was "ABSENT from local .env entirely", so
      prisma.config.ts had been falling back to the pooled production URL for
      every CLI command since BUG-3. That is now stale on BOTH counts. Verified
      2026-07-27: DATABASE_URL_UNPOOLED IS present in local .env, host
      `ep-late-water-a6k53nv2` with no `-pooler` suffix, and DATABASE_URL is the
      same endpoint's `-pooler` host. There is no fallback happening and
      prisma.config.ts emits no warning. Note the endpoint id: `ep-late-water`
      is neither production (`ep-green-smoke`) nor staging (`ep-odd-rain`), so
      the recommended dedicated dev branch appears to have been created and
      wired up — see DEBT-4, whose "NOT done yet" text is stale for the same
      reason.
      Status stays in_progress until verification step 3 — a staging build log
      showing migrate deploy actually ran. If vercel-build were not picked up,
      migrations would silently stop applying on deploy, which is worse than the
      problem being fixed; a green build is not proof.
      Related: DEBT-4 (the finding this addresses), BUG-3, SEC-2 and HR-14 (both
      schema-touching, both gated on this landing first).
    blockers:
      - "Vercel DATABASE_URL is a single env row tagged Production+Preview, so
         one value serves both. The branch-scoped Preview (staging) row overrides
         it on staging only — any OTHER preview branch gets the production
         database, and with no generic-Preview DATABASE_URL_UNPOOLED,
         prisma.config.ts falls back to that same pooled production URL. A PR
         preview build therefore runs migrate deploy against PRODUCTION. This
         survives the package.json fix untouched: vercel-build runs migrations
         against whatever DATABASE_URL resolves to. Untagging Preview from the
         production row is a Vercel-console change, out of scope for BUILD-1."
      - "RE-VERIFIED IN THE VERCEL CONSOLE 2026-07-27 — the blocker above is
         exact, and here is the row-level detail plus the fix. DATABASE_URL is
         ONE row tagged **Production and Preview** (Sensitive, added Jun 26),
         with a branch-scoped override for `staging` ONLY.
         DATABASE_URL_UNPOOLED has Production, Development and Preview→staging
         rows but NO generic Preview row. So a preview deploy from any branch
         other than staging gets the production database, and prisma.config.ts
         falls back to the POOLED production URL — meaning a PR preview build
         runs `migrate deploy` against production THROUGH PGBOUNCER, which is
         also precisely the BUG-3 P1002 advisory-lock condition. Latent only
         because Gary pushes staging and main and nothing else; it detonates on
         the FIRST feature branch — which is exactly what the deferred
         second-developer plan requires, so this is a scheduled failure, not a
         hypothetical one. FIX (Vercel console, no code): scope the Jun 26 row
         to Production-only so preview fails closed, THEN add Preview-scoped
         DATABASE_URL and DATABASE_URL_UNPOOLED pointing at a throwaway Neon
         branch. Order matters — scoping first means a preview build with no
         database errors out instead of quietly finding production. Recorded
         against BUILD-1 at the 2026-07-27 reconcile because this row already
         owned the finding; BUILD-2 is the deterministic-primary-store schema
         phase and is unrelated."

  - id: BUILD-2
    track: build
    size: S
    status: planned
    title: "Deterministic default/primary store for multi-store users"
    notes: >
      Gary's rule is that a multi-store manager's default store is "the first
      store on their profile" — but StoreUserAssignment has no primary flag and
      no ordering column, so "first" is currently whatever Postgres happens to
      return and can vary between queries. Making it deterministic requires a
      schema change (mirror StoreStaffAssignment.isPrimary, which the staff side
      already has). Raised and deliberately deferred in PERM-2. Any code needing
      to pick a store before this lands should sort deterministically (store
      number, then name) and say so in a comment.
    blockers:
      - >
        Gated on BUILD-1: no migration may be authored until the repoint lands.
        AMENDED 2026-07-27 — the stated reason ("local .env still points at the
        PRODUCTION Neon branch") is no longer true: local now resolves to
        `ep-late-water`, not `ep-green-smoke` (see DEBT-4). The gate itself
        stands on the OTHER half — BUILD-1 is still `in_progress` and
        staging-only, so its verification step 3 (a staging build log proving
        migrate deploy actually ran under vercel-build) is unrecorded. Authoring
        a migration before that is proven risks migrations silently not applying
        on deploy, which BUILD-1's own notes call worse than the original
        problem.


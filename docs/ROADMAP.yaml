  - id: DEBT-11
    status: shipped
    commits: ["6f33427"]
    title: "PATCH /api/staff/[id] can 500 on a duplicated storeId in the request body"
    notes: >
      REACHED MAIN 2026-08-01 in promotion 97ed309. RE-CHECKED IN PRODUCTION as
      part of that promotion's six-check pass: staff member Tommy Thomas
      (Las Brisas) saved WITHOUT changing stores, and the assignments survived
      with the Primary star intact — the tell for the undefined-vs-[] path this
      row's drift finding protected.
      Status flipped staging -> shipped 2026-08-01 by DOCS-2. Debt rows carry no
      `shipped:` field (DebtItem in src/lib/roadmap.ts has none, and adding
      one type-errors the build), so the promotion date lives here.
      CLOSED 2026-08-01 in 6f33427. The 500 path was re-verified at HEAD before
      the fix, exactly as the row describes it: ownership validated with
      `orgStores.length !== new Set(storeIds).size` (deduped for the
      COMPARISON), then finalStoreIds built from the RAW array and handed to
      storeStaffAssignment.createMany, violating the (staffMemberId, storeId)
      unique constraint. Deduped once at the top; that value is now used
      everywhere.
      THE ROW'S OWN ONE-LINER WOULD HAVE BROKEN THIS ROUTE, which is worth more
      than the fix. It proposed `const storeIds = [...new Set(parsed.data
      .storeIds)]`, copied from POST /api/staff — but POST's schema is
      `.default([])` and this one is `.optional()`, so parsed.data.storeIds is
      legitimately undefined here and `new Set(undefined)` throws. The undefined
      is load-bearing: it means "leave assignments alone", and the route branches
      on it twice. The landed form is the ternary that preserves it. A fix
      copied from a sibling is only as good as the schemas matching.
      BEHAVIOUR DOES CHANGE, on exactly one input, and that is the point of the
      row: a PATCH body repeating a storeId goes from an unhandled 500 to a
      normal success writing one assignment. Every other input is byte-identical.
      Flagged before edit and approved by Gary (2026-08-01), because the sweep
      this landed in was otherwise contracted to behaviour preservation.
      NOT REACHABLE FROM THE UI, unchanged — the dialog holds selections in a
      Set. This is hardening against hand-made and programmatic callers.
      ── ORIGINAL TEXT BELOW, UNCHANGED ──
      Found 2026-07-27 while fixing PERM-6 Task 3, in the block being changed;
      written down rather than fixed inline because it is a robustness bug, not
      that phase's finding. src/app/api/staff/[id]/route.ts validates ownership
      with `orgStores.length !== new Set(storeIds).size` — deduping for the
      COMPARISON — but then builds finalStoreIds from the RAW array. A body
      carrying the same storeId twice passes validation and reaches
      storeStaffAssignment.createMany with two identical rows, violating the
      (staffMemberId, storeId) unique constraint: an unhandled 500.
      Not reachable from the UI — the dialog holds selections in a Set — so
      this is hardening against a hand-made or future programmatic caller, and
      PERM-7 is exactly such a caller.
      FIX: dedupe once at the top (`const storeIds = [...new Set(parsed.data
      .storeIds)]`) and use that everywhere, as POST /api/staff now does after
      PERM-6 Task 1.


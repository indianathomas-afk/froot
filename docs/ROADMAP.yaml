      "Froot", and rel="manifest"; /apple-icon.png, /icon.png and
      /manifest.webmanifest all return 200 unauthenticated on local dev.
      Every one of those is a server-side fact. NOTHING about how iOS
      actually behaves has been observed — no iPad was involved.
      THE THREE UNTESTED CLAIMS, in the order they will bite:
      (1) standalone clips get their own cookie jar, so staff sign in again
      inside the clip even when Safari is signed in — believed one-time,
      unconfirmed across relaunch and reboot;
      (2) the social-provider hop above — <SignIn> is embedded and
      same-origin, so email/password and email-code should stay inside the
      clip, but WHICH METHOD THE PERM-7 DEVICE ACCOUNTS USE WAS ASKED AND
      NEVER ANSWERED, and it is the whole of the risk;
      (3) no back button — any page with no in-app way back is a dead end,
      recoverable only by force-quit.
      THE REVERT IS ONE COMMIT, which is why it shipped this way: the icon
      fix (c473b72) changes no behaviour and the standalone decision is
      isolated in the manifest (28bbd8a). Dropping the second commit

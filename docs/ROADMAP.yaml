      spreads the ENTIRE Square location object (`...loc`), so `business_email`
      reaches the client on every import. But the import dialog's POST body maps
      only name, address, city, state, timezone, phoneNumber and
      squareLocationId (src/app/(app)/stores/import-square-button.tsx:58-66) —
      the email is silently dropped.
      CORRECTION 2026-07-28 — THE SECOND HALF OF THAT SENTENCE WAS WRONG WHEN
      WRITTEN, and the original prompt inherited it as Task 0 step 2. The row
      claimed "the store CARD then renders address, phone and timezone but never
      the email, so the field is invisible even when set." The card HAS rendered
      contactEmail, behind a Mail icon, since the initial commit:
      src/app/(app)/stores/page.tsx:182-187, dated to 1cfdf76 (2026-06-26) by
      `git log -L 182,187`. This was not PERM-6 drift and not a regression —
      the claim was simply never checked against the file. There was nothing to
      build for that step; it was already shipped. Recorded rather than quietly
      dropped, because a false "it's invisible" is what made the field look
      more broken than it was.
      CHANGED UNDER YOU 2026-07-27 by PERM-6 Task 4 — read this before
      starting. GET /api/square/locations no longer spreads the whole Square
      object; it now returns an explicit allow-list (id, name, address
      {address_line_1, locality, administrative_district_level_1},
      phone_number, timezone, alreadyImported), verified against both callers
      as the fields actually consumed. `business_email` therefore NO LONGER
      REACHES THE CLIENT. This is not a regression to report — it was dropped
      knowingly, because nothing read it and the route is the org's Square data
      going over the wire. DEBT-8's first step is to add `business_email` back
      to that allow-list, one line in src/app/api/square/locations/route.ts,
      at the point a consumer actually exists. Gary's call, 2026-07-27:
      widening later is easy, narrowing after something depends on it is not.
      THE MAPPING ALONE POPULATES NOTHING — found 2026-07-28 against the
      PRODUCTION database, and it is why this row grew a third fix. Store
      .contactEmail is null on 10 of 10 production stores. The import dialog is
      the ONLY writer of these fields and it filters out already-imported
      locations (`available = locations.filter((l) => !l.alreadyImported)`),
      and there was no store-level "Resync from Square" the way there is a
      per-member one for staff. So all 9 Square-linked production stores were
      permanently unreachable by the import mapping, and PERM-7(d)'s email seed
      would have come up empty for every existing store INCLUDING Las Brisas —
      the exact store the phase was designed around.
      FIX, as landed (three parts, not two):
      (a) re-add business_email to the allow-list —
      src/app/api/square/locations/route.ts:63-83;
      (b) map business_email → contactEmail at import —
      src/app/(app)/stores/import-square-button.tsx:58-72;
      (c) NEW per-store "Resync from Square" so already-imported stores have a
      path at all — src/app/api/stores/[id]/resync-square/route.ts (new) +
      src/lib/square.ts fetchSquareLocation + the button in
      src/app/(app)/stores/store-actions.tsx. Gary's Ruling 3, 2026-07-28: a
      one-shot backfill script fixes today and nothing afterwards — the same gap
      reopens for the next store whose Square email changes, with no mechanism
      to notice. The button also gives PERM-7(d)'s drift indicator a remedy:
      see drift, click resync. Scoped to exactly the field set the import maps,
      so import and resync cannot drift apart.
      Step 2 as originally written ("surface it on the store card") required NO
      CHANGE — see the correction above.
      Independently useful, but it is also the PREREQUISITE for
      PERM-7(d), which seeds a device login's email from it — a seed cannot come
      from a column nothing populates. See DECISIONS.md 2026-07-27 for why that
      seeding is one-way and never a live sync.


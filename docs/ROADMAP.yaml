      Disconfirmed by: a tasksSnapshot column appearing on Checklist, or print
      resolving task text through anything other than the live template join.
      Related: DEBT-36 (the same mechanism, one layer in), CHK-1.

  - id: DEBT-61
    title: >
      Template.frequency is collected, exported and rendered but read by no
      generation path — every template is a daily template
    notes: >
      ── RIDER 2026-08-10 (CHK-5/S5, "5190fd9"). THIS ROW STAYS OPEN. PREPENDED;
      NOTHING BELOW IS EDITED. ──
      THE EXCLUSION NOW HOLDS AT THREE GATES AND IS VISIBLE AT THE THIRD.
      Materialisation (CHK-3, "d089a7c"), closing (CHK-3's defect fix,
      "1c907d2"), and now the operations report, which filters every row through
      `dayCloseAppliesTo(template.frequency)` before it counts anything. All
      three ask the same predicate; none of them re-derives it.
      WHAT REMAINS ON THIS ROW, RESTATED NOW THAT THE CONTAINMENT IS COMPLETE —
      because the containment is thorough enough to be mistaken for the fix, and
      the disconfirmation clause below has now fired three times without this
      row closing. Two things, and neither is a filter:
      (1) GENERATION-TIME FREQUENCY AWARENESS. Bulk generate still creates a
      Weekly template's checklist EVERY day. Nothing consumes those rows now —
      day close leaves them open and the report drops them — so what was noise
      is now litter: a Weekly template silently accrues one Pending row per
      store per day, forever, and every one of them is a row a human could open.
      The three gates stop the fiction being COUNTED; they do not stop it being
      CREATED.
      (2) HONEST WEEKLY LIFECYCLE SEMANTICS. A non-Daily checklist somebody
      genuinely started is now NEVER closed — it keeps `closedAt: null` and
      reads `overdue` for as long as it exists, because overdue is derived and
      missed is the only terminal state day close writes (CHK-3's rider states
      this and counts it as `frequencyLeftOpen`). That is the right trade today
      and it is not a resting place.
      THE REPORT SAYS SO IN PLAIN WORDS AND DOES NOT CITE THIS ROW ON SCREEN:
      "Only daily checklists are tracked … For those templates, 'no misses'
      means 'not tracked yet' — not 'all done'", carrying the count of rows the
      exclusion dropped from the range being viewed. An operator should not have
      to know what DEBT-61 is; a number they can see is what keeps the exclusion
      from reading as a clean bill of health.
      FIX SHAPE IS UNCHANGED and is still a schema addition plus a form control
      plus the generation filter — a Weekly template needs a day-of-week, a
      Monthly one a day-of-month, neither collected today.
      ── THE 2026-08-09 FILING IS NEXT, UNEDITED ──
      COST OF DOING NOTHING: Bulk generate creates a checklist for every active
      template every day regardless of frequency, and on-demand creation asks no
      question at all, so a Weekly template behaves exactly like a Daily one —
      LATENT TODAY, LOUD THE DAY CHK-3 SHIPS (trigger: day-close materialisation.
      An unfiltered job would file a Weekly checklist as MISSED six days a week
      and a Monthly one as missed ~29, turning the operations report into noise
      on its first day). DERIVED AT HEAD "746918c" by the CHK-1 planning session.
      FILED 2026-08-09 ON GARY'S RULING. The trigger is already handled — CHK-3
      materialises misses only for `frequency = "Daily"`, and CHK-5's report
      states the exclusion on its face so "no weekly misses" is never read as
      "weekly checklists were all done". THAT IS A CONTAINMENT, NOT A FIX, which
      is why this row exists rather than a comment.
      THE FACT: `frequency` is String @default("Daily") on Template. Every
      reference is collection or display — template-form.tsx, the CSV export and
      import, templates-client.tsx:184 (duplicate), templates/[id]/page.tsx:69
      and print/template/[id]/page.tsx:88 (both render it as a label), and
      api/templates/route.ts:117 (`|| "Daily"` on create). NEITHER creation path
      in api/checklists/route.ts reads it: the single create at :130 and the bulk
      loop at :155-170 filter on isActive and appliesTo only.
      NOTE THE SHAPE OF THE DEFECT — it is a promise on a form, not a bug in a
      path. The operator picks Weekly, the value persists, the value prints back
      at them on the template page, and nothing anywhere honours it. That is the
      TPL-1 pattern exactly (a field wired end to end with the behaviour
      omitted), and it is worth saying so: TPL-1's lesson was that the CONTROL

  - id: PERM-5
    track: permissions
    size: L
    status: planned
    title: "Per-user capability overrides — the toggle layer"
    notes: >
      Grant or remove a capability for ONE user against their role baseline —
      e.g. one staff member gets inventory-count access, or the inventory nav,
      while others do not. PERM-1's can()/scope() layer plus PERM-2's
      discipline (every decision routed through a capability, nav visibility
      kept separate from API access) is the substrate this depends on: there is
      one place to hook the override. Must keep the shim's rule that a stored
      permission set RESTRICTS BELOW the Clerk role ceiling and never elevates
      above it.
    blockers:
      - >
        PERMISSION FUSION — split "may write" from "may read any store" BEFORE
        building the override layer. Verified in source 2026-07-27:
        `ForecastContext.isAdmin` is literally `can(actor,
        "forecasting.edit")` (src/lib/forecasting-access.ts:51), and
        `requireForecastStore` SKIPS the StoreUserAssignment check entirely
        whenever `isAdmin` is true (`if (!ctx.isAdmin) { ...assigned check... }`
        in the same file). One flag is doing two unrelated jobs: "may edit
        goals" and "is exempt from store scoping". These coincide correctly
        TODAY only because forecasting.edit is ADMIN_ONLY, so the only callers
        with isAdmin true are admins, who are legitimately unscoped.
        The moment PERM-5's override layer grants forecasting.edit to a single
        MANAGER — the exact per-user grant this phase exists to enable — that
        user ALSO silently gains unscoped cross-store forecast READS. Nobody
        reading the grant "give Maria goal-edit access" would predict it hands
        her every sibling store's forecast, and it would defeat the
        assignment-scoping fix PERM-3 shipped and the 7-27 pass verified via S4.
        This is not a bug today; it is a trap armed for the first override.
        Fix direction: give requireForecastStore its own capability (e.g. a
        `forecasting.scope.all` or an explicit unscoped flag on the context)
        rather than reusing isAdmin, so the two powers are grantable
        independently.


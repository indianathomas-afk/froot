  - id: DEBT-45
    title: >
      AWAITING RULING — Audit-only sessions leave no artifact: the DEBT-TRIAGE
      audit's 22 per-row assessments exist nowhere in the repo
    notes: >
      COST OF DOING NOTHING: DEBT-TRIAGE-2 had to re-derive all 22 cost
      assessments from scratch because the audit that produced them left nothing
      behind, and the same hole will swallow the next audit — LATENT (trigger:
      the next audit-only session that ends without writing its findings to a
      file; this is a process and tooling cost, not a product one).
      DERIVED-AT-HEAD-BY-DEBT-TRIAGE-2 2026-08-02.
      AWAITING GARY'S RULING: whether audit-only sessions must write a
      docs/<PHASE>_AUDIT.md, and if so what makes that AUTOMATIC rather than
      REMEMBERED. Both halves are the question — the second is the harder one and
      the reason this is filed rather than fixed. Recorded as a question, not a
      decision, on Gary's instruction 2026-08-02.
      FILED 2026-08-02 by DEBT-TRIAGE-2, from the hole it fell into.
      THE FACT: docs/prompts/DEBT-TRIAGE_records_vs_tasks.md is 111 lines and
      ends at "REPORT BACK, part one". It is the INSTRUCTION. The audit's actual
      output — a verdict, a destination, a fold-target and a cost-of-doing-
      nothing line for each of 22 rows — was reported into a chat transcript and
      never written to the repo. The relocation destinations survived only
      because Gary re-typed them into the DEBT-TRIAGE-2 prompt by hand; the 22
      cost lines did not survive at all, and DEBT-TRIAGE-2 derived its own at
      HEAD instead. Those are marked DERIVED-AT-HEAD-BY-DEBT-TRIAGE-2 on every
      row precisely so the provenance is not silently laundered into "the
      audit's".
      IT IS SYSTEMIC, NOT ONE SESSION'S LAPSE, which is the reason for a row.
      DEBT-37's rule — "an observation that lives only in a transcript does not
      exist" — was written about a SINGLE observation found in passing during
      DEBT-SWEEP. This is the same rule at whole-session scale: an audit is
      nothing BUT observations, so a session whose entire product is analysis has
      the largest possible exposure to it and no habit protecting it.
      THE COUNTER-EXAMPLE PROVES IT IS SOLVABLE, and is the reason this is worth
      asking rather than merely lamenting: DEBT-1a and DEBT-2a DID write their
      findings out, as docs/prompts/DEBT-1_AUDIT.md (28k) and
      docs/prompts/DEBT-2_AUDIT.md (27k), and both are still cited by live rows
      today — DEBT-35 reads its three-branch column evidence out of DEBT-2_AUDIT,
      and DEBT-31 took its branch ids from it. Those two sessions did the right
      thing because their prompts told them to. Nothing structural distinguishes
      them from the triage session except that instruction.
      SO THE REAL QUESTION IS THE SECOND HALF. A convention that depends on each
      prompt remembering to ask for it has the same failure mode as the
      DEPLOY_LOG gap in DEBT-38: a habit with no artifact behind it, working
      until the one time nobody remembers. Candidates, none chosen: a line in
      WORKFLOW.md § Session completion rules; a rule in CLAUDE.md § Where
      documents live, which already governs docs/prompts/ and already draws the
      pointers-vs-claims line an audit file would sit on; or making it part of
      whatever DEBT-38 lands on, since both are "the process produced no
      artifact" in different clothes.
      SCOPE NOTE — this is NOT a request to write the missing DEBT-TRIAGE audit
      retrospectively. That analysis is gone and reconstructing it from memory
      would manufacture exactly the kind of authoritative-looking claim DEBT-9
      and DEBT-43 were corrected for. The 22 assessments now in the rows are
      DEBT-TRIAGE-2's own, derived at HEAD, and labelled as such.
      Related: DEBT-37 (the single-observation version of this rule, and its
      precedent), DEBT-38 (a process gap with no artifact behind it), DEBT-24.

  - id: DEBT-46
    title: >
      A PendingInvite row is both unreachable and unremovable through the
      product — /users renders from Clerk's list, and the revoke that should
      delete the row compares email case-sensitively and reports success when it
      deletes nothing
    status: shipped
    notes: >
      CLOSED 2026-08-03 — THE MANUFACTURING PATHS, NOT THE ORPHANS. Read that
      line before the rest: this row closes on what MADE orphans and what LIED
      about it, NOT on the orphans themselves. Two live rows remain unreachable
      and unremovable through the product, and DEBT-52 carries them.
      THE REASON GIVEN FOR CLOSING WAS WRONG AND IS RECORDED HERE RATHER THAN
      QUIETLY DROPPED. The proposal was that Phase 1 fixed "unremovable", which
      is FALSE for the rows that are actually stuck: the revoke route declines
      to delete an orphan by design (404 when Clerk has no such invitation, 409
      when its status is not pending, no delete on either path), and it is
      unreachable for one anyway since it is keyed on a Clerk invitationId that
      an orphan does not have. What Phase 1 fixed is narrower — the button no
      longer MANUFACTURES orphans and no longer reports success when it deletes
      nothing. This row closes instead on the split-out clause in its own text
      below ("the lifecycle question ... has outgrown this row and should be
      split out then"), and on keeping its now-stale paragraphs readable as
      history rather than as current claims.
      SHIPPED: 426f07c — the revoke route deletes the DB row BEFORE the Clerk
      invitation, matches case-insensitively, returns 404 when Clerk has no such
      invitation and 409 naming the status when it is not pending, and
      RevokeInviteButton reads res.ok and renders the error it used to discard.
      The count is REPORTED, not failed: under DB-first ordering a 404-on-zero
      would return before the revoke and leave a dashboard-created invitation
      live while reporting "not found", so this row's own "return 404 on zero"

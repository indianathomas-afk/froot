      A SECOND, SMALLER THING IN THE SAME AREA, recorded so it is not
      rediscovered: checklists/page.tsx:117 falls back to `STATUS_STYLES.Pending`
      for any unmapped status, so an unmapped value renders as "Not Started" —
      the most wrong of the available answers, silently. Exactly DEBT-37's
      class. Not currently reachable there (all four written statuses are
      mapped) and it becomes reachable the moment Missed ships unmapped, which
      is why CHK-4 maps it.
      FIX SHAPE: count Non-Compliant explicitly on /reports, or derive the total
      from the row count rather than from a sum of named buckets — prefer the
      latter, since it makes the omission impossible to reintroduce. The defect
      is the hand-summed denominator, not the missing bucket.
      Disconfirmed by: /reports deriving its total from anything other than
      `completed + inProgress + pending`. Related: DEBT-37 (the same silent
      fallthrough class), CHK-4.
      RIDER 2026-08-09 (CHK-3, "d089a7c") — ONE FACT THIS ROW DOES NOT HAVE, AND
      IT MATTERS BECAUSE THE TWO HALVES OF THE PAGE MOVE IN OPPOSITE DIRECTIONS.
      The per-store table at reports/page.tsx:36-41 does NOT use the hand-summed
      denominator: `total` is `sc.length`, every row in scope whatever its

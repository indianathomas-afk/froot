      preview and not in production." Both "c473b72" and "28bbd8a" ARE on
      origin/main as of the 2026-08-10 promotion (merge "ddaa216"), confirmed by
      `git merge-base --is-ancestor` after a fetch. The standalone manifest is on
      production.
      WHY THAT MATTERS AND WHY IT CHANGES NOTHING ABOUT THE VERIFICATION OWED.
      The sentence it corrects already said the cost line was unaffected,
      "since the trigger is a store device, not a branch" — and that reasoning
      still holds exactly. What moved is the DISTANCE to the trigger: the web
      clip is now servable from www.usefroot.com rather than only from a preview
      URL, so the first iPad that installs a tile from the real domain hits
      untested behaviour. THE THREE UNTESTED CLAIMS BELOW ARE STILL UNTESTED and
      the sign-in-method question is still unanswered. This is the row getting
      MORE urgent, not less, and the DEBT-54 flip explicitly does not apply to it
      — a promotion moves code, it does not run an iPad checklist.
      COST OF DOING NOTHING: LATENT until pushed, LIVE the moment it reaches
      a store device (trigger: a counter iPad whose staff sign in with a
      SOCIAL provider. In a standalone clip that button navigates
      cross-origin and iOS may hand the callback back to Safari rather than
      the clip, stranding a half-finished sign-in on the device that is
      supposed to be the simplest thing in the store).
      FILED 2026-08-06 by the iOS home-screen icon session, which shipped it.
      "Both commits are UNPUSHED at filing" was struck 2026-08-06 by the
      bookkeeping sweep: c473b72 and 28bbd8a are both on origin/staging. They
      are NOT on origin/main, so this is on the staging preview and not in
      production — which leaves the cost line above exactly as written, since

      and writes live Keva Juice data. Not fixed in SQ-1 (audit only). Fix
      shape: point local `.env` at a dev/staging branch and keep production
      credentials out of the working tree; consider guarding the build script
      against a production host. Related: BUG-3 (DATABASE_URL_UNPOOLED),
      DEBT-3 (WORKFLOW.md §3 still documents the retired migrate dev flow).
      See also DEBT-5, DEBT-6.
      BUILD-1 (2026-07-26) addresses the build-script half: migrate deploy now
      lives in `vercel-build`, so a local `npm run build` no longer touches a
      database at all.
      .ENV HALF NOW APPEARS DONE (observed 2026-07-27, not yet ruled closed by
      Gary): local DATABASE_URL no longer resolves to ep-green-smoke. Both keys
      point at `ep-late-water-a6k53nv2` (pooled for DATABASE_URL, the same host
      without `-pooler` for DATABASE_URL_UNPOOLED) — an endpoint that is neither
      production (`ep-green-smoke`) nor staging (`ep-odd-rain`), i.e. the
      dedicated dev branch BUILD-1 recommended. The prior text saying this was
      "NOT done yet" is stale. Left OPEN rather than closed because the closing
      condition was both halves true AND BUILD-1 in production.
      STALE REFERENCE CORRECTED 2026-07-27 (reconcile Pass 2c) — this row went
      on to say "BUILD-1 is still `in_progress` and staging-only". That is no
      longer true: BUILD-1 flipped to `shipped` on 2026-07-27, promoted in
      06b1561, and its vercel-build split was verified IN PRODUCTION (deployment
      EHfDfAKJR logged `Running "npm run vercel-build"` and `31 migrations
      found`). So the second half of DEBT-4's closing condition is now MET.
      STILL LEFT OPEN, deliberately and narrowly: the 2026-07-27 session
      verified the local env vars by NAME AND HOST ONLY. It did not confirm the
      dev branch's contents, nor that no tooling still reaches production by
      another path — and the local→dev repoint has since been shown to create

  - id: DEBT-11
    title: "PATCH /api/staff/[id] can 500 on a duplicated storeId in the request body"
    notes: >
      Found 2026-07-27 while fixing PERM-6 Task 3, in the block being changed;
      written down rather than fixed inline because it is a robustness bug, not
      that phase's finding. src/app/api/staff/[id]/route.ts validates ownership

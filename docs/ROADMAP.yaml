  - id: SQ-2
    track: square
    size: S-M
    status: planned
    title: "Square token-refresh hardening — observability + refresh-ahead"
    notes: >
      ORDERING: next up — the most time-critical planned phase on the board.
      DEADLINE 2026-08-06T09:48:55Z — the current Keva Juice access token
      expires then; the lazy refresh window opens 2026-07-30. Not blocked: SQ-1
      confirmed a refresh token is stored and the refresh path is reachable.
      Proposed scope (not yet implemented): log refresh attempt/success/failure
      in refreshTokenIfNeeded instead of the silent `if (!res.ok) return org`;
      move the threshold from "inside 7 days" to Square's own guidance of
      refreshing every 7 days or less (refresh when the token is older than ~7
      days rather than when expiry is near); route the four bypassing helpers
      through getSquareClient; surface expiry in the settings UI, which today
      shows "Connected" for an expired token; handle
      oauth.authorization.revoked. A daily refresh cron is viable on Hobby

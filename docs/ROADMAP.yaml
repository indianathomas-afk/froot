      the pattern HR documents already use (HR_BLOB_READ_WRITE_TOKEN +
      src/lib/hr-files.ts passing the token explicitly on every call). Existing
      blobs must be migrated or re-uploaded; the persisted importFileUrl values
      become stale and need a backfill or an on-demand signing indirection.

  - id: DEBT-42
    title: >
      `deferred` and `open` keep resolved entries in the array
      forever, the same defect P-4 fixed for `blockers`
    notes: >
      RULED 2026-08-07 — NOTHING WAS PENDING HERE, AND THE PREFIX WAS THE ERROR.
      No call was owed on this row: the deferral and its trigger were already
      ruled by Gary on 2026-08-01, explicitly, as FLAG AND NOT FIX. What
      happened on 2026-08-02 is that DEBT-TRIAGE-1 prefixed the title AWAITING
      RULING so the row would stop reading as backlog — and over-corrected. A
      row that was DECIDED was made to read as a row AWAITING a decision, and it
      then sat in the awaiting-ruling set for five days asking for a call that
      had been made a day before the prefix was applied.
      WHAT ACTUALLY STANDS, UNCHANGED: this is a LATENT RECORD, and its trigger
      is the first surface that derives a COUNT from `deferred` or `open` — a
      summary tile, a panel headline, a dashboard number. At that moment it
      becomes the P-4 bug again with the same failure direction, and the fix is
      already designed and cheaper than P-4's was. Until then no headline count
      reads either field and the cost is a slightly wrong badge on one collapsed
      card.
      PREFIX REMOVED AS MISLABELLED — that is the whole of this ruling. The row
      stays open, stays latent, and is not waiting on Gary. Note the lesson for
      the next relabelling pass: a prefix that says a row needs a DECISION is
      itself a claim, and applying it to a row that has already been decided
      costs exactly what it cost here.
      COST OF DOING NOTHING: No headline count reads `deferred` or `open` —
      verified at HEAD, both are still `string[]` at roadmap.ts:84-85 — so the
      three resolved entries sitting in those arrays cost a slightly wrong badge
      on one collapsed card and nothing else — LATENT (trigger: the first
      surface that derives a COUNT from either field, a summary tile, a panel
      headline or a dashboard number, at which point this becomes the P-4 bug
      again with the same failure direction and the fix is already designed).
      DERIVED-AT-HEAD-BY-DEBT-TRIAGE-2 2026-08-02, not the audit's.
      AWAITING GARY'S RULING: nothing until a surface COUNTS `deferred` or
      `open`; that event is the trigger, and the fix is already designed. Title
      prefixed 2026-08-02 by DEBT-TRIAGE-1 so the row stops reading as backlog;
      the deferral and its trigger are the row's own ("on Gary's explicit ruling
      to FLAG AND NOT FIX", "WHAT WOULD CHANGE THAT"), transcribed, not new.
      ── ORIGINAL NOTES BELOW, UNEDITED ──
      FILED 2026-08-01 by P-4, on Gary's explicit ruling to FLAG AND NOT FIX.
      THE FACT: `deferred` and `open` are still `string[]` (src/lib/roadmap.ts)
      and carry no way to mark an entry closed, so resolved entries stay in the
      array exactly as blocker entries did before P-4. Three exist today, found
      by reading all 21 entries in full:
      PERM-2 `deferred[0]` opens "RESOLVED 2026-07-27 by PERM-6 Task 1";
      PERM-6 `open[0]` opens "RESOLVED AND MOVED 2026-07-27";
      PERM-7 `open[0]` opens "RESOLVED 2026-07-28";
      and SEC-1 `open[0]` opens "HALF-CLOSED 2026-07-27", which is DEBT-41's
      third state rather than a clean closure.
      WHY IT WAS RULED NOT WORTH FIXING NOW, and this is the part to re-read
      before reopening it: NO HEADLINE COUNT READS EITHER FIELD. `deferred` gets
      a card badge and a DetailList; `open` gets a DetailList only — no badge,
      no count, no summary tile. The cost is therefore a slightly wrong badge on
      one collapsed card, not an untrustworthy answer to "what is stopping
      promotion". That asymmetry is the whole reason `blockers` was worth a
      migration and these two are not.
      WHAT WOULD CHANGE THAT: any new surface that COUNTS either field — a
      summary tile, a panel headline, a dashboard number. The moment a number is
      derived from these arrays, this becomes the P-4 bug again with the same
      failure direction, and the fix is already designed and proven: widen the
      type to BlockerEntry, migrate only the closed entries, run the whole-tree
      identity check.
      THE FIX IS CHEAPER THAN P-4's WAS. BlockerEntry, both helpers and the
      shared DetailList already accept the object form — `string[]` is
      assignable to `BlockerEntry[]`, which is why DetailList already renders
      the "resolved" marker for any entry that carries the flag. Widening the
      two fields is a type change plus a four-entry migration; no new mechanism
      is needed.
      Related: P-4, DEBT-41 (SEC-1's entry is an example of both).


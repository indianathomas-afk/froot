  - id: BUILD-2
    track: build
    size: S
    status: shipped
    commits: [118a02d, 944dfa3, f480568]
    title: "Deterministic default/primary store for multi-store users"
    notes: >
      PROMOTED TO PRODUCTION 2026-07-29 as 493175e. FAST-FORWARD, not a merge —
      origin/main HEAD has a single parent (f480568), so there is no merge
      commit and no `git revert -m 1` rollback. All four commits are ancestors
      of main; both migrations applied via `prisma migrate deploy` in the Vercel
      build. See docs/DEPLOY_LOG.md, 2026-07-29.
      SHIPPED, NOT VERIFIED — and the distinction is the point. What was
      actually confirmed:
      (a) Query A (duplicate primaries) returned ZERO ROWS on branch
      `production`.
      (b) The defaultStoreId column and the
      StoreStaffAssignment_one_primary_key index were confirmed PRESENT on
      branch `preview/staging`.
      What was NOT done: the column and index have NOT been confirmed on branch
      `production`, and NONE of the five UI checks below were run. (b) is
      staging evidence and says nothing about production — dev and staging are
      separately seeded (docs/MIGRATIONS.md, "Which branch am I actually
      reading?"). This row moves to `verified` when Gary has confirmed the
      column and index on branch `production` AND driven the five checks. Held
      at `shipped` deliberately rather than claiming more than was checked
      (Gary, 2026-07-30).
      CORRECTED 2026-07-29 — THE NONDETERMINISM RATIONALE BELOW IS REFUTED. The
      row claims primaryStoreName() "picks on an unordered query" and "may
      return a different one per request", and that "the codebase is already
      split" with only hr-signed-pdf.ts:764 deterministic. FALSE against
      current code. The function has exactly TWO callers and BOTH load
      storeAssignments with the same
      `orderBy: [{ isPrimary: "desc" }, { store: { name: "asc" } }]`:
      api/hr/documents/[id]/acknowledgments/route.ts:172 (staff loaded at
      :94-102, orderBy :99; self path via src/lib/hr.ts:23) and
      api/hr/forms/[id]/submissions/route.ts:143 (via
      api/hr/forms/shared.ts:48). The codebase is UNIFORM, not split.
      WHAT SURVIVES: the index still earns its place, on the "the database
      refuses two" rationale rather than the nondeterminism one — it converts
      "every writer happens to write at most one primary" into an enforced
      invariant. All four writers were checked and all already comply
      (api/staff/route.ts:105; api/staff/[id]/route.ts:126-133 and :136-144;
      sync-square:77-86; resync-square:93-100). Verified ENFORCING on branch
      dev 2026-07-29: setting all 9 of Kelton Thomas's assignments primary was
      rejected with "duplicate key value violates unique constraint
      StoreStaffAssignment_one_primary_key", statement aborted atomically, no
      rows written. Task 8 additionally gave primaryStoreName() its own
      internal tie-break so the guarantee stops depending on caller discipline
      (17/17 assertions, verified no-op against both callers).
      STALE DEFAULTS — FIRST-CLASS FINDING, NOT A FOOTNOTE. Nothing nulls
      defaultStoreId when a user's assignments are removed. The Clerk webhook
      drops every StoreUserAssignment on organizationMembership.deleted
      (webhooks/clerk/route.ts:221-235, deleteMany at :234) and does not touch
      User columns; an admin edit replaces the whole set
      (users/[id]/route.ts:164-167). The FK targets Store, so onDelete: SetNull
      fires ONLY when the STORE is deleted — losing access to a store that
      still exists leaves the column pointing at it. Read-time revalidation is
      therefore LOAD-BEARING, not defensive: it is the only thing standing
      between a stale default and a user landing on a store they have lost.
      NOTE THE PROMPT FILE'S CITATION WAS WRONG — it cited
      webhooks/clerk/route.ts:180 for the deletion; :180 is a createMany in the
      pending-invite path. Correct citation is :221-235, deleteMany at :234.
      RESURRECTION IS INTENDED BEHAVIOUR, decided rather than inherited.
      Because the column persists, a user who loses a store and later regains
      it silently gets their old default back. This is harmless, and harmless
      STRUCTURALLY rather than by luck: a stale default is INERT because access
      is decided by the assignment set and the default only ranks WITHIN it.
      resolveDefaultStore() selects from visibleStores, so the column can never
      widen reach — the worst case is an unexpected landing page, never an
      unreachable store becoming reachable. For a PERM-7 device account it
      cannot even do that: a device login is role STORE with exactly one
      assignment (device-login.ts:66-68), so visibleStores has one element and
      the resolver returns it whatever the column says.
      THE DESIGN PREMISE IS A UI CONVENTION, AND THAT STRENGTHENS THIS DESIGN.
      Admins CAN acquire StoreUserAssignment rows: users/[id]/route.ts:164-167
      creates them unconditionally and the client always sends storeIds
      (users/user-actions.tsx:189), so promoting a two-store MANAGER to ADMIN
      writes two admin assignment rows. READ THIS AS CONFIRMING THE isPrimary
      REJECTION, NOT UNDERMINING IT: if admins have assignment rows SOMETIMES,
      depending on role history, then isPrimary on StoreUserAssignment is an
      even worse home for a default than the original argument said — it would
      have worked for some admins and not others, with the difference invisible
      and determined by whether someone was once a MANAGER. A nullable column
      on User is unconditional. Filed for PERM, not fixed here; also recorded
      in PERMISSIONS_INVENTORY §3 item 10.
      DEBT-17 INTERACTION. The device-account default is set inside the
      webhook's `if (pending)` block, which DEBT-17's 2026-07-28 audit
      established fires whenever a PendingInvite matched, regardless of which
      writer won the race (webhooks/clerk/route.ts:158-196). So a device login
      gets its defaultStoreId even when /users wins and persists the wrong
      role. DEBT-17's chosen fix DIRECTION B changes the page only and cannot
      disturb this. OPTION C (a shared syncOrgMembership()) WOULD have to
      preserve the default-setting deliberately — noted on DEBT-17's row too.
      Minor side effect: DEBT-17's forensic signature "role STAFF holding store
      assignments" gains a field — such a row will now also carry a
      defaultStoreId when exactly one store was provisioned.
      STAGING VERIFICATION REQUIRED — could not be done locally (the Edit User
      modal is behind an authed admin session; Claude does not sign in). Local
      evidence is `next build` green, tsc/eslint clean, and 17/17 logic
      assertions on the pure helpers. STILL UNEXERCISED until driven on
      staging:
      (1) Default Location select RENDERS in the Edit User modal.
      (2) Options FILTER to the locations ticked in that same modal.
      (3) Deselecting the chosen default's store CLEARS it.
      (4) A role change (ADMIN → STORE with the default unselected) does not
      submit a stale value — the select shows "" and the PATCH sends null.
      (5) A newly provisioned SINGLE-STORE device login comes out with its own
      store as defaultStoreId.
      ── ORIGINAL NOTES BELOW, UNEDITED ──
      Gary's rule is that a multi-store manager's default store is "the first
      store on their profile" — but StoreUserAssignment has no primary flag and
      no ordering column, so "first" is currently whatever Postgres happens to
      return and can vary between queries. Making it deterministic requires a
      schema change (mirror StoreStaffAssignment.isPrimary, which the staff side
      already has). Raised and deliberately deferred in PERM-2. Any code needing
      to pick a store before this lands should sort deterministically (store
      number, then name) and say so in a comment.
      RESCOPED 2026-07-27 — THE isPrimary DESIGN ABOVE DOES NOT WORK. Adding
      isPrimary to StoreUserAssignment cannot express a default store for an
      ADMIN, because admins have NO StoreUserAssignment rows at all: every page
      does `...(isAdmin ? {} : { id: { in: storeIds } })` (src/lib/auth.ts:137-142
      and every consuming page), and the UI hides the store picker for ADMIN
      entirely ("Admins have access to all locations automatically",
      src/app/(app)/users/user-actions.tsx:230). There would be no row to flag.
      That is disqualifying rather than inconvenient, because the ADMIN device
      account in PERM-7 is exactly the case that most needs a default store.
      NEW SHAPE: a nullable `defaultStoreId` FK on **User** (onDelete: SetNull),
      which works for every role including ADMIN. One additive column.
      Set by the admin at provisioning — for a PERM-7 device account it defaults
      to that account's own store — and editable by the user themselves.
      ALSO CORRECTED: the premise that "first store" is nondeterministic is
      FALSE for store pickers. Every page selects with
      `orderBy: { name: "asc" }` and takes `stores[0]`, so today's default is
      deterministic — just arbitrary (alphabetically first). The unspecified
      ordering of `dbUser.storeAssignments` is real (no orderBy at
      src/lib/auth.ts:137-142) but is only ever used as a
      `WHERE id: { in: storeIds }` filter, never indexed into. So this phase is
      about giving users a CHOSEN default, not about fixing a random one.
      Consumed by UX-2, which is where the user-visible payoff lands; BUILD-2 is
      the schema half only. UNBLOCKED as of 2026-07-27 — BUILD-1 shipped.
      SECOND MIGRATION FOLDED IN 2026-07-27: the partial unique index on
      StoreStaffAssignment.isPrimary, moved here from PERM-6 so that PERM-6
      stays a no-schema size-S phase and both DDL changes ride one deploy.
      WHY IT MATTERS — the consequence is a legal document, not a pixel.
      `primaryStoreName()` (src/lib/hr.ts:44-49) picks with
      `.find(a => a.isPrimary) ?? storeAssignments[0]` on an unordered query, so
      with TWO primaries it returns an arbitrary one, and may return a different
      one per request. That value is persisted at signing time
      (api/hr/documents/[id]/acknowledgments/route.ts:172,
      api/hr/forms/[id]/submissions/route.ts:143) and stamped into the signed
      PDF, including the certificate line at src/lib/hr-signed-pdf.ts:615. Two
      documents signed by the same person the same afternoon could therefore
      name different stores, permanently. Note the codebase is already split on
      this: hr-signed-pdf.ts:764 queries with
      `orderBy: [{ isPrimary: "desc" }, { store: { name: "asc" } }]` and IS
      deterministic under duplicates; primaryStoreName() has no tie-break.
      The realistic cause is a future writer, not concurrency — see PERM-6.
      Session prompt: docs/prompts/BUILD-2_default_store.md
      PRE-CHECK RUN AND CLEARED 2026-07-27 — the blocker below is CLOSED, text
      retained per this file's convention because the method and the trap it
      documents apply to EVERY future production check, not just this one.
      RESULT: Query A (duplicate primaries) returned ZERO ROWS. Run by Gary in
      the Neon console, project `froot` (Keva Brands), database `neondb`,
      **branch `production`**, compute Primary/Active — branch confirmed from
      the console UI, not inferred from an env var. 72ms, "Statement executed
      successfully", no rows. The partial unique index can therefore be created.
      WHAT THAT ALSO ESTABLISHES: across all four write paths the "at most one
      primary" invariant has held in production. There is no existing
      corruption, which independently confirms the correction recorded on
      PERM-6 — the risk here is a FUTURE writer, not a race and not damage
      already done. A clean table is the cheapest moment to lock an invariant,
      and every new write path (PERM-7, any bulk edit) narrows that window.
      STALENESS IS SAFE, not a hazard: if a duplicate appears between now and
      the migration, index creation FAILS rather than corrupting anything. The
      cost is a failed deploy, not data damage. Re-run only if a long gap opens.
      SEPARATE FINDING FROM THE SAME PASS — see DEBT-9. Query B returned two
      ACTIVE staff (Gary Thomas, Kelton Thomas) with 9 store assignments and
      ZERO primary. NOT a migration blocker — a partial unique index permits
      zero — but a live data-quality problem feeding signed documents.
      CLOSED BLOCKER, retained for method (was: the hard gate requiring this
      check). THE TRAP, still true and still worth reading before any future
      production check: local `.env` DATABASE_URL resolves to
      `ep-late-water-a6k53nv2` — the DEV branch. Production is
      `ep-green-smoke-a6xthq4r`; staging is `ep-odd-rain-a6gr4xmm`. So
      `npx prisma studio`, `prisma db execute`, or any local tsx script reads
      DEV and returns a FALSE ALL-CLEAR. Before BUILD-1/DEBT-4 local pointed AT
      production, so this mistake was not possible; the repoint — otherwise
      correct — created it. A result with no host recorded beside it does not
      count. PREFERRED METHOD: the Neon console against the production branch,
      which keeps production credentials out of the working tree (DEBT-4's own
      guidance) and shows the branch in the UI. The two queries used are
      preserved in docs/prompts/BUILD-2_default_store.md Task 1a.


  - id: R4
    status: ruled
    asked: 2026-08-05
    ruled: 2026-08-06
    title: >
      square.manage — the registry grants it to ALL roles while every Square
      route enforces ADMIN
    question: >
      The registry and the enforcement disagree, so one of them is wrong.
      PERM-5's Session C reported it and deliberately left the Square routes
      unmigrated rather than resolve it unilaterally.
    options:
      - >
        (a) The registry is wrong — change square.manage to ADMIN_ONLY. It
        matches reality, and Square connect/disconnect/sync are org-level
        destructive actions; SEC-1 already treats disconnect as ADMIN.
      - >
        (b) The enforcement is wrong — widen access. There is no case for this.
    recommendation: >
      (a), emphatically. The Square routes then become migratable in a future
      sweep with zero baseline change. The registry edit rides the next docs or
      code session; nothing about it needs a session of its own.
    ruling: >
      (a) THE REGISTRY IS WRONG. square.manage changed ALL -> ADMIN_ONLY in
      src/lib/permissions.ts to match the enforcement every Square route already
      applies, and which SEC-1 and the L-2 seam both assume. APPLIED 2026-08-06,
      one line plus its comment. NO BEHAVIOUR CHANGED — nothing calls
      can(_, "square.manage"), verified at head, and it is not in
      ENFORCED_CAPABILITIES so it was never deniable from the /users grid. The
      Square routes remain unmigrated with their inline requireAdmin(); what
      changed is that migrating them is now a zero-baseline-change sweep rather
      than a decision. Recorded on PERM-5's open list and on L-2.
    links: [PERM-5, SEC-1, L-2]

  - id: R5
    status: ruled
    asked: 2026-08-05
    ruled: 2026-08-06
    title: >
      CLAUDE.md § Browser Evidence cites an org id that belongs to production,
      in a passage describing a dev org
    question: >
      The incident report motivating the "name your org id" rule describes
      org_3FhYUR… as a DEV org with nine stores and six staff. That id is
      PRODUCTION's. Two readings fit: the incident was on dev and the report
      pasted the wrong id, which is a label fix; or the session was on
      PRODUCTION while believing it was dev, which is a historical finding with
      a trace behind it.
    options:
      - >
        (a) Ten-minute read-only look at the DEBT-9 Phase 3 records first — what
        did that session DO on that org, observe or write, and do the counts
        (nine stores, six staff) match production-at-that-date or dev? Then fix
        the passage accordingly.
      - >
        (b) Correct the id and move on.
    recommendation: >
      (a). If the counts match dev it is the first reading and a one-line fix;
      if they match production it is the second, and whatever that session did
      needs a trace. Discriminating evidence exists, so use it rather than
      picking the cheaper reading. A ruling of (a) produces a short read-only
      look-see prompt.
    ruling: >
      Reading (i): the browser was on dev throughout; nothing production-side
      was touched. The passage's error was labelling a production-originated row
      (inherited by the dev branch at fork) as a dev-instance org. Corrected in
      CLAUDE.md and DEBT-50 by appended correction; the standing lesson added is
      to name the INSTANCE as well as the org id.
    links: [DEBT-9]

  - id: R6
    status: ruled
    asked: 2026-08-05
    ruled: 2026-08-07
    title: >
      Disposition of the six debt rows already carrying AWAITING RULING in
      their titles
    question: >
      DEBT-36, 38, 41, 42, 45 and 48 each open with "AWAITING RULING" and have
      been pending across several cycles. They predate the source sheet's
      visibility, so it offers no per-item options for them; this entry asks how
      to handle the set rather than any one of them.
    options:
      - >
        (a) Extend the analysis with per-item options and a recommendation for
        each, so the six join the same sitting.
      - >
        (b) Rule them directly from the rows without further input — they are
        marked decisions-not-work and have been in view longer than this list
        has existed.
      - >
        (c) Explicitly defer the six another cycle with a dated note, so they
        stop being silently pending.
    recommendation: >
      (a). The point of a single sitting is that the desk ends clear, and six
      unexamined items leave it half-done. Note that (a) or (c) also raises a
      second question this list does not answer — whether the six should MOVE
      into this list or stay as debt rows. That is worth its own session rather
      than a side effect of either ruling.
    ruling: >
      (b) EXECUTED, WITH FRESH EVIDENCE — and this SUPERSEDES the lean toward
      (a) above. The six were ruled DIRECTLY from the rows, on a verbatim
      extraction of all six taken at HEAD 90d8293 (report dated 2026-08-06),
      rather than through per-item option cards. (a)'s whole worry was that six
      UNEXAMINED items leave the desk half-done; the extraction is what removed
      "unexamined". The rows were read in full, at head, before the call was
      made, so building options-and-recommendation apparatus over the same
      evidence would have been ceremony rather than examination.
      ALL SIX DISPOSITIONS ARE RECORDED ON THE ROWS THEMSELVES, dated
      2026-08-07, which is where a reader of any one of them is standing.
      DEBT-38 CLOSED, both fix directions taken, commit "7d984be". DEBT-45
      CLOSED, ruled YES, same commit. DEBT-41 converted from a decision into
      WORK — its standing trigger fired. DEBT-42 relabelled: nothing was ever
      pending on it and the prefix was the error. DEBT-36 and DEBT-48 parked, to
      be scoped together as one feature phase after the current minor-fix batch.
      One new row, DEBT-59, was filed off DEBT-48 for the availability-offset
      defaults.
      THE SECOND QUESTION THIS ENTRY RAISED IS MOOT — whether the six should
      MOVE into this list or stay as debt rows. It was only ever a live question
      while a competing pending-rulings convention was running inside the debt
      table; after today NO debt row carries "AWAITING RULING", so there is
      nothing left to move and the competing convention is retired by
      exhaustion rather than by migration. Every one of the six stays a debt row,
      because what remains on each of them is work or a latent record, not a
      decision. New DECISIONS go in this list, by the convention above the
      `rulings:` key.
      THE PANEL ENDS AT 0 AWAITING A CALL, which is what this entry was really
      asking for — and it is the last of the six to close, deliberately, since a
      meta-question about a set cannot honestly be settled before the set is.
    links: [DEBT-36, DEBT-38, DEBT-41, DEBT-42, DEBT-45, DEBT-48]

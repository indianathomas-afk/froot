  - id: DEBT-64
    title: >
      Labor silently ignores overnight and one-sided StoreHours and infers from
      sales instead — and day close will read the same rows the other way
    notes: >
      COST OF DOING NOTHING: A store whose real hours cross midnight has those
      hours entered, saved, and displayed on /stores — and labor plans its week
      as if they had never been set, from trailing sales, with nothing on any
      screen saying so. LIVE the moment such a store is configured; LATENT only
      because no store had hours at all before 2026-08-09. It gets worse rather
      than staying flat: CHK-3 makes day close read the SAME rows under the
      OPPOSITE rule, so one store ends up judged on two different windows by two
      subsystems that both look correct.
      DERIVED AT HEAD "597e86d" by the CHK-2 session, from reading
      labor-plan.ts:195-207 and from running the explicit-hours branch for the
      first time in its life against dev br-broad-wave-a6vpjdw0.
      FILED 2026-08-09. IT EXISTED ONLY IN S2's REPORT UNTIL THIS COMMIT —
      named as a ROW in that session's triage and never written to the board.
      DEBT-37's rule, firing on the session immediately after the one that
      recorded it firing on S1. Filed here rather than absorbed into CHK-3
      because the fix is in labor-plan.ts, which CHK-3 must not touch, and a
      rider on a phase row dies when that phase closes.
      THE FACT: labor-plan.ts:202 accepts an explicit window only when
      `e > s` — `open = s != null && e != null && e > s ? {...} : inferredOpen[wd]`.
      A 07:00-02:00 store gives s=7, e=2, so `e > s` is false and it falls
      through to sales inference. One-sided hours fail identically: CHK-2's
      editor deliberately allows a day with an opening time and no closing time
      (times are independently nullable, and inventing the missing half is what
      DEBT-59 forbids), and `e != null` then fails. MEASURED, not reasoned:
      with Sat set to 08:00 and no close, labor returned 13 open hours for that
      day — the inferred figure, unchanged from before hours existed — while
      Mon-Thu correctly took their explicit 12.
      THE FALLBACK IS NOT THE DEFECT; THE SILENCE IS. Falling back to inference
      for an unusable window is defensible on its own. What is not defensible is
      that an operator who typed real hours gets a plan built from something
      else with no indication anywhere — the same shape as DEBT-59's lesson, one
      subsystem over: a value nobody chose, presented as if chosen.
      WHAT CHK-3 MUST NOT DO, and this is the half that makes this urgent rather
      than merely wrong: plan §3.5 rules that for day close `closingTime <=
      openingTime` means the close instant is D+1 plus buffer — overnight is
      handled EXPLICITLY and correctly. So after CHK-3 ships, one store is
      judged on its real window by day close and on an inferred one by labor.
      S3 must not "resolve" that by copying labor's `e > s` check into
      expectedWindow(); the plan's rule is the right one and this row is the
      other side being wrong.
      FIX SHAPE: treat `e <= s` as a window crossing midnight (end + 24) rather
      than as invalid, matching the day-close rule so the two subsystems read
      one meaning; and decide explicitly what a one-sided day means — infer the
      missing half, or ignore the row — rather than having it fall out of a null
      check. Either way, surface WHICH stores are running on inference, since
      that is the part no screen says today. Prefer aligning to §3.5, so there
      is one definition of a store's operating window rather than two.
      Disconfirmed by: labor-plan.ts accepting a window where `e <= s`, or any
      surface naming the stores whose hours were set and then ignored.
      Related: CHK-2 (shipped the editor that makes this reachable), CHK-3
      (§3.5, the opposing rule), DEBT-59 (values nobody chose).
      RIDER 2026-08-09 — THE OPPOSING RULE IS NOW BUILT, IN "d089a7c", AND THE
      TWO ANSWERS ARE LIVE THE MOMENT MIGRATION B DEPLOYS. Nothing above needs
      correcting; this records only that the "gets worse rather than staying
      flat" clause has come due. src/lib/checklist-lifecycle.ts reads
      `closingTime <= openingTime` as a D+1 close and a one-sided row as a
      partial window, and it says so at the single definition site with a
      pointer to this row — so the disagreement is written down in the code
      rather than waiting to be discovered by whoever notices two numbers. S3
      did NOT copy labor's `e > s` check, which is what this row asked of it.
      The fix shape and the exit condition are unchanged and both are still in
      labor-plan.ts.
      One thing the day-close side supplies for free when this is picked up: the
      four-value dayCloseSource (hours / closed-day / no-hours / no-close-time)
      is exactly the "which stores are running on inference" signal this row
      says no screen carries. Labor needs its own equivalent, but the shape is
      already decided rather than open.


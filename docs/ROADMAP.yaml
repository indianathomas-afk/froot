    open:
      - >
        RESOLVED AND MOVED 2026-07-27 — kept here as a pointer only. The
        `StoreStaffAssignment.isPrimary` constraint question now lives on
        BUILD-2, which is already the migration phase; that keeps PERM-6
        no-schema and size S, and batches both DDL changes into one deploy.
        BUILD-2 carries the hard gate: the duplicate pre-check runs against
        PRODUCTION and its results go to Gary before anything migrates.
        TWO CORRECTIONS to how this was originally written here, so the next
        reader does not chase the wrong thing. (1) The original text said a
        RACE between two concurrent PATCHes on the two-step false-then-true
        branch could produce two primaries. That is OVERSTATED — the two-step
        runs inside `$transaction`, and Postgres row locks serialise the second
        writer behind the first, so it resolves to a single primary correctly.
        Do not spend a session hunting that race; it cannot happen as written.
        (2) The real risk is a FUTURE WRITER, and it is mundane: a new call

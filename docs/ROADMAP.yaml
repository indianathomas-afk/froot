# Froot roadmap — single source of truth for phase status.
# Supersedes docs/ROADMAP.md (now a pointer), the old CLAUDE.md "Phase Status"
# section, and the external sheet. If any of those disagree with this file,
# this file wins. Narrative history (verification fixtures, migration names,
# decision cross-refs) lives in docs/ROADMAP_ARCHIVE.md, frozen 2026-07-24.
#
# UPDATE RULE: every Claude Code session updates its phase's entry here before
# the session is done. See "Session completion rules" in docs/WORKFLOW.md.
#
# status: planned | in_progress | staging | shipped | verified
#   staging  — merged to `staging`, on Vercel preview, NOT in prod
#   shipped  — merged to `main`, live in prod
#   verified — shipped AND smoke-tested against real store data
#   GAP: no status fits an audit-only phase with no shipped code (SQ-1 sits in "verified") — a future "closed"/"documented" would.
#
# blockers — live problems in a phase regardless of status (unset env vars,
#            prod-promotion gates, unverified pixel work). Anything here blocks.
# deferred — scope intentionally cut.
# open     — unresolved questions that aren't yet blockers.
#   NOTE: blockers/deferred/open/tags exist ONLY on `phases`. `bugs:` accepts
#   id/title/status/shipped/commits/notes; `debt:` accepts id/title/notes ONLY.
#   Adding `open:` to a debt row type-errors the build (see src/lib/roadmap.ts)
#   — fold it into notes instead. Learned the hard way 2026-07-27.
# tags     — [pre-launch] must close before external merchants.
#
# `shipped:` dates are when the work reached main/prod; where a phase was built
# earlier and promoted later, the build date is in notes.


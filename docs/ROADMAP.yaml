  - id: DEBT-35
    status: shipped
    commits: ["3d57fb6"]
    title: "The migrations folder cannot rebuild the live schema — Task.estimatedTimeMinutes"
    notes: >
      COST OF DOING NOTHING: Every environment is fine today only because none
      of them was built from these migrations, so nothing is observable —
      LATENT (trigger: the baseline squash in MIGRATIONS.md §2, or any database
      built from an empty state by `migrate deploy`. Note the trigger is worse
      than it looks: the squash regenerates from schema.prisma, so it will
      silently ADOPT the live type and erase the evidence that the ledger ever
      disagreed, rather than failing).
      DERIVED-AT-HEAD-BY-DEBT-TRIAGE-2 2026-08-02, not the audit's.
      WRITTEN INTO A CLOSED ROW DELIBERATELY, on Gary's ruling: a closed row's
      cost is what tells a reader whether the relocation was the right call, and
      here it is also the argument for WHERE it went — §2 is the one operation
      this bites.
      CLOSED BY RELOCATION 2026-08-02 by DEBT-TRIAGE-2, on Gary's ruling.
      RELOCATION CLOSES, DELETION LOSES: nothing below is removed.
      WHERE IT WENT → docs/MIGRATIONS.md §2 (the one-time baseline squash), as a
      ⚠️ callout directly beneath the existing one. §2 already carried a callout
      of exactly this shape — "re-append both partial indexes or the baseline is
      wrong" — and § Protected indexes already had "Hazard 1 — the baseline
      squash silently drops them", so this is the same pattern in the file that
      set it. The squash is the only operation this bites, and §2 is where
      someone stands before doing it.
      LABEL NOTE, since the DEBT-TRIAGE-2 prompt called this "Hazard 3": that
      name went to DEBT-9's relocation instead, which continues the existing
      numbered Hazard 1 / Hazard 2 series under § Protected indexes. §2 has no
      numbered hazards — its idiom is the ⚠️ callout — so this landed as a
      callout there. Same section as instructed; only the label differs, and it
      is reported rather than improvised silently.
      SHARPENED IN THE RELOCATION, and this is new reasoning rather than a
      transcription: the squash regenerates 0_init with `--to-schema-datamodel`,
      i.e. FROM schema.prisma, which says `Float?` — so the regenerated baseline
      will say DOUBLE PRECISION, match the live databases, and ERASE THE EVIDENCE
      that the ledger ever disagreed. The squash is simultaneously the operation
      that would surface this and the operation that makes it unfindable.
      Nothing fails; the discrepancy just stops existing. The relocated callout
      therefore instructs diffing the regenerated baseline against a live
      branch's actual column types BEFORE marking it applied, and treating
      estimatedTimeMinutes as one KNOWN instance rather than the only one —
      anything else from the same `db push` era has the identical signature.
      STATUS VALUE: `shipped`, following DEBT-31 and DEBT-19 — a documentation
      change rather than a code change.
      MEASURED 2026-08-01 during DEBT-2a, on branch dev, while cataloguing the
      Task table. CONFIRMS THE LONG-STANDING estimatedTimeMinutes AUDIT ITEM —
      this is corroboration of a known discrepancy, NOT a new discovery, and the
      row should be read as closing the question of whether it was real rather
      than as opening a new one.
      THE FACT, three sources and one of them disagrees: ALL THREE BRANCHES —
      dev, preview/staging and production — have Task.estimatedTimeMinutes as
      `double precision`; prisma/schema.prisma:311 says `Float?`; and the ONLY
      migration that ever creates the column —
      prisma/migrations/20260627002005_init/migration.sql:132 — says `INTEGER`.
      No migration alters it afterwards. So the schema and the live databases
      agree with each other, and the LEDGER is the one that is wrong. CONFIRMED
      ON ALL THREE BRANCHES 2026-08-01: not a local artefact, not a staging
      artefact — whatever changed the type reached PRODUCTION.
      WHY IT MATTERS: `prisma migrate deploy` from an empty database would
      produce a Task table that does not match schema.prisma. Every environment
      is fine today because none of them was built that way — but the baseline
      squash (MIGRATIONS.md §2, still not done) is exactly the operation that
      would surface it, and `migrate dev` is already broken for the same
      underlying reason (P3018, no baseline).
      CAUSE, consistent with the record: a `db push` from before that command was
      retired after the 2026-07-06 staging drift incident. Not proven, and the
      disconfirmer is cheap — a migration somewhere altering the column type
      would refute it; none exists.
      MEASURED ON ALL THREE, so nothing here is inferred: P8 on production

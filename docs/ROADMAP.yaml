  - id: L-2
    track: labor
    size: L
    status: planned
    title: >
      OPTIONAL Square labor integration — schedules and timecards as an overlay
      on forecast-driven labor, per-org toggle, off by default
    notes: >
      RE-SCOPED 2026-08-05 (Gary's ruling — DECISIONS.md, top entry). Was
      "Team/Labor API — actual worked hours + wages, actual-vs-budget, Nevada OT
      warning". Same work; the ruling changes its STATUS from an upgrade path to

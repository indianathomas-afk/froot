  - id: HR-18
    track: hr
    size: M
    status: planned
    title: "Supervised (proctored) training completion — executed by the trainee, witnessed by an elevated user"
    notes: >
      FILED 2026-08-06 by the bookkeeping sweep. The row is the only thing new
      here — the work was fully specified on 2026-08-05 in
      docs/prompts/HR-18_supervised_training_completion.md (8fb86bb) and simply
      never got a board entry, so a written-up phase was invisible to every
      surface that reads this file.
      STATUS IS `planned`, AND THAT DIFFERS FROM THE PROMPT ON PURPOSE. The
      prompt asks for the row at `in_progress`. NO SESSION HAS RUN IT — no
      commits, no branch, no audit output — and `in_progress` would assert work
      underway. The prompt is a dated claim and stays unedited (CLAUDE.md
      § Where documents live); this row records what is true today, and the
      discrepancy is written down here rather than silently resolved either way.
      Flip to `in_progress` when a session actually starts.
      WHAT IT IS — A THIRD CAPTURE PATH, NOT A PERMISSION WIDENING, which is the
      distinction the prompt spends its first page protecting. Training
      completions can be captured two ways today: SELF-SERVICE (the team member
      completes lessons in their own portal) and MANAGER-ATTESTED (an elevated
      user presses Mark complete, attesting the training happened, recorded
      against the attester). Both stay exactly as they are — Mark complete is
      explicitly not to be touched.
      The third path is SUPERVISED / PROCTORED: an elevated user (ADMIN, MANAGER
      or STORE) on a shared device opens a proctored session from the team
      member's Staff profile Training tab and hands the device over. The TEAM
      MEMBER personally does the lessons and quiz; the completion records as
      executed by the trainee, supervised by the elevated user.
      WHY THE THIRD PATH HAS TO EXIST SEPARATELY, and it is a legal argument
      rather than a modelling preference: a manager attestation says "I confirm
      this person was trained"; a supervised completion says "this person did
      the work; I watched". THOSE MUST STAY DISTINGUISHABLE IN THE RECORD
      FOREVER. Collapsing supervised into attested loses the stronger of the two
      claims exactly when it is needed.
      Modules: Staff + HR (training) + Users/roles. The prompt is AUDIT-FIRST —
      it requires a plan presented and explicitly approved before anything is
      edited, and forbids fixing anything outside those three modules.
      Related: PERM-7 (the shared store devices this runs on) and HR-19, which
      governs the permission surface these routes sit in.


      the source of truth, SQL approval required before any mutation, and the
      backfill is the risk rather than any code replacement. Twelve rows across
      three Neon branches, which is the part to plan rather than the SQL.
      DO THE LAYOUT RECHECK HERE. DEBT-5 verified that the /users chips wrap
      rather than squash and deliberately added NO cap, on the arithmetic that
      only two chips lengthen today. This backfill is what makes all twelve
      lengthen at once, and the pending-invites list renders its chips UNCAPPED

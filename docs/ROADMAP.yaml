  - id: DEBT-13
    title: "A MANAGER cannot see a staff member who works at their store but is homed elsewhere — /staff groups by primary store"
    notes: >
      Found 2026-07-27 during PERM-6's staging verification pass, on a session
      driven as corporate@keva.com (MANAGER, assigned Carson + Las Brisas).
      VERIFIED PRE-EXISTING, NOT A PERM-6 REGRESSION. Gary asked for this to be
      established before filing, because the bug surfaced on the night staff
      scoping changed and PERM-6's check 5 only proved a MANAGER can WRITE
      correctly — visibility is a different path and was untested that night.
      Four independent checks, all against commit d4a6bdc:
      (1) `git show --stat d4a6bdc -- 'src/app/(app)/staff/'` returns EMPTY —
      the roster page is not in the commit at all.
      (2) `git blame` on the grouping loop (page.tsx:69-80) → 1cfdf76, dated
      2026-06-26, a month before this phase.
      (3) `git blame` on the render filter (page.tsx:118) → e645694, dated
      2026-07-12. The last commit to touch the file at all is 015d23e (HR
      legal-name work), not d4a6bdc.
      (4) Its dependencies are untouched too: src/lib/auth.ts
      (getUserStoreScope) is not in the commit, and the GET handler in
      api/staff/route.ts was not modified — PERM-6's diff there is the Zod
      schema and POST only. The roster queries Prisma directly in
      getStaffData(), so that API is not even in its path.
      THE BUG: src/app/(app)/staff/page.tsx groups members by their PRIMARY
      store (`member.storeAssignments[0].store`, :78) and then renders only
      groups whose store is in the caller's scoped list
      (`stores.filter((s) => byStore.has(s.id))`, :118). The QUERY is correct —
      getStaffData fetches any member with `some` assignment in the caller's
      stores — so the member is fetched and then silently discarded at render.
      OBSERVED: Jordan Pippenger is assigned to Carson AND Las Brisas, both of
      this manager's stores, but is homed at UNR. He appears nowhere on the
      manager's /staff roster. His DETAIL page at /staff/<id> loads fine
      (staff/[id]/page.tsx:38 authorises on `some` assignment), so he is
      reachable by direct URL but not discoverable — the worst combination,
      because nothing signals he is missing.
      WHY IT MATTERS: a manager cannot see a person who works at their store.
      Not cosmetic — it is a roster with silent omissions, and the manager has
      no way to know the list is incomplete. Multi-store staff at operators
      with a shared labour pool are exactly the population affected, and
      Jordan (7 stores) is a real example in staging today.
      FIX DIRECTION: render a member under EVERY in-scope store they are
      assigned to, or add an "Also works here" line per store group. Do NOT
      simply change the grouping key to "first in-scope assignment" — that
      moves the member under a heading which contradicts the Primary star
      shown on their own row and chips. This needs NO permissions change: the
      query already returns the right people, so it is a display decision.


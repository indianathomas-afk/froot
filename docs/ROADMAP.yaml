  - id: DEBT-41
    title: >
      AWAITING RULING — A blocker entry can only be LIVE or RESOLVED — there is
      no value for the half-closed state two entries are actually in
    notes: >
      COST OF DOING NOTHING: The blockers panel counts BUILD-1's half-closed
      entry as live, so /internal/roadmap over-reports by one in the
      deliberately-safe direction — LATENT (trigger: a SECOND live half-closed
      exemplar, which is also this row's own standing condition for designing a
      third state; exemplar (a) was relocated away rather than solved, so the
      count is one).
      DERIVED-AT-HEAD-BY-DEBT-TRIAGE-2 2026-08-02, not the audit's. FIRST
      DERIVED AS LIVE AND MOVED TO LATENT BY GARY 2026-08-02 on the
      product-vs-process distinction recorded above the `debt:` key. The
      argument for LIVE was real and is kept here rather than discarded: Gary
      opened /internal/roadmap on 2026-08-01, read this very count, and
      concluded a session had failed — so the number demonstrably changes what
      he believes. It is still a cost to HIM and to the tooling, not to a
      merchant using the app, and that is the line the label now carries.
      RECORD HALF RELOCATED 2026-08-02 by DEBT-TRIAGE-2 → one paragraph on
      BlockerEntry in src/lib/roadmap.ts: NEVER ADD `resolved: false`. That is
      where the person about to add it is standing, and it is the one action
      this row most needs to prevent. The reasoning goes with it — the value is
      already carried by the flag's absence, and introducing it destroys the
      "a missing flag means live" default. THIS ROW STAYS AWAITING RULING and
      its standing instruction is unchanged: watch for one NEW example.
      AWAITING GARY'S RULING: nothing until a NEW half-closed exemplar appears;
      then whether a third BlockerEntry state is worth designing. Title prefixed
      2026-08-02 by DEBT-TRIAGE-1 so the row stops reading as backlog; the
      deferral and its trigger are the row's own ("KEEP AS-IS... accepted by
      Gary 2026-08-01", "WATCH FOR MORE EXAMPLES BEFORE ACTING"), transcribed,
      not new. The prefix is added to a title this row's own text already flags
      as dated-and-deliberately-unrewritten ("two entries"); prefixing it does
      not touch that claim.
      ── ORIGINAL NOTES BELOW, UNEDITED ──
      FILED 2026-08-01 by P-4, on Gary's ruling, from the audit that added the
      `resolved` flag. Filed rather than fixed because inventing a third state
      was not in that session's scope and because two examples is thin evidence
      for a vocabulary change — but it is real evidence, and an observation that
      lives only in a session report does not exist (the DEBT-37 precedent).
      THE FACT: BlockerEntry (src/lib/roadmap.ts) is `string | {resolved: true,
      text}`. A bare string is live, a flagged entry is closed, and there is
      nothing in between. Two of the nineteen entries at filing time are in
      between, and neither fits:
      (a) PERM-6's second `blockers` entry, "WHAT THE CLEARED GATE DOES NOT
      COVER". It is not a promotion gate — the gate above it is cleared — but it
      records four things still unexercised (the webhook's rejecting branch,
      Task 1, the STAFF role, and the reason the phase stays `shipped` and not
      `verified`). It is a live COVERAGE note wearing the blockers field.
      (b) BUILD-1's sole entry, "CHANGED SHAPE — HALF CLOSED, HALF DEFERRED":
      step 1 of a two-step fix is done and step 2 is deliberately deferred until
      collaboration work starts.
      BOTH ARE CARRIED AS LIVE, deliberately, which is the safe direction —
      under-claiming resolution can only over-report, and over-reporting is
      recoverable in a way that a hidden gate is not. The cost is that the panel
      reads 11 live when the honest answer is 9 live and 2 half-closed.
      DO NOT FIX THIS BY ADDING `resolved: false`. That is the same value the
      absence of the flag already carries, and it would invite marking entries
      false wholesale, which destroys the "a missing flag means live" default
      that makes the scheme safe. If a third state is wanted it needs its own
      name and its own render treatment.
      WATCH FOR MORE EXAMPLES BEFORE ACTING. Two is enough to file and not
      enough to design against.
      EXEMPLAR (a) SHARPENED 2026-08-01 (evening) by PERM-6c, and NOT REMOVED.
      PERM-6's second blockers entry no longer records four things unexercised:

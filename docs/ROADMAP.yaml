  - id: DEBT-19
    status: shipped
    commits: ["3d57fb6"]
    title: "Organization NAMES are not identifying on staging — nine orgs, five called \"Microsoft\", two \"Keva Juice\""
    notes: >
      COST OF DOING NOTHING: An operator working on staging cannot identify an
      org by name — "the Microsoft org" picks out five rows, four of them empty
      shells — and a wrong-org result looks identical to a right-org result —
      LATENT (trigger: the next instruction, prompt or query result that names an
      org by NAME rather than by ID; sharpest on a WRITE, where HR-14's
      Clerk-org rename would silently rename the wrong one and leave no visible
      trace, because the slug is the part that does not update).
      DERIVED-AT-HEAD-BY-DEBT-TRIAGE-2 2026-08-02, not the audit's.
      WRITTEN INTO A CLOSED ROW DELIBERATELY, on Gary's ruling: a closed row's
      cost is not moot to someone deciding whether the relocation was the right
      call. THIS COST IS EXACTLY WHAT DEBT-44 INHERITS along with the cleanup
      half, and that should be legible here without reading two rows.
      CLOSED BY RELOCATION 2026-08-02 by DEBT-TRIAGE-2, on Gary's ruling.
      RELOCATION CLOSES, DELETION LOSES: nothing below is removed. The record
      text stays here as the history and now also lives where it fires.
      WHERE IT WENT → CLAUDE.md § Database Evidence, as a PRECONDITION alongside
      the branch-label rule rather than as a section of its own. That placement
      IS the argument this row makes: it is the same failure as the missing
      branch label, one layer down — an under-specified identifier that still
      RESOLVES, so nothing errors and the mistake is invisible — and splitting
      one idea across two headings is how it stops firing. The nine-org
      measurement, the five "Microsoft" rows and the HR-14 silent-rename hazard
      all went with it.
      THE CLEANUP HALF WENT TO DEBT-44, which stays open and now owns it: same
      branch, same org, and DEBT-44 already carries the store-delete cascade
      analysis that a by-ID cleanup needs. That row's own text already named
      this one as its precedent, so the two were arguing the same case from
      opposite ends.
      STATUS VALUE: `shipped`, following DEBT-31, which closed the same way — a
      documentation narrowing rather than a code change. DebtItem carries no
      value for "closed by relocation" and inventing one is out of scope
      (DEBT-41 tracks that vocabulary gap).
      Found 2026-07-28 while choosing an org for PERM-7's re-run. Verified ON
      BRANCH preview/staging (branch named per CLAUDE.md § Database Evidence).
      Nine Organization rows:
      cmqvpe2bf000004l1gwxafqk4 "Keva Juice" square=f users=1;
      cmr54z65v000105jxczpt72w1 "Microsoft" square=TRUE users=4;
      cmr54x6gp000005jx7odzwx9e "Microsoft" square=f users=0;
      cmr57tw80000004l49xf6ft71 "Microsoft" square=f users=0;
      6b545d5b-3ea1-442d-b16d-9089984af8b6 "Microsoft" square=f users=1;
      cmr55fhm1000004l5az4vu73j "Microsoft" square=f users=1;
      cmrx04zn7000004jy6mk1mmha "Keva Smoothie Company" square=f users=0;
      cf888f2d-f234-48c7-8097-fd5b44b5b3dd "Keva Juice" square=f users=2;
      cmrefoomo000004l7dq37gdgn "My Organization" square=f users=1.
      Six have zero or one user; exactly ONE has Square connected.
      THE PROBLEM: a name identifies nothing. "the Microsoft org" picks out five
      rows, four of which are empty shells. Any instruction, prompt, decision
      record or query result that names an org by NAME is ambiguous, and the
      ambiguity is silent — you get A row, just not necessarily the one meant.
      SAME SHAPE AS THE BRANCH-LABEL FAILURE the same evening (CLAUDE.md
      § Database Evidence), one layer down: an under-specified identifier that
      still resolves, so nothing errors and the mistake is invisible.
      CROSS-REF, AND THE REASON THIS IS FILED RATHER THAN NOTED: HR-14 carries
      an unresolved Clerk-org-RENAME issue (a rename reaches the DB but the slug
      is never rewritten, and delivery order is not guaranteed). Whoever
      resolves it MUST identify the target org by ID. A rename applied to "the
      Microsoft org" by name has five candidates here and would silently rename
      the wrong one — and since the slug is the part that does not update, the
      damage would not be visible in the name column afterwards.
      FIX DIRECTION: not a code fix. A convention — name orgs by ID (optionally
      "ID (name)") in every doc, prompt and query result — plus a cleanup of the
      dead single-user shells on staging, which is what makes the names
      ambiguous in the first place. Do the cleanup deliberately and by ID.
      SISTER CONVENTION, added 2026-08-01 as a POINTER ONLY — the note itself
      lives once, in PERM-7's Task 7 blocker, and is not restated here.
      `current_setting('neon.branch_id', true)` returns a real value on Neon, so
      a query can CARRY machine-verifiable branch identity instead of an
      asserted literal. Ruled by Gary the same day: select the branch id AND

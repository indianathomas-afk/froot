      has never been exercised on staging either.

  - id: DEBT-17
    status: staging
    commits: ["84437e5"]
    title: "Visiting /users can persist a role the admin never chose — the page creates User rows from Clerk membership alone, ignoring PendingInvite"
    notes: >
      FIXED 2026-07-30 — DIRECTION B, exactly as decided 2026-07-28 and without
      re-litigating the fork. src/app/(app)/users/page.tsx:85-86 now resolves
      the create branch's role as
      `pendingByEmail.get(email)?.role ?? (m.role === "org:admin" ? "ADMIN" :
      "STAFF")`, mirroring the webhook's resolvedRole
      (webhooks/clerk/route.ts:109) so the two writers cannot drift. Every
      file:line in this row was re-verified before editing and NONE had drifted:
      the block is :65-98, the role guess was at :86, pendingByEmail is built at
      :46.
      TWO SILENT-NO-OP RISKS CHECKED FIRST, both clear. (1) KEY MISMATCH —
      pendingByEmail is keyed on raw p.email and the webhook deliberately matches
      `mode: "insensitive"`, but PendingInvite.email is normalised at write time
      (users/route.ts:75) and the lookup key is the already-normalised `email`
      from :74-77 (getClerkPrimaryEmail returns normalizeEmail(primary)), so
      exact match holds. The map was deliberately NOT re-keyed: its other
      consumer at :148 looks up with Clerk's raw inv.emailAddress and re-keying
      would put that at risk for no gain. (2) MISSING FIELD — the query at :37
      has no `select`, so role is present, and PendingInvite.role is the Role
      ENUM (schema.prisma:194), so unlike the webhook's :109 no `as` cast is
      needed.
      NO REPAIR STEP NEEDED — evidence, 2026-07-29/30, Gary ran both queries.
      Q2 (post-webhook signature: role STAFF holding store assignments) returned
      ZERO ROWS on branch `preview/staging` and ZERO ROWS on branch
      `production`. Q1 on branch `preview/staging` returned ONE row
      (kevajuice14@icloud.com, MANAGER vs invited STORE) which is NOT this bug:
      the page can only ever write ADMIN or STAFF, and this row's error runs
      DOWNWARD (STAFF is the floor) whereas that discrepancy runs upward. So the
      fix is code-only; no data repair.
      STILL OPEN AND DELIBERATELY NOT DONE: option C (extract a shared
      syncOrgMembership()). Direction B leaves the GET-that-writes smell in
      place, which was accepted at decision time — "C LATER IF THE SMELL EARNS A
      PHASE". Note BUILD-2's interaction below still applies to C.
      ── ORIGINAL NOTES BELOW, UNEDITED ──
      Filed 2026-07-28 during PERM-7's staging post-mortem. INDEPENDENT OF
      PERM-7 and SHIPS IN PRODUCTION TODAY — it is in no phase's diff and was
      found by tracing every writer of User.role.
      THE BUG: src/app/(app)/users/page.tsx:65-91 auto-syncs "any Clerk member
      who has no DB User record yet" by upserting a User with
      `role: m.role === "org:admin" ? "ADMIN" : "STAFF"` (:86). It never
      consults PendingInvite. The Clerk webhook, which DOES consult it
      (webhooks/clerk/route.ts, `resolvedRole = pending?.role ?? ...`), is the
      only path that knows the admin picked MANAGER or STORE — because
      POST /api/users maps every non-ADMIN role to the same Clerk role,
      `org:member` (users/route.ts:102). The app role is recoverable ONLY from
      PendingInvite.
      CONSEQUENCE: whichever writer runs FIRST wins, and the page can win. An
      admin who invites someone as STORE or MANAGER and then opens /users
      before the webhook lands persists role STAFF permanently — the webhook's
      upsert later takes its UPDATE branch, which sets only `email` and never
      role. The invite's intended role is silently discarded, and PendingInvite
      is not cleaned up either, so the two disagree with no signal.
      Direction of the error is DOWNWARD (STAFF is the floor), so this is a
      lockout/annoyance rather than an escalation — an invited manager lands
      with no manager access and nothing explains why. An org:admin invite is
      unaffected, since both writers agree on ADMIN.
      NOT TRIGGERED in the 2026-07-28 staging attempt — corrected 2026-07-28.
      An earlier version of this line said the invited account "has no User row
      at all"; that came from a mis-branched query. On preview/staging the
      webhook won the race and persisted role STORE correctly from
      PendingInvite. So this remains a REAL but UNEXERCISED race, found by
      code-reading rather than by observation. Its severity is unchanged; only
      the claim that it had been seen is withdrawn.
      FIX DIRECTION: have the page consult PendingInvite exactly as the webhook
      does, or (better) stop writing roles from a render path entirely and let
      the page display an unsynced member as pending rather than materialising
      a guess. A GET that writes is the underlying smell.
      ── AUDIT 2026-07-28 (audit only, NOT implemented; row stays OPEN) ──
      STILL REAL against current code. The block is users/page.tsx:65-98 (the
      row said :65-91 — it extends to :98 including the post-sync re-fetch);
      the role guess at :86 is exact. Sharper than the row states: the page
      ALREADY BUILDS pendingByEmail at :46 from the same PendingInvite rows the
      webhook reads, and the upsert simply does not consult it. The data is in
      hand and unused. Only an ADMIN can trigger the write (requireAdmin,
      users/page.tsx:162). Also drifted: the Clerk role mapping is
      users/route.ts:106, not :102.
      THE WINDOW — NOT MEASURED, and this is stated as structure, not timing.
      It opens when Clerk fires organizationMembership.created and closes when
      the handler's upsert commits. The event is ACCEPTANCE-time, not
      invitation-time: the handler reads membership.public_user_data.user_id
      (webhooks/clerk/route.ts:140), which exists only once someone has joined.
      So normally SECONDS. But it can persist: the handler returns 500 on
      "Failed to resolve member email" (:95) and on any unhandled DB error, and
      Svix retries on a seconds → minutes → hours backoff; and if the webhook
      is misconfigured for an environment or CLERK_WEBHOOK_SECRET is wrong, the
      window is UNBOUNDED and the page becomes the only writer by design rather
      than by race. The trigger — an admin reloading /users to see whether the
      invite was accepted — is the natural admin behaviour in exactly that
      window, which is why "unexercised" should not be read as "unlikely".
      THE WRONG ROW IS PERMANENT, CONFIRMED. webhooks/clerk/route.ts:139-156:
      `update: { email: userEmail }`. `role` appears ONLY in the create branch
      (:154). The page's STAFF row is never corrected. Recovery exists but
      requires an admin to NOTICE — the Edit User dialog sets role and
      assignments (users/[id]/route.ts:136).
      THIS ROW WAS WRONG ABOUT THE AFTERMATH — corrected 2026-07-28. It said
      "PendingInvite is not cleaned up either, so the two disagree with no
      signal." FALSE against current code. The `if (pending)` block at
      webhooks/clerk/route.ts:158-196 is NOT gated on which upsert branch ran;
      it fires whenever a PendingInvite matched. So even when the page wins the
      race, the webhook still creates the correct StoreUserAssignments (:179),
      binds the staff profile (:189), and DELETES the PendingInvite (:195).
      Two consequences pulling opposite ways: LESS BAD — store access lands
      correctly, so the victim gets the right locations with the wrong role;
      WORSE — the forensic evidence self-destructs, so there is normally no
      surviving PendingInvite to compare against. End state is a distinctive
      shape: role STAFF holding store assignments.
      OPTIONS FOR THE FIX — Gary's decision, deliberately not taken here.
      (A) Page stops writing; render unsynced Clerk members as "pending sync".
      Kills the race and the GET-that-writes smell outright. BUT the auto-sync
      is evidently a safety net for missed webhooks, and this removes it: the
      Edit dialog uses prisma.user.update({where:{id}}) and needs the row to
      already exist, so a broken webhook would leave members with no row and no
      path to one. Needs an explicit "Sync now" admin action or it deletes a
      recovery route.
      (B) Page reads PendingInvite as the webhook does. Cheapest — roughly one
      line against data already loaded at :46. Fixes the role; keeps the
      GET-that-writes. Does not reproduce the webhook's store fan-out, but the
      webhook's if(pending) block still lands those later, so it converges. If
      the webhook never lands: role-correct row, no stores, PendingInvite
      survives — strictly better than today. Risk: role resolution now lives in
      two places and can drift.
      (C) Extract the webhook body into a shared syncOrgMembership() called by
      both. One implementation, no drift; whoever wins does the whole job
      correctly and the loser's upsert is a no-op. Biggest diff, in an untested
      production path (the repo has NO tests), still leaves real writes in a
      render path, and needs idempotency care around pendingInvite.delete under
      concurrency.
      (D) Leave the write; warn when role disagrees with a surviving
      PendingInvite. No behaviour change, cheapest to reason about — but per
      the correction above the PendingInvite usually will NOT survive, so it
      detects almost nothing.
      DECISION — GARY, 2026-07-28: **B NOW, C LATER IF THE SMELL EARNS A
      PHASE.** Taken on the audit above, after the correction to the aftermath
      claim. Rationale as presented and accepted: B is roughly one line against
      data the page already loads at :46, it closes the actual harm (the wrong
      role), and it cannot regress the webhook. A is the architecturally right
      answer but silently removes the missed-webhook recovery path, which does
      not look disposable — A is only on the table bundled with an explicit
      "Sync now" admin action. D is close to worthless given the correction,
      because the PendingInvite it would compare against is usually already
      deleted.
      This row therefore stays OPEN as a decided-but-unimplemented fix, not as
      an open question. The next session picking it up implements B and does
      NOT re-litigate the fork.
      EVIDENCE IT HAS OCCURRED — MOSTLY FORECLOSED by the correction above:
      because the webhook deletes the PendingInvite, the direct
      role-vs-PendingInvite comparison survives only where the webhook NEVER
      landed. Two read-only queries were WRITTEN FOR GARY TO RUN, not run here
      (per the session's Neon-console-only rule); run on branch `production`
      first, then `preview/staging`, and label every result with its branch.
      Q1 (webhook never landed) — join "User" to "PendingInvite" on
      organizationId + lower(email) where u.role <> p.role, selecting both
      roles, p."storeIds" and both createdAt.
      Q2 (post-webhook signature, weaker) — "User" u join "StoreUserAssignment"
      a on a."userId" = u.id where u.role = 'STAFF', grouped, counting
      assignments. FALSE POSITIVES ARE POSSIBLE on Q2: an admin can legitimately
      assign stores to a STAFF user by hand via users/[id]/route.ts:136. Q2 is
      a lead, not proof.
      Full query text is in the Appendix of
      docs/prompts/DEBT-10_team_members_pii.md; nothing has been run, so NO
      branch-labelled result exists yet.
      BUILD-2 INTERACTION (2026-07-29). BUILD-2 added a defaultStoreId write
      INSIDE the `if (pending)` block at webhooks/clerk/route.ts:158-196 — the
      same block this row's aftermath correction established fires regardless of
      which writer won the race. Consequences for the decided fix: DIRECTION B
      (page reads PendingInvite) touches the page only and CANNOT disturb it —
      no change needed. OPTION C (shared syncOrgMembership()) WOULD have to
      carry the default-setting across deliberately; it is easy to lose in that
      extraction because it is a `prisma.user.update` sitting AFTER the upsert
      rather than part of it. Also sharpens this row's end-state signature:
      "role STAFF holding store assignments" now additionally carries a
      defaultStoreId when exactly one store was provisioned, which slightly
      strengthens Q2 as a lead (still not proof).

  - id: DEBT-18
    # NO status field: the vocabulary (planned/in_progress/staging/shipped/
    # verified) has no value for "withdrawn", and adding one is a code change to
    # PhaseStatus in src/lib/roadmap.ts. The title carries the state instead.
    # Note this makes DEBT-14's "a missing status means OPEN" rule wrong for
    # exactly this row — fold a `withdrawn` status in when DEBT-14 is picked up.
    title: "WITHDRAWN — '/users displays access an account does not have' rested on a mis-branched query"
    notes: >
      WITHDRAWN THE SAME DAY IT WAS FILED, 2026-07-28. Its founding
      observation was false. The row claimed /users showed store access for an
      account with ZERO StoreUserAssignment rows; the query behind that was run
      against the PRODUCTION branch while being read as staging. On
      preview/staging the account HAS one assignment (#0014) and role STORE, so
      the "#0014" chip on /users was rendering ACTUAL access, correctly, from
      the members table. There was never an anomaly to explain.
      Kept rather than deleted so the retraction is visible and the row number
      is not silently reused. Nothing here should be actioned.
      If a real "intended vs actual access" concern ever surfaces, file it
      fresh — do not resurrect this reasoning, which was built to reconcile a
      contradiction that did not exist.
      ORIGINAL TEXT BELOW, RETAINED AS THE RECORD OF THE ERROR.
      Filed 2026-07-28, deliberately as an OPEN QUESTION rather than a
      diagnosed bug, because the PERM-7 post-mortem could not resolve it and
      guessing is what went wrong repeatedly that day.
      OBSERVED on staging: /users showed the account gary@keva.com as role
      "Store" with location chip "#0014". A direct query of the staging branch
      returned ZERO StoreUserAssignment rows for that account, and no User row
      at all for the accepted Clerk identity
      (user_3H9HEV5iN8vkRDMb71JDSjB37cm). So the chip did not come from actual
      access.
      TWO CANDIDATE SOURCES, neither confirmed:
      (a) the PENDING INVITES table, whose location chips come from
      PendingInvite.storeIds via storeById
      (src/app/(app)/users/page.tsx, the pendingInvites map) — this renders
      INTENDED access and is labelled "Awaiting acceptance". If this is the
      source, the finding is that an invitation Clerk reports as ACCEPTED was
      still being listed as pending, since the page filters Clerk invitations
      on `status: ["pending"]`.
      (b) the MEMBERS table, whose chips come from dbUser.storeAssignments —
      but with no User row this path renders "No locations assigned" and role
      "STAFF", which is NOT what was seen.
      (b) not matching what was observed is itself the puzzle. Do not resolve
      this from the code alone; reproduce it with a screenshot and a
      simultaneous query.
      WHY IT MATTERS BEYOND THE COSMETICS: /users is the page an admin uses to
      answer "what access does this person have?". If it can show intended
      access in a way indistinguishable from actual access, the answer is
      untrustworthy in exactly the situation where it is most consequential —
      a half-completed invite. Related: DEBT-17 (same page, writes roles from
      a render path).

  - id: DEBT-19
    title: "Organization NAMES are not identifying on staging — nine orgs, five called \"Microsoft\", two \"Keva Juice\""
    notes: >
      Found 2026-07-28 while choosing an org for PERM-7's re-run. Verified ON
      BRANCH preview/staging (branch named per CLAUDE.md § Database Evidence).
      Nine Organization rows:
      cmqvpe2bf000004l1gwxafqk4 "Keva Juice" square=f users=1;
      cmr54z65v000105jxczpt72w1 "Microsoft" square=TRUE users=4;
      cmr54x6gp000005jx7odzwx9e "Microsoft" square=f users=0;
      cmr57tw80000004l49xf6ft71 "Microsoft" square=f users=0;
      6b545d5b-3ea1-442d-b16d-9089984af8b6 "Microsoft" square=f users=1;
      cmr55fhm1000004l5az4vu73j "Microsoft" square=f users=1;
      cmrx04zn7000004jy6mk1mmha "Keva Smoothie Company" square=f users=0;
      cf888f2d-f234-48c7-8097-fd5b44b5b3dd "Keva Juice" square=f users=2;
      cmrefoomo000004l7dq37gdgn "My Organization" square=f users=1.
      Six have zero or one user; exactly ONE has Square connected.
      THE PROBLEM: a name identifies nothing. "the Microsoft org" picks out five
      rows, four of which are empty shells. Any instruction, prompt, decision
      record or query result that names an org by NAME is ambiguous, and the
      ambiguity is silent — you get A row, just not necessarily the one meant.
      SAME SHAPE AS THE BRANCH-LABEL FAILURE the same evening (CLAUDE.md
      § Database Evidence), one layer down: an under-specified identifier that
      still resolves, so nothing errors and the mistake is invisible.
      CROSS-REF, AND THE REASON THIS IS FILED RATHER THAN NOTED: HR-14 carries
      an unresolved Clerk-org-RENAME issue (a rename reaches the DB but the slug
      is never rewritten, and delivery order is not guaranteed). Whoever
      resolves it MUST identify the target org by ID. A rename applied to "the
      Microsoft org" by name has five candidates here and would silently rename
      the wrong one — and since the slug is the part that does not update, the
      damage would not be visible in the name column afterwards.
      FIX DIRECTION: not a code fix. A convention — name orgs by ID (optionally
      "ID (name)") in every doc, prompt and query result — plus a cleanup of the
      dead single-user shells on staging, which is what makes the names
      ambiguous in the first place. Do the cleanup deliberately and by ID.

  - id: DEBT-20
    title: "POST /api/staff/sync-square gates with an inline isAdmin check instead of can(staff.sync.square) — the capability's only other call site uses it"
    notes: >
      Found 2026-07-28 while fixing DEBT-10, in the immediate neighbourhood of
      that change; written down rather than fixed inline because DEBT-10 was
      scoped to GET /api/square/team-members. Related: DEBT-10, which created
      the asymmetry by migrating the read half of this pair.
      NOT A SECURITY GAP AND NOT URGENT — say this first so the row is not
      read as one. Both enforcement points land on ADMIN today, so behaviour is
      identical either way. src/app/api/staff/sync-square/route.ts:20-21 does
      `const { isAdmin } = await getUserStoreScope()` then
      `if (!isAdmin) return 403`, while the sibling read it pairs with,
      src/app/api/square/team-members/route.ts, now does
      `can({ role }, "staff.sync.square")` after DEBT-10. Same capability, same
      tier, two different mechanisms — in the same user flow: the Staff page's
      "Import from Square" button reads through the migrated route and its
      "Sync Locations from Square" button writes through the unmigrated one
      (both in src/app/(app)/staff/staff-buttons.tsx, :167 and :486).
      WHY IT IS WORTH A ROW ANYWAY: PERM-1's shim exists so that PERM-5's
      per-user overrides have ONE place to hook in (src/lib/permissions.ts
      SCOPE_OVERRIDES). An inline `isAdmin` is invisible to that layer. On the
      day someone is granted staff.sync.square by override, Import will start
      working for them and Sync will not, and the failure will present as an
      inexplicable 403 on one of two adjacent buttons rather than as a missed
      migration. The cost of that is paid later and by someone else, which is
      exactly the shape worth recording now.
      SCOPE IF PICKED UP: two lines in
      src/app/api/staff/sync-square/route.ts — swap the destructure to
      `{ role }` and the check to
      `if (!can({ role }, "staff.sync.square")) return 403`. No behaviour
      change, so nothing to verify beyond `next build` and one admin-path
      smoke test of the Sync button.
      DO NOT WIDEN THE SWEEP WITHOUT A RULING. This row is deliberately about
      ONE route, not "migrate every inline role check". docs/
      PERMISSIONS_INVENTORY.md §3 lists call sites whose enforcement points
      CONTRADICT each other, and src/lib/permissions.ts's header is explicit
      that each of those needs Gary's ruling before migration because the shim
      necessarily encodes one answer. sync-square is not one of those — inline
      and capability agree on ADMIN — which is precisely why it is safe to do
      alone and why bundling it with the contradicted ones would not be.

  - id: DEBT-21
    title: "generate-roadmap.mjs coerces commit SHAs to strings for phases and bugs but not for debt"
    notes: >
      Found 2026-07-28 while adding status/commits to DEBT-10, one line away
      from the change. LATENT, NOT LIVE — no row triggers it today.
      THE MECHANISM is the one the script already documents for phases
      (generate-roadmap.mjs:82-85): an all-digit short SHA such as 2081401 or
      9743899 is valid YAML for a NUMBER, so `commits` parses as a mixed
      string/number array. withStringCommits() coerces it — but it is applied to
      phases and bugs only, and debt is normalized without it:
        const phases = withStringCommits(normalize(raw.phases))
        const bugs   = withStringCommits(normalize(raw.bugs ?? []))
        const debt   = normalize(raw.debt ?? [])
      (generate-roadmap.mjs:93-95). A debt row carrying an all-digit SHA would
      therefore reach the page as a number while DebtItem.commits is typed
      string[] — the same silent shape drift the phase comment was written to
      prevent. Both SHAs on debt rows today contain letters (6530d8b, 2877b41),
      which is the only reason nothing is broken. DEBT-14's render now prints
      commits, so the first all-digit debt SHA is the one that surfaces it.
      FIX: one word — wrap the debt line in withStringCommits, as the two lines
      above it already are.
      FILED RATHER THAN FIXED INLINE: DEBT-14 was scoped to the render, this is
      the generator, and a one-word fix in a different file is still a change
      nobody asked for in that diff (the same rule applied to DEBT-11 in Ruling
      2, 2026-07-28). Cheap to take whenever the generator is next opened.

  - id: DEBT-22
    status: staging
    commits: ["84437e5"]
    title: "hr/acknowledge loads a manager-attest target's storeAssignments with no orderBy — the only unordered primary-store pick left"
    notes: >
      FIXED 2026-07-30. src/app/(app)/hr/acknowledge/[documentId]/page.tsx:56 now
      carries the standard
      `orderBy: [{ isPrimary: "desc" }, { store: { name: "asc" } }]`. One line,
      no migration, no behaviour change for anyone who has a primary. The
      file:line was re-verified before editing and had not drifted.
      With this, EVERY storeAssignments load in the codebase orders
      deterministically — the split this row documented is closed. Cosmetic as
      described: the persisted value was always recomputed server-side from an
      ordered query (acknowledgments/route.ts:94-102), so no signed record was
      ever affected and there is nothing historical to correct.
      ── ORIGINAL NOTES BELOW, UNEDITED ──
      Found 2026-07-29 during the BUILD-2 audit, while disproving the claim
      that primaryStoreName() runs on unordered data (see the correction on
      BUILD-2 and DEBT-9). It does not — but this one site does.
      WHERE: src/app/(app)/hr/acknowledge/[documentId]/page.tsx:54-57. The
      manager-attested branch loads the target staff member with a bare
      `include: { storeAssignments: { include: { store: true } } }` — no
      orderBy. Every other load of storeAssignments in the codebase uses
      `orderBy: [{ isPrimary: "desc" }, { store: { name: "asc" } }]`
      (src/lib/hr.ts:23, src/app/api/hr/forms/shared.ts:48,
      src/app/api/hr/documents/[id]/acknowledgments/route.ts:99,
      src/lib/hr-compliance.ts:148, src/lib/hr-signed-pdf.ts:764,
      src/app/(app)/staff/page.tsx:33, src/app/(app)/staff/[id]/page.tsx:32).
      This is the sole exception.
      That unordered array reaches the client at
      src/app/(app)/hr/acknowledge/[documentId]/page.tsx:120-124 and is picked
      over at signing-client.tsx:91 —
      `staff.stores.find((s) => s.isPrimary) ?? staff.stores[0] ?? null` —
      which pre-selects the store chip.
      COSMETIC, NOT A LEGAL EXPOSURE, and the reason matters: the value that
      gets PERSISTED is recomputed server-side. On the attested path
      acknowledgments/route.ts:172 calls primaryStoreName(staff) against its
      OWN ordered query at :94-102, and per the comment at :167-169 the
      attested path has no selector at all. So a mis-ordered pre-selection
      cannot reach HrDocumentAcknowledgment.storeName. What it can do is
      show a manager an arbitrary chip for a staff member with no primary —
      visible, briefly confusing, never written down.
      Once BUILD-2's partial unique index lands, the duplicate-primary case
      is impossible and this narrows to the zero-primary case only (DEBT-9's
      shape). It does not narrow to nothing: a staff member with no primary
      and several stores still gets an arbitrary chip here.
      FIX: add the standard orderBy to the include at page.tsx:56. One line,
      no migration, no behaviour change for anyone who has a primary.
      NOT DONE IN BUILD-2 — filed rather than fixed, per Gary 2026-07-29,
      because BUILD-2's fence is the column plus its two migrations and this
      is an HR signing surface.

  - id: DEBT-23
    title: "WITHDRAWN — DEPLOY_LOG.md was never missing an entry; the row was built on a misread grep"
    notes: >
      WITHDRAWN 2026-07-30. THE ROW BELOW IS FALSE. docs/DEPLOY_LOG.md contains
      an entry for every production promotion on record — all SIX that meta.note
      lists: 2026-07-27 (line 7), 2026-07-26 (:69), 2026-07-25 (:91),
      2026-07-24 (:111), 2026-07-23 (:131), 2026-07-21 (:145). The 2026-07-27
      entry the row claims is missing is the FIRST heading in the file.
      HOW THE ERROR HAPPENED, recorded because the mechanism will recur:
      `grep "promotion" docs/DEPLOY_LOG.md | tail -5` was run and the LAST match
      read as the newest entry. DEPLOY_LOG is REVERSE-CHRONOLOGICAL — newest at
      the top — so `tail` returned the OLDEST entries. A row, a "second
      occurrence" claim, and a follow-up "third occurrence" remark were all built
      on that single unchecked assumption. The "third occurrence" framing was
      Gary's, offered in good faith on the strength of this row, and rests on the
      same false premise — the error originates here, not there.
      LESSON, not just an apology: `tail` on a file whose order was never checked
      is not evidence. The file's ordering is visible in one `grep -n "^## "`,
      which is what should have been run and is what settled it.
      WHAT SURVIVES: the 2026-07-29 BUILD-2 promotion genuinely had no entry at
      the time this was withdrawn — for the ordinary reason that it had just
      happened, not because of any pattern. That entry was written in the same
      commit as this withdrawal. Nothing else in the row stands.
      NO STATUS FIELD, deliberately: like DEBT-18, this is withdrawn rather than
      fixed, so it buckets OPEN on /internal/roadmap with WITHDRAWN as the first
      word of its title. Adding a `withdrawn` value to PhaseStatus is a separate
      decision (Gary, 2026-07-28) and not a rider on this.
      ── ORIGINAL TEXT BELOW, RETAINED AND FALSE ──
      Noted 2026-07-29 during the BUILD-2 audit; filed, not fixed. The most
      recent promotion heading in docs/DEPLOY_LOG.md is "2026-07-23 — PRODUCTION
      promotion (HR-8 → STAFF-1 batch)", but ROADMAP and git both record a
      2026-07-27 promotion (merge 06b1561, "Promote staging: PERM-2, PERM-3,
      BUILD-1, SQ-1 docs, roadmap dashboard", with 17dc723 recording BUILD-1,
      BUG-3 and SQ-2 verified in production). The 2026-07-21 entry already
      carries a note that its own entry was missing when the promotion happened,
      so this is the second occurrence of the same gap, not a one-off. MATTERS
      because DEPLOY_LOG is the only place the ORDER and CONTENT of production
      promotions is narrated — MIGRATIONS.md records which migrations rode which
      promotion and points AT DEPLOY_LOG for the rest. A missing entry means
      the next person reconstructing "what went to prod when" has to read git.
      Reconstructable from git log at the time of writing; gets harder, not
      easier.
      DO NOT LET FILING THIS ROW BECOME THE THIRD OCCURRENCE (Gary,
      2026-07-29). BUILD-2 itself carries two migrations
      (20260729124105_build2_user_default_store,
      20260729145504_build2_staff_one_primary_store) and is promoted to main
      separately from this row being filed. THAT promotion needs its own
      DEPLOY_LOG entry — naming both migrations, since MIGRATIONS.md's own
      history section records migrations per promotion and would otherwise have
      nothing to point at. Writing this row down is not the same as closing it.

  - id: DEBT-24
    status: staging
    commits: [f646bf6]
    title: "meta.updated in ROADMAP.yaml was the roadmap page's fallback date, was stale, and nothing maintained it"
    notes: >
      FILED AND FIXED IN THE SAME COMMIT 2026-07-30, on Gary's ruling. Recorded
      in full anyway: the finding is about a class of trap, and the deletion
      alone would not explain itself to a future reader.
      RULING — GARY, 2026-07-30: TAKE (a), DELETE meta.updated and let the
      fallback be "unknown". An unmaintained fallback is worse than none. Not to
      be re-litigated; option (b) below was considered and rejected.
      HOW THE LABEL RESOLVES: scripts/generate-roadmap.mjs:38-50 runs
      `git log -1 --format=%cI -- docs/ROADMAP.yaml` at build time (prebuild /
      predev hooks); :97-108 picks git -> meta.updated -> unknown and records
      WHICH, and the page states the source under the date
      (roadmap-client.tsx:321-326) in warning colour whenever it is not git
      (:350-352). It is NOT file mtime, so a fresh clone cannot turn the label
      into "last deployed" — a clone still carries history. The mechanism is
      careful; this row is about a rotting input to it, not a flaw in it.
      THE FALLBACK PATH: Vercel shallow-clones (~10 commits per the comment at
      generate-roadmap.mjs:32, not independently verified). If ROADMAP.yaml's
      last change falls outside that window `git log` exits 0 with EMPTY output
      rather than failing — the `out || null` at :45 exists for exactly this —
      and meta.updated was used instead.
      THE PROBLEM: meta.updated read 2026-07-27 while ROADMAP.yaml's last commit
      was 2026-07-29T15:43:26-07:00, and `git log -S` showed the field changed
      EXACTLY ONCE EVER — f0bcb91, 2026-07-24, the commit that created the meta
      block. Nothing wrote it; WORKFLOW.md's session-completion rules never
      mentioned it. So the fallback held a value wrong since the day it was
      written, drifting further every session.
      WHY IT MATTERED DESPITE THE DISCLOSURE: the failure was invisible in normal
      operation because the git path always wins — the staleness could only be
      discovered at the moment it was being relied on. When it fired the page
      would render "Roadmap last updated Jul 27" in the prominent line with a
      small warning beneath: a plausible date, not an obviously broken one.
      LIKELIHOOD WAS LOW, NOT ZERO. Measured over the last 20 commits,
      ROADMAP.yaml was touched at #1, 5, 6, 8, 9, 11, 12, 13, 14, 16, 17, 18, 19,
      20 — largest gap 4 commits, comfortably inside depth 10. But that is a
      property of working habits, not a guarantee: a long code-only run deferring
      the roadmap update to the end would cross it.
      REJECTED — (b) keep meta.updated and add "bump it" to WORKFLOW.md's session
      completion rules. Preserves a real fallback but relies on a manual step
      that had been skipped every session for five days; the evidence was against
      it. ALSO REJECTED, and never on the table: deriving the fallback from build
      time, which is exactly the "last updated becomes last deployed" failure the
      design avoids.
      SAFE AS A ONE-LINE DELETE, verified 2026-07-29 before doing it: the
      generator reads only raw.phases (:93), raw.bugs (:94), raw.debt (:95) and
      raw.meta?.updated (:98). Nothing anywhere reads meta.sources_retired or
      meta.note. With `updated:` gone, metaUpdatedToIso returns null at its first
      guard (:67), fromMeta is null, and the chain falls to `unknown`, which the
      page already renders (roadmap-client.tsx:341-345 and the :326 label). No
      code change was required.
      SIDE NOTE for whoever next opens the meta block: after this deletion NOTHING
      in it is read by any code. meta.note remains valuable human history (six
      production promotions with SHAs, the `--ancestry-path` re-verification, the
      SQ-2 double-SHA divergence, the rollback tag, HR's production launch date)
      and should not be deleted on the grounds that it is unread.

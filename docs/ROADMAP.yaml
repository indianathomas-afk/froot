      REVERSE the fail-closed fix recorded on BUILD-1.
      (1) §2 claims the Neon-Vercel integration auto-creates an isolated
      database branch per Preview deployment. It does not, and never did here —
      Neon's own console reports "You don't have any preview branches yet."
      Staging is served by one long-lived branch, ep-odd-rain, wired by hand.

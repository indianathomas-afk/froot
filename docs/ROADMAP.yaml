      on DEBT-51.
      736ac99 IS NOT BEHAVIOUR-VERIFIED AND CANNOT BE HERE. The truncation
      symptom needs more than ten SIMULTANEOUSLY PENDING invitations in one org;
      below that threshold the fixed and unfixed code render byte-identical
      pages. Staging is nowhere near it — one PendingInvite row on the whole
      branch. Reproducing it would take eleven test principals. It rests on the
      Clerk type contract and review. The warnAbove log line is the substitute
      for a test: zero firings against anything measured on 2026-08-03, and a
      real count the first time an org crosses. A clean staging pass proves
      absence of REGRESSION, not that the truncation is fixed.
      THE CASE TRAP TURNED OUT TO BE EMPTY. Measured 2026-08-03 across all three
      branches — the two below plus production (br-sparkling-block-a620qvg4) —
      mixed_case_rows = 0 everywhere, and ci_sibling_count = 1 on every row that
      returned it, so the collision the fix guards against has no instance
      either. The paragraphs below saying production and preview/main "have
      never been examined" were true when written and are superseded by that
      measurement. d098530 is therefore HARDENING, not remediation: the danger
      that actually materialised was orphaning, which no amount of
      case-normalisation touches. TWO OF THIS ROW'S PARAGRAPHS ARE STALE BY
      DESIGN AND KEPT UNEDITED — "FIX DIRECTION, not yet ruled" (ruled: R1
      newest-wins, R3 DB-delete-first, R5 report the count) and the one-branch
      measurement above.
      ——— ORIGINAL TEXT BELOW, UNEDITED ———
      COST OF DOING NOTHING: A pending invitation can carry a live role grant
      that no page displays and no button can revoke, and the admin who tried to
      revoke it was told it worked — LIVE (trigger: already fired, on
      preview/staging, on the org with Square connected; the stale ADMIN invite
      in DEBT-44 sat invisible from 2026-07-09 to 2026-08-02 and was found by a
      query, not by the product). Sharpest on ADMIN, because the webhook prefers
      the PendingInvite role over the Clerk membership role, so an invisible row
      silently escalates the NEXT invitation to that address.
      FILED 2026-08-02 by DEBT-44a, from the Taylin invite in DEBT-44 (4).
      Established from code at HEAD; the database evidence is on DEBT-44.
      IT IS ONE DEFECT, NOT THREE, and that is why it is one row: unreachable
      AND unremovable is what makes it dangerous. Either half alone is
      survivable — an invisible row you can still revoke by address is tidy-up,
      and a visible row whose revoke fails is a bug someone notices. Together
      they make a live grant that nothing in the product can see or delete.
      THE THREE PATHS THAT READ PendingInvite.email, TWO OF WHICH DISAGREE WITH
      THE THIRD:
      (1) webhooks/clerk/route.ts:103-105 — case-INSENSITIVE, deliberately, and
      commented "older rows may hold mixed-case emails". This is the path that
      CONSUMES the row, so the grant always lands.
      (2) users/page.tsx:46 — builds `new Map(pendingInviteRecords.map(p =>
      [p.email, p]))` and looks it up at :157 with `inv.emailAddress`. Case
      SENSITIVE. A mixed-case row never enriches its Clerk invitation.
      (3) api/users/invitations/[invitationId]/route.ts:29-31 — `deleteMany({
      where: { organizationId, email: invitation.emailAddress } })`. Case
      SENSITIVE. On a mixed-case row it matches nothing.
      AND THE RENDER IS CLERK-DRIVEN, NOT DATABASE-DRIVEN, which is the half
      that makes it invisible rather than merely mislabelled. users/page.tsx:156

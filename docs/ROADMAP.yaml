      DOING IT BEFORE ANY GATE EXISTS IS THE WHOLE VALUE, and it is the only
      reason this left DEBT-48 rather than waiting for that phase. Now, it is a
      form default plus a nullable column. After a gate ships, it is a
      data-correction problem on live templates with no way to tell an operator's

  - id: DEBT-37
    title: "columnForStatus has no board column for `withdrawn` and silently falls through to Planned"
    notes: >
      COST OF DOING NOTHING: Unreachable today — verified at HEAD that
      BOARD_COLUMNS still has no `withdrawn` column, and that the only two rows
      carrying the status are DEBT rows, which render through BugsAndDebt/DebtRow
      and never reach columnForStatus — LATENT (trigger: the first PHASE, not a
      debt row and not a bug, given `status: withdrawn`. It will render under
      Planned, the most wrong of the three available answers, and it will fail
      quietly as a card in the wrong column rather than as an error).
      DERIVED-AT-HEAD-BY-DEBT-TRIAGE-2 2026-08-02, not the audit's.
      FILED 2026-08-01 by Gary's instruction, from the DEBT-SWEEP session that
      added the `withdrawn` status (cf0b044). Found during that work, stated in
      the session report, and filed rather than fixed BECAUSE a report is not
      the repo: an observation that lives only in a transcript does not exist.
      THE FACT: BOARD_COLUMNS (src/lib/roadmap.ts) maps planned/in_progress ->
      Planned, staging -> In staging, shipped/verified -> In production. It
      claims no column for `withdrawn`. columnForStatus loops those columns and
      returns "planned" when nothing matches, so a withdrawn PHASE would render
      on the board as Planned — the most wrong of the three available answers,
      since withdrawn is the opposite of upcoming.
      WHY IT IS UNREACHABLE TODAY, which is why this is a row and not a bug:
      columnForStatus is called from exactly one place
      (roadmap-client.tsx, the board grid) and only ever over `phases`. The two
      rows carrying `withdrawn` are DEBT rows, which render through
      BugsAndDebt/DebtRow and never touch columnForStatus. No phase has the
      status and none is expected to.
      THE TRIGGER THAT MAKES IT REACHABLE is therefore specific and worth
      naming: the first time a PHASE (not a debt row, not a bug) is given
      `status: withdrawn`. That is a plausible thing to want — a planned phase
      that gets abandoned is exactly the case the value was invented for — and
      it will fail quietly, as a card in the wrong column, not as an error.
      DELIBERATELY OUT OF SCOPE OF THE RULING THAT CREATED IT. Gary's
      `withdrawn` ruling (2026-08-01) scoped the work to the type, isResolvedDebt
      and a one-word label, and said to report-and-skip anything larger. The
      honest fix here is a fourth board column (or an explicit exclusion from
      the board), which is UI beyond that scope. Filed at full size instead of
      being half-done inside a sweep.
      FIX SHAPE when picked up: either add a Withdrawn column to BOARD_COLUMNS,
      or have the board filter withdrawn phases out explicitly rather than let
      them land in Planned by fallback. Prefer whichever makes the fallthrough
      impossible to reach silently — the defect is the silence, not the column
      count. Related: DEBT-18, DEBT-23, DEBT-26.

  - id: DEBT-38
    status: shipped
    commits: ["7d984be"]
    title: "CLOSED — A code-carrying production promotion went unlogged for three days — fast-forward promotions leave no artifact that prompts a DEPLOY_LOG entry"
    notes: >
      SHIPPED TO PRODUCTION 2026-08-07 in merge "fad9207" — AND ITS FIRST
      EXERCISE FOUND A GAP IN ITSELF, NOW FIXED. The same promotion that
      carried this fix was the first run under it, and it worked: "fad9207" is
      a real merge commit with two parents, where the two promotions before it
      had to record "FAST-FORWARD, not a merge — git revert -m 1 does not
      apply" over hand-assembled 32- and 28-commit revert lists.
      BUT the one-line rollback §2 promised does not run. Tested rather than
      assumed on the day: `git revert -m 1 fad9207` conflicts on
      docs/DEPLOY_LOG.md — 37 of 38 files revert cleanly — and it will do so on
      every future promotion, because §2 has the log entry committed on main
      AFTER the merge while the promotion set also touches that file. The
      corrected three-line recipe, plus the rule that the log is KEPT rather
      than reverted, is now in WORKFLOW.md §2 under "Rolling a promotion back";
      the measurement lives in the "fad9207" DEPLOY_LOG entry.
      A SECOND GAP, same section, same day: §2's command block read checkout /
      pull / merge / push / checkout, with the DEPLOY_LOG add+commit only in
      the prose beside it — so copying the block literally pushed without
      committing the entry, which is this row's own failure mode. The commands
      are now in the block.
      THE ROW CLOSES WITH BOTH GAPS FIXED, NOT HIDDEN. It is filed as shipped
      because the fix is in production and works; the corrections above are
      recorded here rather than in a new row because they are defects in this
      row's own remedy, found by using it, and a reader asking "did DEBT-38
      actually work" needs both halves in one place.
      ── ORIGINAL CLOSURE NOTES BELOW, UNEDITED ──
      CLOSED 2026-08-07 — RULED, AND BOTH FIX DIRECTIONS WERE TAKEN. The row
      offered (a) a DEPLOY_LOG step inside WORKFLOW.md §2 and (b) `--no-ff` on
      promotions, and its own last word was that they are not exclusive. Gary
      ruled BOTH, applied in "7d984be": §2 now writes the docs/DEPLOY_LOG.md
      entry BETWEEN the merge and the push — a step OF the promotion rather than
      a thing remembered afterwards — and the promotion merge is
      `git merge staging --no-ff --no-edit`, which restores the merge commit as
      the artifact that prompts the entry, restores `git log --merges` as a
      reconstruction tool, and makes `git revert -m 1 <merge-sha>` the rollback
      again.
      WHY BOTH RATHER THAN THE CHEAPER ONE ALONE: (a) by itself leaves the
      reconstruction and rollback halves broken — `git log --merges` would still
      return none of these promotions — while (b) by itself restores the
      artifact without saying what to do when you see it. Each covers the
      other's gap, which is what "not exclusive" meant.
      TIMING, AND IT IS WHY THIS WAS RULED NOW RATHER THAN LATER: at ruling time
      staging was SEVENTEEN commits ahead of main. This row's stated trigger is
      THE NEXT PRODUCTION PROMOTION, and a delta that size means the trigger is
      close. The fix lands BEFORE it fires rather than after — which was the
      entire argument for not carrying this row another cycle.
      STATUS IS `staging`, NOT `shipped`: "7d984be" is committed on the staging
      branch and has been neither pushed nor promoted. Flip to `shipped` when it
      reaches main — and note that under the fix itself, that promotion will
      write its own DEPLOY_LOG entry. First use of the mechanism is the
      promotion that carries it.
      ── ORIGINAL NOTES BELOW, UNEDITED ──
      COST OF DOING NOTHING: DEPLOY_LOG is complete today — the missing entry
      was written 2026-08-01 — and the mechanism that lost it for three days is
      entirely untouched — LATENT (trigger: the next production promotion, which
      will be a fast-forward, will create no merge commit, and so will produce no
      artifact prompting anyone to write the entry. A second consequence rides
      the same trigger: rollback stays a hand-assembled reverse-order revert
      range instead of a one-line `revert -m 1`, which is exactly what you do not
      want to be assembling under pressure).
      DERIVED-AT-HEAD-BY-DEBT-TRIAGE-2 2026-08-02, not the audit's.
      AWAITING GARY'S RULING: fix direction (a) a DEPLOY_LOG step inside
      WORKFLOW.md §2, or (b) `--no-ff` on promotions — or both. Title prefixed
      2026-08-02 by DEBT-TRIAGE-1 so the row stops reading as backlog; the
      deferral is the row's own ("the choice is Gary's"), transcribed, not new.
      ── ORIGINAL NOTES BELOW, UNEDITED ──
      FILED 2026-08-01 by DOCS-2, on Gary's rider. The promotion 746c1be
      (2026-07-29 08:24, twenty-one commits carrying PERM-6, PERM-7, DEBT-8,
      DEBT-10 and DEBT-14) reached production with NO docs/DEPLOY_LOG.md entry
      and stayed that way for three days. Its entry was written 2026-08-01, at
      the same time as the entries for 63407be and 97ed309.
      HOW IT WAS FOUND, which is the uncomfortable part: from
      `git reflog show main`, NOT from DEPLOY_LOG and NOT from ROADMAP. Neither
      document contained anything that pointed at it. It surfaced only because
      DOCS-2 was independently reconstructing every promotion from git and the
      reflog showed five pushes where the documents accounted for two. Nothing
      in the normal reading path would have surfaced it.
      NOT EVIDENCE FOR DEBT-23'S REASONING, stated explicitly because the
      temptation to resurrect it is real. DEBT-23 claimed a missing 2026-07-27
      entry and a "second occurrence" pattern; BOTH were false and it was
      WITHDRAWN — the entry it called missing was the first heading in the file,
      and the error was a `tail` on a file whose reverse-chronological order was
      never checked. That row stays withdrawn and its reasoning stays false.
      THIS row is the FIRST genuine recurrence, established independently from
      the reflog rather than inherited from that argument. DEBT-23's surviving
      instruction — "Writing this row down is not the same as closing it" — is
      what this row exists to honour.
      THE MECHANISM IS A PROCESS GAP, NOT AN ATTENTION LAPSE, and this is the
      part that matters. FIVE of the seven pushes to main since 06b1561 were
      FAST-FORWARDS: 17dc723, 746c1be, 18220bb, 493175e, 63407be and 97ed309 all
      moved main without creating a merge commit. WORKFLOW.md §2's
      `git merge staging --no-edit` produces no merge commit when main has not
      moved independently, so there is (1) no merge commit to serve as the
      artifact that prompts someone to write the entry, and (2) nothing for
      `git log --merges` to return when reconstructing after the fact — it finds
      NONE of these promotions. The older entries in DEPLOY_LOG all have merge
      SHAs and `git revert -m 1` rollbacks precisely because main used to
      diverge. It stopped diverging, and the habit that depended on that
      silently stopped working.
      CONSEQUENCE: this WILL recur until something changes. It is also why every
      recent DEPLOY_LOG entry has to spell out a reverse-order revert range
      instead of a one-line `revert -m 1`.
      FIX DIRECTION IS AN OPEN QUESTION FOR GARY, not a decision taken here.
      Two candidates: (a) a step in WORKFLOW.md §2 that makes writing the
      DEPLOY_LOG entry part of the promotion itself rather than a thing
      remembered afterwards, or (b) `--no-ff` on promotions, restoring the merge
      commit as both the artifact and the rollback handle. (b) also restores
      `git log --merges` as a reconstruction tool and makes `revert -m 1` work
      again; (a) is cheaper and touches no git behaviour. They are not exclusive.
      WORKFLOW.md was deliberately NOT edited by DOCS-2 — the choice is Gary's.
      Related: DEBT-23 (withdrawn, and not the basis for this row), DEBT-24.

  - id: DEBT-39
    title: "Two writers create User rows and only ONE derives the device name — a page-won acceptance race skips PERM-7 Task 7 permanently and silently"
    notes: >
      COST OF DOING NOTHING: Clerk collects no name on any observed path, so
      whichever writer wins the race the visible damage is a blank name rather
      than a person's — LATENT (trigger: `first_name`/`last_name` made REQUIRED
      in the Clerk dashboard, or any new sign-up path that collects a name.
      CHECK IT AS ONE TRIGGER WITH DEBT-40 AND PERM-7 TASK 7 — the same
      configuration change unmasks all three at once, and after it this race
      starts putting a person's name on a device account).
      DERIVED-AT-HEAD-BY-DEBT-TRIAGE-2 2026-08-02, not the audit's. LIMIT
      STATED RATHER THAN GLOSSED: nobody has measured which writer actually wins
      in practice, so a device account showing a blank name TODAY is possible
      and unobserved. That does not change the verdict — blank is not a person's
      name — but it is the part of this row nobody has checked.
      RECORD HALF RELOCATED 2026-08-02 by DEBT-TRIAGE-2 → docs/DECISIONS.md,
      appended to the PERM-7 Task 7 section as "The reopening condition — and it
      fires in the Clerk dashboard, not in this repo". That is the point of the
      move: the trigger is a settings change made by a person standing in the
      Clerk dashboard, and nobody standing there reads ROADMAP.yaml. It is
      written as ONE trigger unmasking two things, per this row's own
      instruction. THIS ROW KEEPS ITS TASK — mirror NAME as DEBT-17 mirrored
      ROLE, so either winner of the race produces the same row.
      FILED 2026-08-01, on Gary's PERM-7b ruling, which was given and never
      applied because that session stopped at part one. The finding is from
      PERM-7b's audit; the filing is PERM-7c's.
      THE RACE. Two writers can create the User row for an accepted invite, and
      whichever runs first wins. (1) The Clerk webhook,
      src/app/api/webhooks/clerk/route.ts — its upsert create branch at :151-153
      derives the device name (`deviceName ?? …`, deviceName built at :126-137)
      when the invite is role STORE with exactly one store. That is PERM-7 Task
      7. (2) The /users page, src/app/(app)/users/page.tsx:84 — its create
      branch writes `name: [pub.firstName, pub.lastName].filter(Boolean).join("
      ") || null` with NO deviceName derivation at all.
      WHY IT IS PERMANENT AND SILENT. The webhook's UPDATE branch is
      `update: { email: userEmail }` (route.ts:146) and deliberately never
      writes name — create-only is the Ruling 4 guard that stops later Clerk
      events resetting a corrected name (DECISIONS.md 2026-07-28). So if the
      page creates the row first, the webhook arrives second, takes the update
      branch, and Task 7 never runs for that account — not late, never. Nothing
      logs it, nothing retries it, and the resulting name is a plausible value
      rather than an obviously missing one.
      DEBT-17 IS THE PRECEDENT AND THE INCOMPLETE FIX. That row is the same race
      on the same two writers, found for ROLE. The fix (84437e5, direction B)
      mirrored ROLE between them — users/page.tsx now resolves role from
      PendingInvite exactly as the webhook's resolvedRole does, so the two
      cannot drift. It left NAME unmirrored. One field of a two-field race was
      closed and the other was not noticed.
      CURRENTLY MASKED, AND THIS IS WHY IT IS DEBT RATHER THAN A BUG ROW. The
      page can only write a name Clerk gives it, and Clerk gives it none: the
      sign-up flow renders only REQUIRED fields, first/last are merely enabled,
      and no name is collected on any observed path including OAuth — the
      unreachability finding recorded in full on PERM-7's Task 7 blocker
      (three staging runs, 2026-08-01). So today the page writes null, the
      webhook writes the store name if it wins, and null if it does not, and the
      visible damage is a blank name rather than a person's name.
      ONE ROOT CAUSE, ONE REOPENING CONDITION, shared with that closure: two
      writers with unmirrored fields, masked by a Clerk configuration that
      collects no name. If first/last are ever made REQUIRED, or a sign-up path
      is added that collects a name, BOTH unmask together — Task 7's override
      becomes reachable-and-untested AND this race starts putting a person's
      name on a device account, which is the exact hazard the convention exists
      to prevent. Check them as one trigger, not two.
      FIX DIRECTION, not taken here: mirror NAME as DEBT-17 mirrored ROLE — give
      the page the same PendingInvite-driven derivation, so either winner
      produces the same row. Direction C (stop the GET from writing at all)
      remains the deliberately-untaken option and would close both races
      outright.
      Related: DEBT-17 (the same race, role half, fixed), PERM-7 Task 7 (the
      derivation and its unreachability closure), DEBT-40 (the comments that
      still describe the unreachable path as live).


    shipped: 2026-07-27
    commits: [3902d5c, 06b1561]
    title: "Live /internal/roadmap dashboard rendered from docs/ROADMAP.yaml"
    notes: >
      Built 2026-07-25 per docs/prompts/ROADMAP_PAGE_SESSION.md. Replaces the

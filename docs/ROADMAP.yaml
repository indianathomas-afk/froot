      treatment PERM-6 gave its own O/0 spelling.
      BOTH WORKED EXAMPLES ARE STILL DESCRIBED HERE; ONLY ONE IS STILL LIVE.
      (a) stands unedited above, as filed and as sharpened: a blockers entry
      that was not a promotion gate, that held four unexercised coverage gaps
      AND a status rationale at filing and then only the rationale, carried as
      LIVE throughout because the type had no other value to carry it as.
      (b) BUILD-1's sole entry, "CHANGED SHAPE — HALF CLOSED, HALF DEFERRED", is
      the one remaining LIVE instance.
      DOES THIS ROW STILL STAND ON ONE LIVE EXEMPLAR? YES — and PERM-6d's
      reading is that it stands slightly better than it did, not worse. This
      row's argument was never "two entries are stuck"; it was "the type has no

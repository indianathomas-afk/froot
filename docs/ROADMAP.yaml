  - id: PERM-5
    track: permissions
    size: L
    status: planned
    title: "Per-user capability overrides — the toggle layer"
    notes: >
      Grant or remove a capability for ONE user against their role baseline —
      e.g. one staff member gets inventory-count access, or the inventory nav,
      while others do not. PERM-1's can()/scope() layer plus PERM-2's
      discipline (every decision routed through a capability, nav visibility
      kept separate from API access) is the substrate this depends on: there is
      one place to hook the override. Must keep the shim's rule that a stored
      permission set RESTRICTS BELOW the Clerk role ceiling and never elevates
      above it.
      SCOPE SHARPENED 2026-07-27 — three things changed, none of them the core
      idea.
      (1) RESTRICT-ONLY IS NOW A RECORDED RULING, not just an implementation
      note. See DECISIONS.md 2026-07-27: role choice at provisioning is
      unrestricted, while overrides stay restrict-only. Those are DIFFERENT
      MECHANISMS and were argued as if they were the same during scoping — an
      ADMIN device account is not an "elevated STORE user", it is a user whose
      role is ADMIN. If a future session finds itself asking PERM-5 to grant
      something a role does not already have, the answer is a different role,
      not a wider override.
      (2) PERM-7 DEVICE ACCOUNTS ARE THE FIRST REAL CONSUMER. The motivating
      case is no longer hypothetical: an admin dials an individual store's
      device DOWN from the STORE baseline — this location's iPad does not get
      labor, that one does not get inventory counts. Restrict-only is exactly
      the right direction for that, so PERM-5 and PERM-7 fit together without
      either bending. Design the override UI knowing the population may be
      one row per store rather than a handful of exceptional humans.
      (3) MANAGEMENT SURFACE GREW. With a device account per location, twelve
      stores means twelve override targets. That raises the value of UM-2's
      capability-matrix page rendered FROM THE LIVE REGISTRY, and makes a
      per-user diff beside the role baseline close to required rather than
      nice-to-have.
      SEQUENCE: after PERM-7. The devices have to exist before dialling them
      down is a real task, and PERM-6 (which clears the blocker below) is
      already a PERM-7 prerequisite — so the ordering falls out naturally as
      PERM-6 → PERM-7 → PERM-5.
      Session prompt: docs/prompts/PERM-5_per_user_capability_overrides.md
    blockers:
      - >
        RESOLVED 2026-07-27 by PERM-6 Task 5 — kept in full below as the record
        of what was wrong, because the trap it describes is exactly the kind
        PERM-5 can re-arm. ForecastContext no longer has an `isAdmin` flag at
        all: it carries `canEdit` (can(forecasting.edit)) and `unscoped`
        (can(forecasting.scope.all), a new ADMIN_ONLY capability), and the
        THREE sites that made a scoping decision off the fused flag —
        requireForecastStore, forecasting/audit's store filter, and the
        /forecasting store picker — all ask `unscoped`. Granting a MANAGER
        forecasting.edit now grants goal editing and nothing else. Note the
        original blocker text below named only the first of those three sites;
        see the PERM-6 row for why the "one-file" scoping was wrong.
        PERM-5 is no longer blocked on this. ORIGINAL TEXT FOLLOWS:
        PERMISSION FUSION — split "may write" from "may read any store" BEFORE
        building the override layer. Verified in source 2026-07-27:
        `ForecastContext.isAdmin` is literally `can(actor,
        "forecasting.edit")` (src/lib/forecasting-access.ts:51), and
        `requireForecastStore` SKIPS the StoreUserAssignment check entirely
        whenever `isAdmin` is true (`if (!ctx.isAdmin) { ...assigned check... }`
        in the same file). One flag is doing two unrelated jobs: "may edit
        goals" and "is exempt from store scoping". These coincide correctly
        TODAY only because forecasting.edit is ADMIN_ONLY, so the only callers
        with isAdmin true are admins, who are legitimately unscoped.
        The moment PERM-5's override layer grants forecasting.edit to a single
        MANAGER — the exact per-user grant this phase exists to enable — that
        user ALSO silently gains unscoped cross-store forecast READS. Nobody
        reading the grant "give Maria goal-edit access" would predict it hands
        her every sibling store's forecast, and it would defeat the
        assignment-scoping fix PERM-3 shipped and the 7-27 pass verified via S4.
        This is not a bug today; it is a trap armed for the first override.
        Fix direction: give requireForecastStore its own capability (e.g. a

    notes: >
      SQ-1 (2026-07-26) gathered evidence against the blocker above, but did
      not clear it — Gary to confirm and close. `vercel env ls production`
      lists CRON_SECRET as Encrypted/Production, added 18 days ago (~2026-07-08,
      the F-1 ship date), so the secret does exist in the Production scope; what
      is still unconfirmed is that the crons actually invoke successfully (check
      the Vercel Cron Jobs page → View Logs). Separately, SQ-1 corrected the
      Pro-plan assumption in the docs: the account is on Hobby, and Hobby caps
      crons at ONCE PER DAY with ±59 min scheduling precision. Both registered
      crons comply — sales-reconcile `0 11 * * *` and pace-alerts `0 15 * * *`
      are daily — but they can fire anywhere inside their hour, and any future
      sub-daily expression will FAIL DEPLOYMENT, not fail quietly. maxDuration
      = 300 does not exceed the Hobby cap: with Fluid compute (on by default)
      Hobby's max duration is 300s, i.e. these routes sit exactly at the ceiling
      with no headroom. Vercel documents no plan-tier difference in
      CRON_SECRET handling, so F-1 is a secrets/verification problem rather
      than a plan-tier one.


  - id: DEBT-15
    title: "ClerkAPIResponseError is defined 5x in the built output — identity-based type guards MAY be unreliable across chunks (impact unverified)"
    notes: >
      DEMOTED FROM CAUSE TO UNVERIFIED HAZARD, 2026-07-28, same day it was
      filed. READ THIS PARAGRAPH BEFORE THE REST OF THE ROW.
      This row originally asserted that duplicate class definitions CAUSED
      PERM-7's staging collision failure. THAT WAS WRONG. The real cause was
      that staging was running a deployment predating every PERM-7 commit — the
      old blanket `catch` at users/route.ts returned `err.message`, and
      ClerkAPIResponseError.message is literally "Bad Request", which is exactly
      what the admin saw. No new code was involved at all.
      WORSE, THE DISCONFIRMING EVIDENCE WAS ALREADY IN HAND. The SDK
      reproduction run while diagnosing this returned
      `isClerkAPIResponseError(err) === TRUE` and produced the intended 409.
      That result was observed and then reasoned past, because the 5-definition
      count looked like a better story. A measurement that contradicts the
      theory outranks a suggestive artifact; this row is the reminder.
      WHAT SURVIVES, as observation only: the built server output really does
      define ClerkAPIResponseError five times — `grep -rl
      'kind="ClerkAPIResponseError"' .next/server/chunks` returns 5 files —
      because @clerk/shared is a transitive dependency of several @clerk/*
      packages and Turbopack inlines it per package chunk. @clerk/shared's
      isClerkAPIResponseError is createErrorTypeGuard(...), which ends in
      `target instanceof ErrorClass`. Whether that ever fails INSIDE the Next
      bundle is UNTESTED — it demonstrably does not fail outside it.
      IMPACT: UNKNOWN. Do not cite this row as the cause of anything until
      someone reproduces a false negative in a deployed runtime.
      The audit below stands on its own and is still useful.
      Audited across the whole of src/ at Gary's instruction ("if class identity
      is unreliable across chunks, one call site isn't the whole finding").
      THE MECHANISM: the built server output defines ClerkAPIResponseError FIVE
      separate times — `grep -rl 'kind="ClerkAPIResponseError"' .next/server/chunks`
      returns 5 files — because @clerk/shared is a transitive dependency of
      several @clerk/* packages and Turbopack inlines it into each package chunk
      rather than sharing one copy. @clerk/shared's isClerkAPIResponseError is
      createErrorTypeGuard(...), which ends in `target instanceof ErrorClass`.
      An error thrown from one chunk's copy fails the check in another's.
      AUDIT RESULT — the finding is genuinely ONE call site, established rather
      than assumed. Every `instanceof` in src/ falls into three buckets:
      (1) INTRINSICS — `instanceof Error` (18 sites) and `instanceof Date`
      (forecast-import.ts:30,50). Error and Date are per-realm globals, never
      bundled, never duplicated. SAFE.
      (2) FIRST-PARTY CLASSES — SignedRecordError (hr-signed-pdf.ts:128) and
      HrFileValidationError (hr-files.ts:31). Referenced in the build through a
      shared module namespace object (`e instanceof x.SignedRecordError`), i.e.
      ONE definition imported by many chunks, not redefined per chunk. SAFE as
      built. Prisma.PrismaClientKnownRequestError (pace-alerts.ts:118) is the
      same shape and appears in exactly ONE chunk. SAFE as built.
      (3) THIRD-PARTY CLASS FROM A SHARED TRANSITIVE DEP — only
      isClerkAPIResponseError, at src/app/api/users/route.ts:127. The only site
      with duplicated definitions, and therefore the only one where the hazard
      is even possible. NOT known to be broken — see the demotion above.
      THE SHARP RULE, worth more than the single fix: the risky shape is
      `instanceof` against a class owned by a package that is a TRANSITIVE
      dependency of MORE THAN ONE direct dependency. That is what gets inlined
      more than once. First-party classes and intrinsics are fine, and
      "instanceof is unreliable" as a blanket claim would be wrong.
      CAVEAT ON BUCKET 2: safe-as-built is a bundler outcome, not a guarantee.
      A dependency change could split Prisma's client across chunks and the
      pace-alerts P2002 guard would begin failing — degrading a benign "already
      alerted this month" return into a rethrow logged as "pace alert failed".
      Worth re-running the counts above after any major dep bump.
      FIX (approved in principle by Gary 2026-07-28, before the demotion, and
      NOT yet applied): duck-type on the payload instead of the class — Clerk
      errors carry `clerkError: true` and an `errors` array, both DATA rather
      than identity, so they survive any number of duplicated class definitions.
      Still worth doing as cheap hardening. It is NOT a fix for the staging
      failure, because that failure had a different cause; do not let the two be
      conflated again when this is picked up.


  - id: PERM-3
    track: permissions
    size: M
    status: shipped
    shipped: 2026-07-27
    commits: [b8f32bb, 06b1561]
    title: "MANAGER forecast read window (current + next month), forecasting store scoping, affordance visibility"
    notes: >
      Audit-first session (docs/prompts/PERM-3_forecasting_read_window.md).
      NOTE: this entry previously said MANAGER *and STORE* get a current+next
      month window on forecast AND sales data. Task 1 established that was
      wrong on both counts, and Gary's ruling (option c, 2026-07-26) replaced
      it: STORE and STAFF get NO forecasting access at all (the APIs already
      403'd them), and MANAGER's window applies ONLY to forward forecast goals —
      historical actual sales stay fully visible, because a manager needs last
      July's actuals to budget this July. ADMIN unrestricted. Writes unchanged
      and still ADMIN-only (§3 #7 deliberately not harmonized).
      Task 1 found the phase was a pure RESTRICTION with no grants: managers
      could read an unbounded number of forward years, and the two dashboard
      "Forecasting →" links (Monthly Goal card, rollup Store Ranking header)
      rendered for every role with no capability check at all, dead-ending in a
      redirect for STORE/STAFF — the PERM-2 bug class, UI-only.
      Enforced server-side by per-FIELD masking, never by a 4xx: rejecting or
      clamping the requested range would also withhold the historical actuals
      the ruling grants. /calendar and /export null `goal` outside the window
      (and `variance` with it, since actual − goal hands the goal back);
      /audit filters entries to window months. plan GET's annual aggregates stay
      visible to MANAGER by ruling. No new capability — forecasting.view gained
      a scope() window via the new SCOPE_OVERRIDES table, which is also where
      PERM-5's per-user overrides will hook in.
      Window is computed per request from Store.timezone in the new pure
      src/lib/forecast-window.ts, shared by the API guards AND the client year
      selector so they cannot drift; inclusive 1st-of-current-month through
      last-day-of-next, crossing the year in December. The year selector's
      forward edge derives from the window, so a manager in December can still
      select next January's year.
      Also fixed in scope (Gary): every forecasting read was org-scoped but not
      assignment-scoped, so a MANAGER could read any sibling store's forecast by
      passing its storeId — now mirrors requireLaborStore. Migrated
      forecasting-access.ts and forecasting/page.tsx off their inline role
      checks onto can(). See DECISIONS.md for Q1–Q4 and the accepted
      basis-reconstruction property.
      STAGING VERIFICATION PASS COMPLETE 2026-07-27 (Gary), Tommy Thomas driven
      as STORE and then MANAGER, full results in
      docs/prompts/verification-smoke-pass.md. Negative checks: S3 forecasting
      calendar as STORE → 403; S4 cross-store calendar as MANAGER → 403 (the
      assignment-scoping fix Gary added in scope — a MANAGER can no longer read
      a sibling store's forecast by passing its storeId); S5 `PATCH
      /api/forecasting/day` as MANAGER → 403 "Admin access required", confirming
      writes stayed ADMIN-only.
      MASKING CONFIRMED WORKING AS RULED, and this is the load-bearing result:
      the calendar returned `days: Array(365)` with the window computed as
      2026-07-01 → 2026-08-31, and June 15 came back with `goal` null while its
      `actual` of 2582.93 was PRESENT. That is per-FIELD masking, not range
      clamping — exactly the Q1 ruling, and the observable difference between
      the two implementations. `/api/stores` as MANAGER returned 1 of 12 stores.

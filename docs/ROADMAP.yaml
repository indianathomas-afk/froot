      order by [{ isPrimary: "desc" }, { store: { name: "asc" } }] (see the
      correction on BUILD-2 for the file:line list), so with zero primaries the
      fallback resolves to the ALPHABETICALLY-FIRST store, deterministically,
      every request. Gary Thomas and Kelton Thomas would both stamp "Carson".
      WHAT SURVIVES, AND IT IS STILL WORTH FIXING: stable-and-arbitrary is not
      correct. "Carson" is an alphabetical accident, not a decision, and the
      first document either owner signs freezes it into a legal record. The
      urgency is unchanged; only the flapping is withdrawn.
      ALSO REFUTED — GARY'S OWN INSTRUCTION. The reason given for setting
      primaries BEFORE BUILD-2's index ("so the constraint locks in real intent
      rather than whatever row order won") does not hold. A partial unique index
      on WHERE "isPrimary" indexes only rows where the flag is TRUE, so a staff
      member with ZERO primaries contributes zero index entries and cannot
      collide. There is no ordering dependency in either direction: the
      chip-clicks may precede or follow the migration. Accepted by Gary
      2026-07-29.
      BRANCH staging IS DIFFERENT DATA, checked 2026-07-29: four ACTIVE staff
      with no primary — Aaliyah Rose (1: Carson), Chase Nyman (2: Carson, Las
      Brisas), Gary Thomas (1: South Reno), Kelton Thomas (3: Carson, Las
      Brisas, Spanish Springs). The single-assignment rows resolve correctly
      today via the fallback (one candidate, no ambiguity) so they are tidiness;
      Chase and Kelton are the real ones. TRIGGER, not "optional": a
      single-store row becomes ambiguous the instant a second store is added,
      silently, and the index does NOT catch it because zero primaries stay
      legal. Chip-clicks are Gary's, both environments, own schedule.
      ── ORIGINAL NOTES BELOW, UNEDITED ──
      Found 2026-07-27 by the BUILD-2 production pre-check (Query B), run in the
      Neon console against branch `production`. Gary Thomas and Kelton Thomas,
      both ACTIVE, each with 9 StoreStaffAssignment rows and ZERO isPrimary.
      NOT a migration blocker — a partial unique index permits zero primaries,
      and BUILD-2's Query A returned clean. A data-quality problem sitting next
      to that one, not the gate.
      WHY IT MATTERS: primaryStoreName() (src/lib/hr.ts:44-49) is
      `.find(a => a.isPrimary) ?? staff.storeAssignments[0]`. With no primary,
      `.find` returns undefined and the fallback takes THE FIRST ROW OF AN

      runtime because the YAML sits outside the import graph and there is no
      .git directory inside a lambda. Timestamp fallback chain, never silent:
      git commit date → meta.updated → unknown, logged to the build output AND
      labelled on the page. The page is a server component (requireAdmin,
      redirect to /dashboard, noindex) passing plain data to a client board:
      summary strip, blockers panel, staging→prod pipeline, three columns,
      search, track chips. Blockers render as the plain YAML strings — no
      severity inferred. Read-only: no writes to ROADMAP.yaml, no DB access.
      Also adds the app's first src/app/robots.ts (allow all, disallow
      /internal/).
      PROD VERIFIED 2026-07-27 (promotion 06b1561): the page renders at
      www.usefroot.com/internal/roadmap with the timestamp "Jul 27, 2026 · from
      the git commit date of docs/ROADMAP.yaml". That specific label is the
      result that mattered — it proves the FIRST link of the fallback chain
      resolved, i.e. Vercel's shallow clone still exposed a usable git commit
      date and the `unknown` fallback did NOT fire. Had it fired, the page would
      have rendered anyway (by design, never silently) and the staleness the
      phase exists to eliminate would have come straight back.

  - id: P-4
    title: >
      The /internal/roadmap blockers panel counts resolved blockers as live —
      blocker entries carry no state for the renderer to read
    track: platform
    size: S
    status: in_progress
    commits: [3a2f7ac]
    notes: >
      STATUS IS `in_progress`, NOT `staging`, and the distinction is deliberate.
      The work is complete and committed on the local `staging` branch, but
      Claude never pushes (CLAUDE.md § Git Rules), so nothing is on a Vercel
      preview and `staging` — which asserts exactly that — would be false. Move
      it to `staging` on push. This is the same GAP the header NOTE records for
      audit-only phases: the vocabulary has no value for "done locally, not yet
      deployed".
      The /internal/roadmap blockers panel counted RESOLVED blocker entries as
      live. Observed 2026-08-01: the panel read "19 across 8 phases" when 8 of
      those 19 were closed, including every entry on PERM-6 and PERM-7 — both
      `shipped`, in production since 746c1be, and still presented as blocked.
      DEBT-14'S DEFECT ONE LEVEL DOWN. That row fixed exactly this for the debt
      list: rows carried a status the UI ignored. Phases, bugs and debt rows all
      gained status handling; blocker ENTRIES never did. They were bare strings
      with no field to carry state, so the renderer had no way to tell a live
      gate from a closed one.
      WHY IT MATTERED beyond cosmetics: this panel is what gets read to answer
      "what is stopping promotion", and the failure direction was OVERSTATING —
      real blockers hiding among resolved ones, in the one moment the answer is
      load-bearing. The preserve-and-mark convention was never the problem; the
      renderer's blindness to it was.
      THE FIX — Option D of five considered, STRUCTURED-MINIMAL. BlockerEntry is
      now `string | {resolved: true, text}`. A BARE STRING MEANS LIVE, which is
      DEBT-14's "a missing status means OPEN" one level down and the safe
      direction. Only the 8 CLOSED entries were migrated; the 9 live ones were
      never touched, so the prose that still matters is untouched prose. Four
      render sites now read the flag rather than the array length: the summary
      tile, the panel headline, PipelinePanel and the PhaseCard badge.
      PREFIX DETECTION WAS REJECTED ON EVIDENCE, NOT ON TASTE — this is the
      durable part of the row. Reading the existing CLOSED / RESOLVED / GATE
      CLEARED / WITHDRAWN markers was the cheap option and it fails in BOTH
      directions on this very file. F-5's LIVE blocker opens "VERIFIED STILL
      TRUE" and F-4's opens "CONFIRMED LIVE" — live entries whose first words
      are resolution words, which a matcher would close, failing toward
      UNDERSTATING, which is worse than the bug being fixed. And PERM-6's two
      closed entries carry NO marker at all: they are closed by a separate entry
      prepended ABOVE them in the same array. The convention operates at the
      ARRAY level as well as inside a string, and prose cannot carry a count.
      THE AUDIT CORRECTED THE PROMPT that opened the session, in three places
      worth keeping: "nearly all" the entries were resolved (no — 8 of 19, with
      9 genuinely live); every entry "opens with" a resolution marker (true of 6
      of the 8); and PERM-6 having "every gate closed" (true of its promotion
      gates, but its second entry is a LIVE coverage note recording four things
      still unexercised, in the wrong field). That entry stays a bare string.
      RESOLVED ENTRIES ARE STILL ON THE PAGE, in array order, toned down and
      MARKED "resolved" — marked rather than merely toned, because PERM-6's last
      two say "STAYS OPEN" in their own text. A phase whose blockers are all
      closed moves into a collapsed "Resolved gates" disclosure, mirroring the
      "Resolved debt" panel DEBT-14 built. Nothing was deleted or reworded.
      THE MIGRATION WAS PROVEN NON-DESTRUCTIVE, which was the one real risk.
      These are folded YAML scalars; nesting them under `text:` reindents every
      line by +2, and a botched reindent changes folded prose SILENTLY. A
      whole-tree identity check parsed the file before and after and compared
      every string with blockers flattened to their text: PASS, byte-identical.
      Also fixed: PipelinePanel, which renders nothing today (zero staging
      phases) and so was a dormant defect rather than an absent one — it re-arms
      the moment anything sits in staging, which is precisely when that panel is
      read. And both summary numbers now name their unit: the tile counts
      PHASES, the panel headline counts ENTRIES, and two bare numbers that
      looked like the same quantity is where the original confusion started.
      Two comments were corrected rather than left to outlive the change that
      falsified them, DEBT-26's exact shape: roadmap.ts's "Free-text strings,
      not structured records" (commit 1) and this file's own header NOTE, which
      asserted "Anything here blocks" (commit 2).
      FILED NOT FIXED: DEBT-41 (no vocabulary for a PARTIALLY closed entry —
      PERM-6[1] and BUILD-1[0] are both evidence) and DEBT-42 (`deferred` and
      `open` carry the same defect, deliberately unfixed by Gary's ruling since
      no count on the page reads them).
      Session prompt: docs/prompts/P-4_blockers_panel_status.md

  - id: UX-1
    track: platform
    size: S
    status: planned
    title: "Role-change ergonomics — Edit User dirty-state guard + role indicator in the sidebar"
    notes: >
      Created 2026-07-27 from friction hit during the PERM-2/PERM-3 verification
      pass. Both items are about the same failure: the person changing a role
      cannot tell what state they are in.
      (a) Edit User modal — "Save Changes" sits BELOW THE FOLD with no
      dirty-state warning, so a role change is silently discarded when the modal
      is closed. The user's mental model says the role changed; the system says
      nothing. This cost ~40 minutes of misdiagnosis on 2026-07-27 — time spent
      debugging permission enforcement that was working correctly, against a
      role that had never actually been saved. Fix: a sticky footer so the
      action is always visible, or a dirty-close guard, or both.
      (b) Role indicator in the sidebar footer, beside the email address already
      rendered there, so the active permission tier is visible at a glance. The
      whole class of confusion in (a) is only diagnosable if you can see which
      tier you are currently acting as. Related to UM-2, which adds a role
      column to the members table and a capability-matrix page — this is the
      same information at a third location, the one you are looking at while
      testing.
      (c) Cosmetic, logged here 2026-07-27: guarded routes answer Next.js RSC
      prefetches (`?_rsc=`) with 404 rather than a clean redirect — 13 observed
      in the Network tab immediately after a role change. NO DATA IS RETURNED,
      so this is not a permission hole; it is noise that makes the Network tab
      harder to read during exactly the permission testing described above,
      which is why it belongs with (a) and (b).

  - id: UX-2
    track: platform
    size: M
    status: planned
    title: "One current-store context across all 14 store pickers + a persistent location indicator"
    notes: >
      Scoped 2026-07-27 from a read-only audit, triggered by Gary's report that
      "I thought I was in one location, however, had to switch. If I logged back
      in, there was a random feel that I always had to double check which
      location I was looking at."
      ROOT CAUSE — TWO INDEPENDENT BUGS, neither of them nondeterministic
      ordering (that theory was tested and refuted; see BUILD-2).
      (1) NO SHARED SOURCE OF TRUTH. There are ~14 store selectors using THREE
      different mechanisms with no coordination: localStorage key
      "froot.dashboard.store" (dashboard + messages, which share it);
      a SEPARATE localStorage key "froot.forecasting.store" (forecasting);
      a URL param `?store=` (checklists); and plain
      `useState(stores[0]?.id ?? "")` in roughly ten more — every inventory
      surface (ingredients, adjustments, counts, expected, storage-areas,
      reports, orders/new), both labor surfaces, and store-view. Concretely: a
      manager who selects Uptown on the Dashboard and clicks into Inventory →
      Ingredients silently lands back on the alphabetically-first store, with no
      indication anything changed, because Inventory never reads the dashboard's
      key. That is the reported bug, exactly.
      (2) localStorage OUTLIVES LOGOUT. It is scoped to the browser ORIGIN, not
      the Clerk session, so dashboard and forecasting show the previous
      selection after re-login while the other ~10 surfaces reset to
      alphabetical. Two surfaces remember, ten forget — that mismatch is the
      "random feel". NOT a data leak: both persisting surfaces validate the
      saved id against the caller's current store list and fall back
      (`stores.find(s => s.id === savedStoreId)?.id ?? stores[0]?.id`). But it
      is worst on a SHARED DEVICE, which is precisely what PERM-7 provisions —
      and worst of all on an ADMIN device account, where every store is in scope
      so a stale selection persists in full.
      THREE SEPARABLE PIECES, deliberately ordered so partial delivery still
      helps:
      (a) SHOW IT — a persistent current-location indicator in the app shell,
      beside the email where UX-1(b) already scopes a role indicator. No schema,
      no refactor, and it directly answers "I always had to double check". Ship
      first regardless of the rest.
      (b) UNIFY IT — one shared context plus ONE storage key replacing all 14
      independent selectors, so a switch propagates everywhere. Mechanical
      rather than hard: ~14 files, each a small swap. KEY IT BY USER ID (or
      clear on sign-out) to close bug (2).
      (c) DEFAULT IT — seed the selection from User.defaultStoreId (BUILD-2)
      instead of "alphabetically first". BUILD-2 is the only piece needing a
      migration; (a) and (b) do not.
      (a) without (b) is honest but still annoying; (b) without (a) is
      invisible. (a)+(c) is a reasonable first release.
      Existing sessionStorage keys "froot.dashboard.salesSelection" and
      "froot.labor.viewedDate" are date/range state, NOT store selectors —
      leave them alone.
      Session prompt: docs/prompts/UX-2_current_store_context.md
      SURFACE MEASURED 2026-07-29 by the BUILD-2 audit — it is NOT 14 uniform
      pickers. 18 UI picker sites hosting 20 selector widgets
      (/inventory/adjustments alone has three: adjustments-client.tsx:399, :576,
      :711), plus 2 non-UI default-store pickers. FOUR BEHAVIOURAL FAMILIES, not
      one:
      (a) plain `useState(stores[0]?.id ?? "")` — 8 sites:
      labor/weekly-plan-client:91, settings/labor/labor-settings-client:72,
      inventory counts:57, expected:51, reports:187, storage-areas:65,
      ingredients:140, orders/new/cart-client:65.
      (b) localStorage-then-stores[0] — 3: dashboard-client:166-169,
      messages-client:174, forecasting-client:135. Dashboard and Messages SHARE
      key "froot.dashboard.store"; Forecasting uses "froot.forecasting.store",
      so switching store on the dashboard silently does not move forecasting.
      (c) sentinel "" or "all" — NEVER reaches stores[0] — 7 sites/9 selectors:
      adjustments x3, recipes-client:376 (whose `initialStoreId` prop is DEAD —
      page.tsx:97 never passes it), alerts-client:44 ("all"),
      purchase-orders-client:63 ("all"), purchase-orders/new/new-po-client:38
      (unconditional "", not even the single-store shortcut),
      store-view/page.tsx:25.
      (d) URL searchParams — 1: checklists/page.tsx:36-45, falls through to ALL
      the user's stores.
      ORDERING IS NOT THE PROBLEM — zero pickers lack an orderBy; all 18 use
      `orderBy: { name: "asc" }`. ONE exception, and it is not a picker:
      src/lib/forecasting-access.ts:103 orders
      [{ storeNumber: "asc" }, { name: "asc" }] and is self-documented at :89-96
      as a BUILD-2 placeholder — so it picks a DIFFERENT store than every UI
      picker. It is the first thing UX-2 should convert to
      resolveDefaultStore().
      BUILD-2 LANDED THE COLUMN, NOT ITS CONSUMPTION. Use
      src/lib/default-store.ts: resolveDefaultStore() (default if visible, else
      alphabetically-first, else null), isDefaultStoreStale() (to decide whether
      to show a "showing X instead" hint — the resolver alone cannot tell "fell
      back" from "was already first").
      SELF-SERVICE IS ALREADY RULED, DO NOT RE-LITIGATE IT. Gary 2026-07-29: a
      user MAY set their own default (DECISIONS.md, "A user may set their own
      default store"). Build it here, alongside the UI that exercises it. Shape
      decided: PATCH /api/users/me, accepting defaultStoreId ONLY, no id param,
      validated with validateDefaultStore against the CALLER'S CURRENT
      assignments. NOT PATCH /api/users/[id] — that route is requireAdmin and
      deliberately blocks self-edits (users/[id]/route.ts:51-53), the lockout
      guard; weakening it to pass a preference field through is the wrong trade.


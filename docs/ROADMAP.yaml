      ONE CORRECTION TO THIS ROW, AND IT IS A CORRECTION TO A CLAIM, NOT A
      SCOPE CHANGE. The row states that a Non-Compliant checklist "is counted in
      NO bucket on /reports" and that "Non-Compliant matches none of the three".
      THAT HALF IS NOT TRUE AND NEVER WAS: `const nonCompliant = ...` and its
      own KPI tile have been in reports/page.tsx since the original platform
      build "1cfdf76" — established by `git log -L` on that line at "dc90ff6",
      not by re-reading. What was live was the DENOMINATOR half: the `sub` line
      rendered `of ${completed + inProgress + pending} total checklists`, which
      dropped Non-Compliant from the total while the tile beside it displayed
      the count. So the page under-reported its total and overstated completion
      rate against it — the row's headline consequence — for a reason one clause
      narrower than the row gives.
      WHY THE MISREADING IS WORTH RECORDING RATHER THAN QUIETLY DROPPING: the
      row was DERIVED FROM READING, and it says so honestly ("from reading, not
      from a query"). The reading stopped at the three `filter` lines it cited
      (:31-33) and inferred the absence of a fourth from their symmetry. The
      fourth was on the next line. This is the DEBT-37 class the row itself
      names, one level up — an inference presented in the register of a
      measurement — and it cost nothing here only because the fix shape it
      proposed was right for the real defect anyway.
      THE SECOND, SMALLER FINDING BELOW STANDS AND IS ALREADY CLOSED ELSEWHERE:
      checklists/page.tsx:117's `?? STATUS_STYLES.Pending` fallthrough became
      reachable when Missed shipped, and CHK-4 mapped Missed in "c05365a" while
      deliberately keeping the fallback as the net for the next status.
      R1 RECONCILIATION, STATED ON THE PAGE'S FACE IN THE TILE SUBTITLES:
      Non-Compliant is a LIVE-DAY verdict written by submit; day close rewrites
      it to Missed along with everything else unfinished, because once the day
      is shut a partial submission is a miss like any other. So Non-Compliant
      trends toward today's rows and Missed accumulates behind it. The one
      exception is a non-Daily row, which day close leaves open by design, so
      its Non-Compliant verdict persists — DEBT-61.
      ── THE 2026-08-09 FILING IS NEXT, UNEDITED ──
      COST OF DOING NOTHING: A checklist submitted with critical tasks
      incomplete is counted in NO bucket on /reports and is silently absent from
      the "of N total checklists" denominator, so the page under-reports its own
      total and overstates completion rate against it — LIVE, not latent,
      whenever any Non-Compliant row exists (trigger already met in principle:
      the status has a writer and a render site; whether any row currently
      carries it was NOT measured — this session queried no database).
      DERIVED AT HEAD "746918c" by the CHK-1 planning session, from reading, not
      from a query.
      FILED 2026-08-09. INDEPENDENT OF THE CHK PHASE — found while mapping the
      checklist surfaces, and filed separately BECAUSE it is not CHK's to fix:
      it is wrong today, at HEAD, with no new feature involved.
      THE FACT: api/checklists/[id]/submit/route.ts:34-38 writes one of three
      statuses — Completed, Non-Compliant, In Progress. reports/page.tsx:31-33
      counts Completed, In Progress and Pending, and :95 renders the total as
      `completed + inProgress + pending`. Non-Compliant matches none of the
      three. /checklists DOES render it (checklists/page.tsx:14), so the two
      pages disagree about what exists.
      WHAT CHK MUST NOT DO, and this is why the row is filed rather than left as
      a note: CHK-4 adds `Missed` to those same counts. Adding one status to a
      sum that already drops another WIDENS the defect while looking like

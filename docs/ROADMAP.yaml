      COST OF DOING NOTHING: Nothing reads the two offsets today, so nothing
      misbehaves now — LATENT, but with an unusual shape worth naming: the
      trigger does not merely EXPOSE the defect, it CONVERTS it into data. The
      day any availability gate reads these fields, an unchosen 1/2 becomes a
      REAL window on every existing template row at once, retroactively and
      silently, and a chosen 1/2 is then indistinguishable from an inherited
      one. DERIVED AT HEAD 90d8293 by this session.
      FILED 2026-08-07 ON GARY'S EXPLICIT RULING, spun out of DEBT-48 when that
      row was parked as a feature phase. SIZE: S. Size is recorded in prose
      because `debt:` rows accept id/title/status/commits/notes ONLY — `size:`
      is a `phases:` field and adding it to a debt row type-errors the build,
      the same way `open:` does (see the header NOTE at the top of this file).
      THE WORK: make Template.startOffsetHours and Template.endOffsetHours
      OPTIONAL and BLANK by default, so a template that never chose a window
      does not carry one.
      THE STATE AT HEAD 90d8293, so nobody re-derives it:
      src/app/(app)/templates/template-form.tsx:637-638 defaults them to 1 and 2
      (`initialData?.startOffsetHours ?? 1`, `?? 2`) and they are written on
      every save. Nothing reads them back — no availability gate exists
      anywhere, verified by DEBT-48 at head. The comment immediately above them

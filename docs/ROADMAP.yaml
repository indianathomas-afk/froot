  # ---- Security ----

  - id: SEC-1
    track: security
    size: S
    status: shipped
    shipped: 2026-07-26
    commits: [ecee728]
    title: "Square OAuth callback org binding + state nonce; ADMIN gate on connect/disconnect"
    notes: >
      Closes PERMISSIONS_INVENTORY.md §2 items 2 and 3 (found by PERM-1).
      Part A: callback resolves the token-write org from the SESSION — state
      is never a write address (beyond-spec improvement, kept by Gary; see
      DECISIONS.md). Part B: state is a 32-byte crypto-random single-use
      nonce via double-submit httpOnly cookie (Option 1, Gary's fork ruling —
      no schema; Square's one-time auth codes already cover the replay gap a
      table would close). Part C (the one deliberate behavior change):
      /api/square/auth and /api/square/disconnect now ADMIN, matching
      Instagram; only in-app callers are on /settings (already ADMIN).
      Existing connected orgs unaffected — no token columns touched, no
      reconnect needed. Instagram's own missing nonce logged as SEC-2.
      Staging pass clean 2026-07-25 (Gary; details not itemized in the
      pass report). Built 7-25; prod via c463af3 (2026-07-26). No prod smoke
      test recorded, hence shipped, not verified.

  - id: SEC-2
    track: security
    size: S
    status: planned
    title: "Instagram OAuth state nonce — same double-submit hardening as SEC-1"
    notes: >
      Logged 2026-07-25 during SEC-1: Instagram's callback org-equality check
      blocks cross-org token planting but is not CSRF protection — state is
      still the predictable orgId, no nonce. Deliberately untouched in SEC-1
      (Instagram was the reference implementation); now the weaker of the two.
      Also in this phase's scope (Gary, 2026-07-25): SEC-1's session-org
      resolution means a multi-org admin who switches orgs mid-flow gets
      Square tokens silently written to whichever org their session is on at
      callback time — Instagram's equality check would error instead. Not a
      problem at one org; fix alongside the nonce work (e.g. bind the
      initiating org into the state cookie payload and reject on mismatch).
      GATED ON BUILD-1 (2026-07-26): if the nonce work adds any schema field,
      it must not start before BUILD-1 is verified — until then a local
      `npm run build` runs migrate deploy against the PRODUCTION branch
      (DEBT-4).

  - id: SEC-3
    track: security
    size: M
    status: planned
    title: "Forecasting budget-file uploads are world-readable in Vercel Blob"
    notes: >
      Found by PERM-3's Task 1 audit (2026-07-26), recorded not fixed on Gary's
      instruction — it is a live data exposure, not a permissions tier, so it
      needs its own session.
      SEVERITY: a tenant's uploaded budget file is retrievable by URL with NO
      authentication whatsoever. POST /api/forecasting/import writes it to
      Vercel Blob with access: "public" at
      forecasting/${orgId}/${storeId}/${year}-${Date.now()}.${ext}, persists
      that URL on GoalPlan.importFileUrl and in the audit log, and
      /api/forecasting/plan GET hands it to any MANAGER. The only thing standing
      between the file and the public internet is the guessability of a
      millisecond timestamp — and anyone who has ever legitimately seen the URL
      keeps access forever, including after losing their role.
      Fix direction: move to a PRIVATE Blob store with signed, short-lived reads,
      the pattern HR documents already use (HR_BLOB_READ_WRITE_TOKEN +
      src/lib/hr-files.ts passing the token explicitly on every call). Existing
      blobs must be migrated or re-uploaded; the persisted importFileUrl values
      become stale and need a backfill or an on-demand signing indirection.
      Not a schema change in itself, but the backfill may want one — if so it is
      GATED ON BUILD-1 like SEC-2 (a local build runs migrate deploy against the
      PRODUCTION branch until then, DEBT-4).


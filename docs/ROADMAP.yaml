      next opened" turned out to mean "cheap until the next SHA".
      THE FILED TRIGGER WAS TOO NARROW — corrected, not left standing. The row
      below says the mechanism needs an ALL-DIGIT SHA (2081401, 9743899).
      84437e5 contains an 'e'. YAML read it as SCIENTIFIC NOTATION:
      84437 x 10^5 = 8443700000. So the hazard class is wider than filed — any
      SHA shaped <digits>e<digits> also hits it, and that shape is far likelier
      than all-digits: it needs a single `e` in the right place rather than
      seven consecutive digits. The row's own prediction, "the first all-digit
      debt SHA is the one that surfaces it", was therefore wrong about the
      mechanism while being right that a debt SHA would surface it.
      The comment above withStringCommits (generate-roadmap.mjs:80-95) now
      documents BOTH shapes so the next reader does not re-derive the narrow
      version.
      VERIFIED, not assumed: with the coercion in place the build is green even
      with 84437e5 UNQUOTED in the YAML. The SHAs are left quoted as defence in
      depth, but the generator no longer depends on an editor remembering.
      ── ORIGINAL NOTES BELOW, UNEDITED (and narrower than the real hazard) ──
      Found 2026-07-28 while adding status/commits to DEBT-10, one line away
      from the change. LATENT, NOT LIVE — no row triggers it today.
      THE MECHANISM is the one the script already documents for phases
      (generate-roadmap.mjs:82-85): an all-digit short SHA such as 2081401 or
      9743899 is valid YAML for a NUMBER, so `commits` parses as a mixed
      string/number array. withStringCommits() coerces it — but it is applied to
      phases and bugs only, and debt is normalized without it:
        const phases = withStringCommits(normalize(raw.phases))
        const bugs   = withStringCommits(normalize(raw.bugs ?? []))
        const debt   = normalize(raw.debt ?? [])
      (generate-roadmap.mjs:93-95). A debt row carrying an all-digit SHA would
      therefore reach the page as a number while DebtItem.commits is typed
      string[] — the same silent shape drift the phase comment was written to
      prevent. Both SHAs on debt rows today contain letters (6530d8b, 2877b41),
      which is the only reason nothing is broken. DEBT-14's render now prints
      commits, so the first all-digit debt SHA is the one that surfaces it.
      FIX: one word — wrap the debt line in withStringCommits, as the two lines
      above it already are.

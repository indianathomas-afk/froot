  - id: DEBT-63
    status: shipped
    commits: ["5190fd9"]
    title: >
      CLOSED — /reports omits Non-Compliant from its own totals — three status
      buckets summed as if they were all of them
    notes: >
      ── CLOSED 2026-08-10 IN "5190fd9" (CHK-5/S5). PREPENDED; NOTHING BELOW IS
      EDITED. ──
      FIXED THE WAY THIS ROW ITSELF PREFERRED: the total is now the ROW COUNT

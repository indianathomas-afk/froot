      administrative act — so it is materially more likely to fire than the
      rename ever was). DERIVED AT HEAD "746918c" by the CHK-1 planning session.
      FILED 2026-08-09 ON GARY'S RULING, out of CHK-1's scope decision. Found
      while auditing DEBT-36's compliance argument; recorded here rather than

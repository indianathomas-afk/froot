  - id: DEBT-66
    title: >
      `main` is red at "7ab7106" — dashboard redeploys fail in `vercel-build`
      with NO database env attached, and the next production promotion is
      blocked until that is understood
    notes: >
      COST OF DOING NOTHING: Nothing is down. Production SERVES normally from an
      earlier Ready deployment, so no merchant or operator is affected today —
      LATENT (trigger: THE NEXT PROMOTION TO PRODUCTION. CHK-3 carries this as
      half of its promotion blocker, and every CHK row behind it inherits the
      same gate. The trigger is not hypothetical — it is the next thing this
      track does).
      THE FACTS, MEASURED 2026-08-09 rather than relayed. Three dashboard-
      initiated redeploys of branch `main` at commit "7ab7106" failed the same
      way (13:34:50, 13:44:51, 15:13:14 PDT — timeline in
      docs/prompts/CRON-DIAG_findings.md §5), all `errorCode
      BUILD_UTILS_SPAWN_1`, `Command "npm run vercel-build" exited with 1`, all
      in `buildStep`. The build log of the third
      (froot-4608w2c0v-indianathomas-2483s-projects.vercel.app, 22:13:15Z) reads,
      consecutively — `[prisma.config] DATABASE_URL_UNPOOLED is not set —
      falling back to DATABASE_URL (pooled)`, then `Error: The datasource.url
      property is required in your Prisma config file when using prisma migrate
      deploy.`, then exit 1.
      WHAT THAT PAIR OF LINES PROVES, AND IT IS MORE THAN EITHER ALONE.
      prisma.config.ts:24 sets `url: DATABASE_URL_UNPOOLED ?? DATABASE_URL`, so
      `datasource.url` can only be undefined when BOTH are absent. The warn
      names the first; the error proves the second. THE BUILD HAD NO DATABASE
      ENVIRONMENT AT ALL — this is not a wrong URL, not a pooler problem, and
      not a migration that failed: `prisma migrate deploy` never opened a
      connection, so nothing ran against any database and the failure is before
      the first statement. In particular it is NOT the intermittent Neon
      advisory-lock P1002 (BUG-3) that a `vercel-build` failure would otherwise
      suggest, and the CRON-DIAG note recommending that be ruled out first is
      answered here.
      AND THE VARS THEMSELVES ARE FINE. Production runtime reads `DATABASE_URL`
      through the Neon adapter and production is serving, so the Production row
      exists and holds a working value. What differs is ATTACHMENT to this
      deployment, not the variable — which is the BUILD-1 scoping class: a
      dashboard redeploy of `main` appears not to receive env the way a
      git-push deploy does, and the original git-pushed production deploy of
      this same commit built clean.
      FIRST MOVES WHEN PICKED UP, cheapest first: compare the env set of a
      failing dashboard redeploy against the last successful git-push production
      deployment; check what the redeploy was created FROM and whether the
      "existing build cache" path carries an empty env snapshot; confirm with
      `vercel env ls` (METADATA ONLY — `vercel env pull` is banned in this repo,
      CLAUDE.md § Environment Variables) that `DATABASE_URL` is present in the
      Production scope and not branch-scoped to something `main` does not match.
      Then re-promote by GIT PUSH, which is the path known to work, rather than
      by dashboard redeploy.
      Disconfirmed by: a dashboard redeploy of `main` reaching `X migrations
      found` in its build log, or any `main` build whose `Datasource "db"` host
      line appears at all. Related: BUILD-1 (the split that put `migrate deploy`
      inside the Vercel build), BUG-3 (prisma.config.ts, and the failure class
      this one is NOT), DEBT-4 (env scoping), CHK-3 (the promotion it blocks).
      ── RULING 2026-08-10, PRESERVE-AND-MARK: NOTHING ABOVE IS EDITED ──
      GARY RULED THIS DOES NOT BLOCK A GIT-PUSH PROMOTION, AND THE ROW STAYS
      OPEN, RESCOPED TO THE DASHBOARD-REDEPLOY PATH. The reasoning is already in
      the evidence above and only needed reading as a scope rather than as a
      severity: every measured failure was a DASHBOARD redeploy, and the
      git-pushed production deploy of the same commit "7ab7106" built clean. So
      the defect is in how a redeploy is CONSTRUCTED, not in `main`, not in the
      code, and not in the env rows — which the last sentence of "AND THE VARS
      THEMSELVES ARE FINE" already said. One line of the title is now wrong in
      consequence and is deliberately left standing: "the next production
      promotion is blocked until that is understood" was the honest call on
      2026-08-09 and is superseded, not mistaken.
      WHAT THE RULING ADDS TO THE PRODUCT, and it is the durable half:
      PROMOTIONS HAPPEN BY GIT PUSH ONLY. That was already this row's own
      recommended first move ("re-promote by GIT PUSH, which is the path known
      to work"); it is now the rule. A dashboard redeploy of `main` is the thing
      not to reach for, and if anyone does reach for it, this row is why it
      fails.
      WHAT THE RULING DOES NOT DO: it does not diagnose the redeploy path, so
      the exit condition and the disconfirmation clause above are untouched.
      Anyone picking this up still starts at the env-set comparison. The cost of
      leaving it is now bounded to "a dashboard redeploy is not available as a
      recovery tool" — which matters most in exactly the situation where someone
      would reach for it, so the bound is not as comfortable as it sounds.

# PENDING RULINGS — open decisions awaiting Gary's call. Added 2026-08-05.
#
# A DECISION LOG, NOT A SECOND DEBT TABLE. An entry belongs here only if the
# next step is a DECISION rather than work. Anything with an obvious answer and
# only effort in the way is a debt row or a chore note on an existing row — R8
# on the source sheet was exactly that (a leftover staging invite) and was moved
# to DEBT-44 by Gary's ruling rather than filed here.
#
# Accepted fields: id, title, status, asked, question, options, recommendation,
# ruling, ruled, links. NOTHING ELSE — src/lib/roadmap.ts types this list and an
# unknown field type-errors the build, the same way adding `open:` to a debt row
# does.
#
# status: open | ruled | deferred
#   open     — awaiting a call. Counted in the page's headline number.
#   ruled    — decided. `ruling` and `ruled` (the date) are then present.
#   deferred — consciously not deciding yet. NOT counted as open, because a
#              deferral IS a decision; it just isn't the final one.
#
# `ruling:` AND `ruled:` ARE ABSENT UNTIL A CALL IS MADE — never present-and-
# empty. Absence already carries "not yet decided", and an empty string carrying
# the same value is the mistake src/lib/roadmap.ts documents at length for
# `resolved: false` on blocker entries: a field that duplicates what absence says
# invites filling it in wholesale, which destroys the default that makes the
# scheme safe.
#
# NO `commits:` FIELD, deliberately. A ruling is a decision, not work — the SHA
# belongs on whatever row the ruling creates, and a ruling that produced no
# commit is the normal case, not a gap.
#
# THE ID GAP AT R7 IS REAL AND INTENTIONAL. The source sheet
# (docs/prompts/Froot_pending_rulings_sheet.md) carried an R7 asking whether to
# keep the untracked promotion runbook in the repo. That closed in 1218be3
# BEFORE this list was built, so it was never imported. The ids here match the
# sheet one-for-one and were not renumbered to close the hole: renumbering would
# break the correspondence with a document in docs/prompts/, which is a claim
# and is never edited (CLAUDE.md § Where documents live).
#
# NOT MIGRATED, and it is R6's subject: SIX DEBT ROWS ALREADY OPEN WITH
# "AWAITING RULING —" IN THEIR TITLES (DEBT-36, 38, 41, 42, 45, 48). That is a
# pending-rulings convention of its own, predating this one, living inside the
# debt table. Whether those six move here is R6's question and is not answered
# by building this list. Until it is ruled, one list linking to the other is the
# honest state — R6 carries the links.
#
# RULED 2026-08-07 (R6) — THE PARAGRAPH ABOVE NOW DESCRIBES A STATE THAT NO
# LONGER EXISTS, and is kept for its reasoning rather than its facts. The six
# were ruled directly from their rows and NONE of them moved here. No debt row
# carries "AWAITING RULING" any more, so the competing convention is retired by
# exhaustion rather than by migration, and there is no second list to link to.
# New DECISIONS go here; the six stay debt rows because what remains on each is
# work or a latent record.
rulings:
  - id: R1
    status: ruled
    asked: 2026-08-05
    ruled: 2026-08-06
    title: >
      Schedule the DEBT-55 org-blind lookup sweep, or leave it latent
    question: >
      Twenty pages — eighteen inventory, plus /hr and /items — still look up the
      user by Clerk id without checking the org, the same gap F1 closed
      centrally. UI-only today: every gate behind them refuses independently.
      It is why a cross-org session still sees an overpromising sidebar, and it
      is a HARD PREREQUISITE for the org-switcher half of DEBT-50.
    options:
      - >
        (a) Schedule the sweep soon — it is mechanical, one session, mostly one
        module.
      - >
        (b) Leave open until something needs it: the switcher, or a new page
        copying the pattern.
      - >
        (c) Fold it into the next inventory-touching session as a rider.
    recommendation: >
      (b), with one addition — a comment in CLAUDE.md or at the pattern's
      most-copied site saying new pages must use the org-guarded lookup, so the
      surface stops growing. The defect is latent, the centre is fixed, and no
      phase currently needs it. A ruling of (a) produces a sweep session prompt;
      (b) leaves the row open and turns into a comment-placement decision; (c)
      is a note on the row.
    ruling: >
      (b) LEAVE LATENT. The central guard is fixed and the remaining 20 sites
      are UI-only; nothing needs them until multi-org work starts. The standing
      note that new pages must use the org-guarded lookup is added to CLAUDE.md
      § Page Conventions — chosen over a call-site comment because the failure
      mode is a NEW page copying the pattern, and its author reads CLAUDE.md
      rather than any particular one of the 20. DEBT-55 stays open.
    links: [DEBT-55, DEBT-50]

  - id: R2
    status: ruled
    asked: 2026-08-05
    ruled: 2026-08-06
    title: >
      Direction for the DEBT-56 org-move stale row — webhook repair, deletion,
      or leave it
    question: >
      When a member is removed from an org, their DB row keeps pointing at the
      old org forever and no writer can correct it. Post-F1 such a person
      degrades to STAFF with no in-app repair; before F1 they silently kept
      their old role, which was worse. This needs a direction, not a patch.
    options:
      - >
        (a) The webhook moves the row on membership.created when the identity
        has exactly one membership.
      - >
        (b) The webhook deletes the row on membership.deleted — cleaner, but it
        drops defaultStoreId and every FK hanging off User, so it needs an
        enumeration first.
      - >
        (c) Leave as-is: the console.warn makes any occurrence one log grep, and
        org moves are rare in a one-org world.
    recommendation: >
      (c) for now, revisited when multi-org work starts — at which point (a)
      versus (b) becomes a design input to that phase rather than a standalone
      fix. Write that into the row. Ruling (a) or (b) instead means an
      audit-first session, since the FK enumeration has never been done.
    ruling: >
      (c) LEAVE AS-IS, revisit when multi-org work starts. The console.warn
      makes any occurrence one log grep, and the choice between moving the row
      and deleting it is a design input to that future phase rather than a
      standalone job — deciding it early would commit the phase to one of its
      own options. Noted on DEBT-56, which stays open.
    links: [DEBT-56]


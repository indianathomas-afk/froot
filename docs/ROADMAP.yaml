      AND THE RENDER IS CLERK-DRIVEN, NOT DATABASE-DRIVEN, which is the half
      that makes it invisible rather than merely mislabelled. users/page.tsx:156
      maps over `pendingInvitations.data`, fetched at :25 with `status:
      ["pending"]`; the database rows at :37 are ONLY a lookup map. There is no
      code path anywhere that lists PendingInvite rows on their own. So a row
      whose Clerk invitation is revoked, expired or accepted-without-webhook
      renders NOWHERE — not as stale, not as orphaned, not at all.
      THE PART THAT MADE A REAL FAILURE INVISIBLE, and Gary asked for it
      recorded by name: the revoke route IGNORES deleteMany's count. Prisma
      returns `{ count: 0 }` rather than throwing, and the route returns
      `{ success: true }` at :34 regardless. An admin clicked revoke, was told it
      worked, and nothing was deleted. A destructive operation that cannot
      distinguish "deleted the row" from "matched nothing" reports the same
      success for both.
      THE MIXED CASE IS LEGITIMATE AND DATED, so this is a real class and not
      one malformed row. POST /api/users normalises to lowercase at write time
      (users/route.ts:102, via normalizeEmail in lib/clerk.ts:4-7), but that
      landed in 3c7d0a0 on 2026-07-22 — thirteen days AFTER the Taylin row was
      created on 2026-07-09. Every PendingInvite written before that commit may
      hold mixed case, which is exactly the class (1)'s comment was written for
      and exactly the class (2) and (3) mishandle.
      FIX DIRECTION, not yet ruled: normalise on read in all three paths, or
      backfill `lower(email)` and add a case-insensitive uniqueness constraint,
      or both. Whatever is chosen, the render must be able to show a
      PendingInvite that has no matching Clerk invitation — otherwise the row
      stays invisible even after the case bug is fixed, since revoked and
      expired invitations leave the same orphan. Checking deleteMany's count and
      returning 404 on zero is separable and smaller than either.
      A CHECK WHOSE COUNT AND DETAIL CAN DISAGREE, recorded here on Gary's
      instruction rather than left in a transcript, because it is the kind of
      thing that gets trusted later. DEBT-44a's own confirmation query returned
      `n = 1` with an EMPTY detail string for this very row: the detail
      expression concatenated `array_length(p."storeIds", 1)`, which is NULL for
      an empty array, and NULL || text is NULL, so string_agg had nothing to
      aggregate. Zero stores — the thing that made the invite notable — is what
      blanked the evidence describing it. A second, broader check in the same
      query is the only reason the id was recovered. Use
      `coalesce(array_length(...), 0)` in any re-run, and treat a check whose
      count and whose detail can disagree as a defective check.
      THE CASE TRAP HAS EXACTLY ONE KNOWN INSTANCE AND IT IS NOW DELETED —
      measured 2026-08-02 on branch preview/staging (br-square-feather-a63z92vz)
      by an all-invites query carrying `email <> lower(email)` as a column. After
      the Taylin delete the whole branch holds ONE PendingInvite:
      cmr07sljf000004l5yhwqzzme, kevajuice14@icloud.com, mixed_case_unrevokable
      FALSE. Recorded because a measured negative is evidence and usually goes
      unwritten — the trap is narrower than it looked.
      DO NOT READ THAT AS "THE CLASS IS CLOSED" (Gary, 2026-08-02). The query
      looked at ONE BRANCH. Every PendingInvite written before 3c7d0a0
      (2026-07-22) is still in scope on `production` and `preview/main`, neither
      of which has been examined, and the same three read paths are deployed
      there. One branch measuring clean is one branch.
      SECOND LIVE INSTANCE OF THE PRECEDENCE — NOT THE CASE BUG, AND NOT
      DANGEROUS, and it is the reason this row's scope is wider than the case
      trap that produced it. That surviving row is the one DEBT-17 already found
      and set aside: its Q1 on this branch returned kevajuice14@icloud.com with a
      User at role MANAGER against a PendingInvite at role STORE, correctly ruled
      NOT DEBT-17's bug because that error runs DOWNWARD (STAFF is the floor)
      while this discrepancy runs UPWARD (ROADMAP.yaml:4448-4451, verified at the
      row 2026-08-02 rather than from recollection). Role STORE, created
      2026-06-30, still pending after five weeks, in
      cf888f2d-f234-48c7-8097-fd5b44b5b3dd — the org whose provenance is unknown
      (DEBT-44). Direction is downward, so it grants nothing and is benign; it is
      the same mechanism as Taylin wearing the opposite sign.
      AND IT IS NARROWER THAN IT FIRST READS, per the create-branch correction on
      DEBT-44: because a User row for that address ALREADY EXISTS at MANAGER,
      re-adding that same Clerk identity hits the upsert's UPDATE branch and
      changes no role at all. STORE lands only if the User row is gone or the
      Clerk identity is new. So this instance is armed but not aimed — which is
      exactly why it is worth recording rather than actioning: it is what the
      mechanism looks like when it is NOT an escalation, and the pair
      (Taylin ADMIN-upward, this one STORE-downward) is the clearest available
      statement of what the precedence actually does.
      SCOPE WIDENED BY IT, DELIBERATELY, AND THE CALL IS ARGUABLE. This lands
      here rather than on a row of its own (Claude's recommendation, Gary's
      ruling 2026-08-02) because the defect a future reader needs to find is one
      thing — a PendingInvite can carry a live role grant that outlives its
      invitation and that the product does not surface — and splitting it across
      two rows fragments exactly the thing that took a query to see. The
      ARGUMENT AGAINST is real and is kept: this row's title is about a row that
      is unreachable AND unremovable, and kevajuice14 is neither — its case flag
      is FALSE, so the revoke button would work on it. What it shares is the
      payload, not the mechanism. If a third instance turns up that is removable
      and visible and still stale, the lifecycle question — nothing expires a
      PendingInvite, nothing reconciles one against Clerk, and Clerk invitations
      expire on their own while the database row does not — has outgrown this row
      and should be split out then.
      Related: DEBT-44 (the row this was found in, the delete, and the
      create-branch condition on the precedence), DEBT-47 (the other half of the
      Clerk/database asymmetry), DEBT-39 (unmirrored writers — the same family,
      one layer over), DEBT-17 (same page, /users, and the row that first saw
      kevajuice14 and correctly declined it).

  - id: DEBT-47
    title: >
      The Clerk webhook has no organization.deleted and no user.deleted handler,
      and organization.updated bare-updates — so deletion never reaches the
      database and a deleted row makes the webhook 500 on retry forever
    notes: >
      UPGRADED 2026-08-04: the consequence is no longer hypothetical. The
      production database (br-sparkling-block-a620qvg4) carries a User row
      (user_3Fq6iuvkhK4TSsmdaJ8yMMcT4rf, STAFF, kevajuice14@icloud.com,
      created 2026-07-03) whose Clerk identity no longer exists — deleted in
      Clerk, row orphaned, still counted by every org-scoped query (the
      live org shows 6 DB rows vs 5 Clerk members). The 2026-08-04 Clerk
      cleanup (blankettegirl user + My Organization org + Keva Smoothie
      Company org) added three more orphans by the same mechanism, tallied
      in DEBT-57. COST OF DOING NOTHING: LIVE — member counts and rosters
      silently disagree with Clerk today.
      ── ORIGINAL TEXT BELOW, UNCHANGED ──
      COST OF DOING NOTHING: Cleaning up an organization or a user requires a
      hand-sequenced two-sided dance that the product cannot perform and nothing
      records, and getting the order wrong silently regenerates what was deleted
      — LATENT (trigger: the next attempt to delete an Organization or User row
      whose Clerk identity survives, which is DEBT-44's staging cleanup and any
      future tenant offboarding; also fires unprompted the first time anyone
      renames a Clerk org whose database row is missing).
      FILED 2026-08-02 by DEBT-44a. Established from code at HEAD, from reading
      every handler in src/app/api/webhooks/clerk/route.ts.
      THE COMPLETE HANDLER SET is five events: organization.created (:41),
      organization.updated (:54), organizationMembership.created (:62),
      user.updated (:223), organizationMembership.deleted (:243). There is NO
      organization.deleted and NO user.deleted. Deletion is the only lifecycle
      verb the mirror does not implement.
      THREE CONSEQUENCES, and the second is the one that bites:
      (1) DELETION DOES NOT PROPAGATE. Deleting a Clerk org leaves the
      Organization row; deleting a Clerk user leaves the User row.
      organizationMembership.deleted fires per member and unlinks
      StaffMember.userId and deletes StoreUserAssignment rows (:264-266) — but
      it does NOT delete the User row, so even removing every member leaves the
      org undeletable, since User is one of the 44 RESTRICT FKs.
      (2) THE DATABASE ROW REGENERATES. organizationMembership.created UPSERTS
      the Organization on clerkOrgId (:71), explicitly because Clerk does not
      guarantee webhook ordering. So a row deleted while its Clerk org survives
      comes back the moment anyone is added — with a NEW cuid, the same
      clerkOrgId and the same name. The cleanup undoes itself, and the
      replacement is HARDER to reason about than what was deleted, because its
      id no longer matches anything on any row.
      (3) A RENAME AGAINST A DELETED ROW NEVER STOPS FAILING.
      organization.updated does a bare `prisma.organization.update` (:56), not
      an upsert. With no row it throws P2025, the handler 500s, and Svix retries.
      This one needs no cleanup to trigger it — it fires the first time anyone
      renames an org whose row is missing for any reason.
      WHY IT IS FILED RATHER THAN FIXED: DEBT-44a was an audit session with no
      code changes in scope, and the fix is a design question rather than a
      patch. Deletion semantics are not obvious — whether organization.deleted
      should cascade, refuse, or soft-delete is a product ruling, and with 44
      RESTRICT FKs a naive cascade handler would be the most destructive code
      path in the app, reachable from a Clerk dashboard button. Related: HR-14's
      Clerk-org-rename issue, which lives on the same handler this row calls out
      at (3).
      THE WORKAROUND, WHICH IS NOT THE FIX, and it is recorded on DEBT-44
      because that is where someone will be standing: delete the CLERK side
      first, then the database row, and only where the Clerk org is being
      deleted too. Where the Clerk organization is being KEPT there is no safe
      order at all and the ruling is do not clean it up. That is a live
      constraint on DEBT-44's Tier 1, and the reason its Tier 2 needs a third
      step nobody has authorised.
      Related: DEBT-44 (the cleanup this blocks, and the ordering ruling),
      DEBT-46 (the other half of the Clerk/database asymmetry), DEBT-39
      (unmirrored writers), HR-14 (the rename issue on handler (3)).

  - id: DEBT-48
    status: shipped
    commits: ["746918c", "d089a7c", "c05365a"]
    title: >
      CLOSED — Implement the checklist availability window, or remove
      the fields — the half of DEBT-29 that a relabel could not settle
    notes: >
      ── CLOSURE RIDER 2026-08-10 (CHK-5/S5), THE ONE THE S5 SKELETON OWES THIS
      ROW PER PLAN §10. PREPENDED; NOTHING BELOW IS EDITED. ──
      THE ROW CARRIED NO `status` FIELD AT ALL UNTIL NOW, WHICH IS THE ONLY
      THING ACTUALLY BEING FIXED HERE. Its own text has said "THIS ROW'S JOB IS
      DONE" since 2026-08-09 and its two open questions were answered there — so
      it read as closed to a human and as untriaged to anything that filters on
      status. That is the DEBT-54 bookkeeping class the CHK-4 rider corrected on
      DEBT-32, one row over.
      DISCHARGED IN THREE PLACES, hence three commits: "746918c" scoped it (the
      approved CHK-1 plan, which is what the row was holding its thinking FOR),
      "d089a7c" built the engine that made the offsets mean something (CHK-3,
      in production via merge "ddaa216"), and "c05365a" put the (i) explainer
      beside the fields (CHK-4), which is what discharges this row's own warning
      — "State it, or someone will implement them as enforcement later".
      THE ANSWER TO THE ROW'S TITLE QUESTION, PLAINLY: implement, not remove.
      The fields are EXPECTATIONS and never gates (R3), and nothing in the
      product is ever hidden by a window.
      ONE THING THE CLOSURE DOES NOT CLAIM: CHK-4 is in_progress, not
      staging-verified, so the explainer has landed in code and has not been
      read on a screen by anyone. That is CHK-4's gate to clear, not this row's
      — this row closes on the thinking being scoped and built, which it is.
      ── THE 2026-08-09 SCOPE NOTE IS NEXT, UNEDITED ──
      SCOPED 2026-08-09 — THIS ROW'S JOB IS DONE, AND IT SAID SO ITSELF. The
      scope note below reads "THIS ROW'S JOB IS TO HOLD THE THINKING UNTIL GARY
      SCOPES IT AS ONE." He scoped it: docs/prompts/CHK-1_PLAN.md, approved
      2026-08-09, committed in "746918c". The window is CHK-3 (the engine) and
      CHK-4 (the surfaces).
      BOTH RECORDED OPEN QUESTIONS ARE ANSWERED, and by which ruling is worth
      stating rather than leaving to be matched up. (a) "What does OVERDUE do
      across day boundaries?" → R1: overdue is a live state within the
      operational day ONLY; at day close an unfinished checklist becomes MISSED
      — closed, not actionable, permanently recorded — and a finished one may
      record completed-late. The row's own guess was right: "there is probably a
      point where an unfinished checklist stops being actionable and becomes a
      compliance record." (b) "What do the OFFSETS mean once the window is
      soft?" → R3: they are EXPECTATIONS, never gates, and nothing is ever
      hidden by a window. The row's warning — "State it, or someone will
      implement them as enforcement later" — is discharged by the (i) explainer
      CHK-4 ships beside the fields.
      THE OVERDUE-NOT-HIDDEN THINKING WAS PROMOTED FROM THINKING TO SPEC, which
      is precisely what the 2026-08-07 block below forbade doing without Gary
      scoping the phase first. He did. The two operating scenarios it argues
      from are now regression checks: the late opener's tasks stay completable
      (CHK-4 verifies nothing is ever hidden), and the 11am employee sees
      "Opening — Overdue" rather than an untouched list.
      ONE THING THE THINKING DID NOT ANTICIPATE, and it is the finding that
      shaped CHK-3: a checklist nobody starts HAS NO ROW. /store-view lists
      templates, not checklists, so MISSED had nothing to be written onto and
      day close must MATERIALIZE the miss. Neither this row nor DEBT-36 could
      see it from where they sat.
      THE ROW STAYS OPEN AND CARRIES NO STATUS, for the reason set out on
      DEBT-36's 2026-08-09 rider: no `status` value means "scoped into a phase
      that has not built yet", and any existing one would move a live defect
      into the RESOLVED list. It closes when CHK-4 ships; CHK-5 carries the
      instruction.
      SEQUENCING AGAINST DEBT-32 WAS HONOURED, and tightened. The note below
      says the fold is "the natural thing to do first if this is built, since a
      gate should read one list rather than three". CHK-3's expectedWindow()
      reads operationalPhase to pick its anchor, making a FOURTH reader — so the
      fold is CHK-2's opening move, before the new consumer is written.
      ── RULING OF 2026-08-07 BELOW, UNEDITED ──
      RULED 2026-08-07 — PARKED AS THE FEATURE PHASE THIS ROW'S OWN SCOPE NOTE
      DEMANDED. Neither direction the row put up (build the window, or remove
      the two offset columns) was taken as a debt-sized job, because the row is
      right that the subject has outgrown one: per-template availability with
      overdue states and a day-boundary policy is a feature phase. It gets
      scoped as one, TOGETHER WITH DEBT-36's Section entity, after the current
      minor-fix batch — two pieces of template-surface product work parked on
      the same terms and scoped in the same sitting.
      GARY'S OVERDUE-NOT-HIDDEN THINKING STANDS EXACTLY AS IT IS RECORDED BELOW
      — AS THINKING, NOT AS SPEC. Parking the row does not promote it. The block
      below still says nobody should implement from it without Gary scoping the
      phase first, and the two questions it leaves open — what OVERDUE does
      across day boundaries, and what the OFFSETS MEAN once the window is soft —
      are still unanswered inputs to that scoping rather than settled design.
      THE THIRD OPTION IS SPUN OUT AND IS NO LONGER THIS ROW'S CARGO. Making the
      offsets OPTIONAL and BLANK by default is now DEBT-59, filed 2026-08-07 on
      Gary's explicit ruling. It left this row because its whole value is doing
      it WHILE NO GATE EXISTS: it is small, it is doable now, and parking it
      inside a feature phase that has not been scoped yet would have parked it
      indefinitely — which is precisely the outcome that turns 1 and 2 into real
      windows on every existing template the day a gate ships.
      Row stays OPEN, title prefix changed from AWAITING RULING to RULED.
      ── ORIGINAL NOTES BELOW, UNEDITED ──
      COST OF DOING NOTHING: The form is now honest — it says the phase is a
      label and says the offsets are not yet used — so nobody is misled and
      nothing is broken; what is missing is a capability, not a fix — NONE.
      A legitimate NONE: DEBT-29 closed the harm on 2026-08-02, and what is left
      is a product decision that can wait indefinitely without anything
      degrading. DERIVED AT HEAD BY DEBT-29-RELABEL 2026-08-02, not
      DEBT-TRIAGE-2's — this row did not exist when that pass ran.
      CREATED 2026-08-02 by Gary's ruling when DEBT-29 closed on its RELABEL half.
      Same shape as DEBT-5 splitting into DEBT-27: closing DEBT-29 whole would
      have retired the subject from the open list while the capability question
      was still open and while three columns still collect values nothing reads.
      Prompt for the session that closed the other half:
      docs/prompts/DEBT-29-RELABEL_honest_copy.md.
      THE STATE AT HEAD, so nobody re-derives it: Template.operationalPhase,
      startOffsetHours and endOffsetHours are all collected, stored, exported and
      imported. The phase is a WORKING sequence key — it drives handoff-note date
      resolution, the note's shift_phase, and which templates you may hand off to
      (src/lib/messages.ts:38-67; handoff-notes.tsx:130, :138, :141). The two
      offsets are read by NOTHING. No code path joins either to StoreHours
      (prisma/schema.prisma:168-177), at generation or at listing.
      AWAITING GARY'S RULING: whether to build the window, or to remove the two
      offset columns and keep the phase as the label it already is.
      A THIRD OPTION, surfaced by DEBT-29-RELABEL and explicitly kept here rather
      than folded into the relabel: make the offsets OPTIONAL and blank by
      default, so templates stop carrying an invented 1/2 window nobody chose.
      Today they default to 1 and 2 (template-form.tsx:637-638) and are written
      on every StoreHours save, so the day a gate goes live those unchosen
      defaults become real windows for every existing row. That is a change to
      what the form writes, which is why it belongs to this decision and not to a
      copy change.
      SEQUENCING AGAINST DEBT-1 AND DEBT-32, carried over from DEBT-29 and still
      binding on the IMPLEMENT direction only: today a dirty phase string can at
      worst misorder a handoff note. Implementing the gate makes it decide WHEN A
      CHECKLIST APPEARS. DEBT-1 is `status: verified` — writers plugged in
      c17ccc1, backfill clean on all three branches, promoted to production
      2026-08-01 in 63407be — so the soak it demanded has happened; this is a
      pointer to the reason, not an open blocker. DEBT-32 (retire the I-14b alias,
      fold the three phase lists into one) is the natural thing to do first if
      this is built, since a gate should read one list rather than three.
      ────────────────────────────────────────────────────────────────
      GARY'S THINKING ON THE EVENTUAL SHAPE — RECORDED 2026-08-02 AS THINKING,
      NOT AS A RULING, AND NOT AS A SPEC. It is here so it is not lost. Nobody
      should implement from it without Gary scoping the phase first.
      THE SHAPE: availability is PER TEMPLATE, not per org, and a closed window
      makes a checklist OVERDUE — visible, flagged, still completable — never
      hidden.
      WHY, from two real operating scenarios. (1) An opener arrives late and
      misses the window. Under hard enforcement the morning checklist disappears
      and the cash-drawer count and petty-cash audit go undone. Nobody skipped
      them; the system withdrew them. For a compliance product a task that
      VANISHES is worse than one left unfinished, because unfinished is visible
      and vanished is not. (2) An owner-operator ignores the opening checklist
      because they can. The 11am employee opens the app and sees it untouched —
      is it theirs? was it skipped? should they do it four hours late? With no
      enforcement at all the list stops meaning "what you need to do" and starts
      meaning "everything that exists".
      OVERDUE-NOT-HIDDEN ANSWERS BOTH: (1) keeps the tasks completable, and (2)
      gives the 11am employee "Opening — overdue, not completed", which is an
      answer rather than a puzzle.
      PER TEMPLATE because the two scenarios differ BY CHECKLIST, not by org. A
      cash-drawer count is genuinely time-bound; a deep-clean list is "do this
      today". One org-wide switch forces one answer for both. Per-template also
      makes the whole question lower-stakes: with overdue-not-hidden the worst
      case is a longer list, not a missed audit.
      TWO QUESTIONS THIS SHAPE RAISES, UNANSWERED, recorded so they are not
      rediscovered. (a) What does OVERDUE do across day boundaries? A closing
      checklist unfinished at 11pm is overdue; at 6am is it still overdue, or
      closed out and recorded as missed? Without an answer the opening crew
      inherits a growing pile from previous shifts. There is probably a point
      where an unfinished checklist stops being actionable and becomes a
      compliance record. (b) What do the OFFSETS mean once the window is soft?
      Today they read as a hard boundary. Under overdue-not-hidden they describe
      an EXPECTED start and end, not an allowed one — the same two numbers
      carrying a different meaning. State it, or someone will implement them as
      enforcement later.
      ────────────────────────────────────────────────────────────────
      SCOPE NOTE, AND IT IS THE POINT OF THIS ROW: this has outgrown a debt row.
      Per-template availability with overdue states and a day-boundary policy is
      a FEATURE PHASE, not a cleanup. THIS ROW'S JOB IS TO HOLD THE THINKING
      UNTIL GARY SCOPES IT AS ONE. Do not let it ride along with a debt session.
      Disconfirmed by: any availability filter keyed on operationalPhase or the
      offsets appearing in the codebase — at which point the IMPLEMENT direction
      was taken and this row describes history. Related: DEBT-29 (the relabel
      half, closed), DEBT-1, DEBT-32, DEBT-30.

  - id: DEBT-49
    title: >
      No admin control sets StaffMember.isCorporate — the DEBT-9 designation is
      SQL-only, so a corporate hire cannot be marked without a Neon console
    notes: >
      COST OF DOING NOTHING: The two known corporate staff are set by SQL in
      DEBT-9 Phase 4 and every read path honours the flag, so nothing is wrong
      for anyone who exists today; the gap opens only when a THIRD corporate
      person is hired and no one in the product can mark them — LATENT (trigger:
      the next corporate hire, or any store-homed employee moving to corporate.
      Until then the flag is correct for 100% of rows).
      CREATED 2026-08-02 by Gary's ruling deferring DEBT-9 Phase 3d. The reason
      for the defer was scope, not doubt: DEBT-9 Phase 0 finding 4 added the
      whole self-serve signing path to that session, which put HR-11 ceremony
      re-verification on the critical path, and the toggle has no users today.
      Prompt: docs/prompts/DEBT-9_corporate_work_location.md.
      THE ASSESSMENT IS THE CONTENT OF THIS ROW — measured at head during
      DEBT-9 Phase 0, recorded so it is not re-derived. Two things make this
      bigger than a checkbox, and both are easy to miss on a second look:
      (1) THE GATE ASYMMETRY. The natural home, StaffEditActions, renders for
      ADMIN *and* in-scope MANAGER — src/app/(app)/staff/[id]/page.tsx:545 gates
      it on canSeeNotes (:87, ADMIN || MANAGER). But the brief requires this
      control to match the PRIMARY-STORE CHIP path, which is ADMIN-only:
      src/app/(app)/staff/page.tsx:266 passes canEdit={isAdmin}. PATCH
      /api/staff/[id] admits managers wholesale (route.ts:29-32) and documents
      the asymmetry it already lives with at :94-98. So isCorporate would be the
      FIRST field in that route needing its own per-field role gate. The
      recommendation at the time — not ruled on — was a separate ADMIN-gated
      control rendered NEXT TO StaffEditActions rather than a field inside the
      manager-visible dialog, precisely to avoid adding a per-field gate to a
      shared route.
      (2) THE STALE-STAR RULE, genuinely undecided. Flagging someone Corporate
      while they still hold an isPrimary assignment leaves a starred chip on
      /staff/[id] (page.tsx:501-507) that primaryStoreName() now ignores — the
      UI would assert a home store the signed record contradicts. Whoever builds
      this must pick one: clear isPrimary on flagging, refuse the flag while a
      primary is set, or render the star suppressed for corporate staff. The
      Zod schema (route.ts:7-17), the dialog state (staff-edit-actions.tsx:56)
      and BOTH transaction branches (route.ts:125-153) have to agree on whichever
      is chosen — the branch that replaces assignments wholesale and the
      light-touch branch that only moves the flag.
      NOT A BLOCKER ON ANYTHING. DEBT-9's read paths, surfaces and data all ship
      without it; this row is purely the write affordance.
      Disconfirmed by: an isCorporate control appearing in staff-edit-actions.tsx
      or beside it with an ADMIN check in PATCH /api/staff/[id]. Related: DEBT-9
      (the parent), BUILD-2 (the primary-store chip path this must match).


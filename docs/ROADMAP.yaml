    status: shipped
    shipped: 2026-07-10
    commits: [96bc048, cd711d7]
    title: "Dashboard live pacing — plan-driven Monthly Goal, Square order webhooks, all-locations rollup + store ranking"
    notes: >
      Seed correction: the items the 7-08 partial (96bc048) deferred — order
      webhooks, rollup, store ranking — all shipped 7-10 in cd711d7. Nothing
      remains deferred.
    blockers:
      - >
        CONFIRMED LIVE 2026-07-27 — not stale, and worse than "never confirmed
        closed" implied. SQUARE_WEBHOOK_SIGNATURE_KEY is ABSENT from EVERY
        Vercel environment. The Square vars that do exist are
        SQUARE_ENVIRONMENT, SQUARE_APPLICATION_SECRET, SQUARE_APPLICATION_ID,
        NEXT_PUBLIC_SQUARE_APP_ID and SQUARE_ACCESS_TOKEN. Consequence: order
        webhooks have NEVER been signature-verified in production, so F-4's
        headline feature — live intraday pacing — has been silently degraded to
        the nightly sales-reconcile backfill since 2026-07-10. The dashboard has
        been showing day-old pacing, not live pacing, for 17 days without
        erroring.
      - >
        The fix is TWO parts and neither alone is sufficient: (a) set

  - id: DEBT-36
    title: "AWAITING RULING — Sections are implied, not modelled — no entity, no ordering, no as-executed record"
    notes: >
      COST OF DOING NOTHING: There is no as-executed record of section names
      anywhere in the system, and nobody has renamed one yet — LATENT (trigger:
      the first section rename on a template that already has completed
      historical checklists, which silently rewrites their headings and their
      print copies, with no indication anything changed. For an
      operational-compliance product a printed closing checklist that re-prints
      under a heading it was never executed under is the part that matters).
      DERIVED-AT-HEAD-BY-DEBT-TRIAGE-2 2026-08-02, not the audit's.
      RECORD HALF RELOCATED 2026-08-02 by DEBT-TRIAGE-2 → prisma/schema.prisma,
      as comments on BOTH Task.sectionName and the TaskLog model — the compliance
      fact that renames rewrite history and that there is no as-executed record
      of section names anywhere. TaskLog gets the other half because the note
      there is the ABSENCE of a section column, which is where a reader would
      look for the record and not find it. THE ENTITY WORK STAYS HERE, AWAITING
      RULING: a comment records a fact, not a decision.
      AWAITING GARY'S RULING: whether to model Section as a first-class entity
      with stable ids, accepting a migration plus UI, or to accept that section
      renames retroactively rewrite historical checklists.
      THIS BLOCK IS THE FIRST RECORD OF THAT DEFERRAL, NOT A TRANSCRIPTION OF AN
      EXISTING ONE — stated plainly because the other three AWAITING RULING rows
      are transcriptions and this one is not. Ruled by Gary 2026-08-02 in the
      DEBT-TRIAGE-1 task order: the entity work waits until after DEBT-2b, and
      until he decides whether renames rewriting historical checklists is
      acceptable. Before today the row carried only a sequencing note ("Sequence
      it after DEBT-2b") and no ruling at all, so it read as undone work rather
      than as a decision pending on him.
      ── ORIGINAL NOTES BELOW, UNEDITED ──
      FILED 2026-08-01 from DEBT-2a's findings; see docs/prompts/DEBT-2_AUDIT.md §2 and
      §6. This is the DURABLE fix for the class DEBT-2 describes, and it is
      deliberately NOT part of DEBT-2b — it is a product decision plus a
      migration plus a UI, not a debt cleanup. Do not let it ride along.
      WHAT IS MISSING: there is no Section entity. A section is a GROUP BY over
      a free-text string, recomputed independently at five render sites. So
      there is no canonical list, no rename, no reorder, and no per-section
      metadata. Section ORDER is not expressible at all — it is inferred from
      orderIndex adjacency (template-form.tsx:489), which is why a section whose
      tasks are non-contiguous renders two identical headings from data that has
      not drifted at all.
      THE FINDING THAT MAKES THIS MORE THAN COSMETIC — CHECKLIST RENAMES REWRITE
      HISTORY. Checklist does NOT snapshot task data: api/checklists/route.ts:122
      and :156 store only ids, and TaskLog carries no section. So renaming a
      section retroactively rewrites the headings on EVERY historical completed
      checklist and its print copy. There is no as-executed record of section
      names anywhere in the system. A printed closing checklist from last month
      will re-print today under whatever the section is called today, with no
      indication anything changed. For an operational-compliance product that is
      the part worth fixing, and an entity with stable ids is what fixes it.
      SCOPE NOTE: an entity also subsumes the ordering limitation above, and
      makes DEBT-2b's step 3 (one empty-value string across five sites)
      unnecessary rather than merely consistent. Sequence it after DEBT-2b, not
      instead of it. Related: DEBT-2, DEBT-30.


      the DANGEROUS line. Following it today would delete the branch-scoped
      staging override — the very row that makes staging deploys hit ep-odd-rain
      instead of failing — and it directly contradicts BUILD-1's deferred step 2,
      which says to ADD Preview-scoped vars when collaboration work starts.
      A reader trusting this file would undo the 2026-07-27 fix.
      (3) §4 and §5 say staging uses Square SANDBOX
      (`SQUARE_ENVIRONMENT=sandbox`, sandbox app credentials). Staging actually
      connects to a separate "Froot Staging" PRODUCTION app against the real
      Square account — which is why staging token refreshes act on real tokens.
      The file's promise that "no real charges can happen from staging even by
      accident" is therefore not something this environment guarantees.
      (4) Consequently §8's verification checklist can never pass as written.
      FIX SHAPE — pick one, do not leave it as is: either correct the file to
      describe the environment that exists, or add a prominent header marking it
      ASPIRATIONAL/HISTORICAL (the plan as drafted, not the system as built).
      The header is the cheap option and removes the danger in (2) immediately.
      Related: DEBT-3 (the other doc contradicting current policy), BUILD-1,
      SEC-4 (logged from this same file's housekeeping note).

  - id: DEBT-8
    # FIRST debt row ever closed, so this field is new here — the vocabulary is

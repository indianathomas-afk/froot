  - id: DEBT-17
    status: shipped
    commits: ["84437e5"]
    title: "Visiting /users can persist a role the admin never chose — the page creates User rows from Clerk membership alone, ignoring PendingInvite"
    notes: >
      REACHED MAIN 2026-08-01 in promotion 63407be. Status flipped staging -> shipped 2026-08-01 by DOCS-2. Debt rows carry no
      `shipped:` field (DebtItem in src/lib/roadmap.ts has none, and adding
      one type-errors the build), so the promotion date lives here.
      FIRST LIVE NON-ADMIN INVITE SINCE THE FIX, 2026-08-01 — CONSISTENT, NOT
      PROOF. The invite that cleared PERM-6/PERM-7's promotion gate was role
      MANAGER, and /users showed the accepted account as MANAGER, not STAFF —
      the downgrade this row describes did not happen. It does NOT discriminate
      and must never be cited as though it does: post-fix BOTH writers resolve
      role from PendingInvite, so MANAGER is what either winner produces, and
      which one won was not established. What it does rule out is the failure
      mode — had the fix regressed or not deployed, a page-won race would have
      shown STAFF.
      FIXED 2026-07-30 — DIRECTION B, exactly as decided 2026-07-28 and without
      re-litigating the fork. src/app/(app)/users/page.tsx:85-86 now resolves
      the create branch's role as
      `pendingByEmail.get(email)?.role ?? (m.role === "org:admin" ? "ADMIN" :
      "STAFF")`, mirroring the webhook's resolvedRole
      (webhooks/clerk/route.ts:109) so the two writers cannot drift. Every
      file:line in this row was re-verified before editing and NONE had drifted:
      the block is :65-98, the role guess was at :86, pendingByEmail is built at
      :46.
      TWO SILENT-NO-OP RISKS CHECKED FIRST, both clear. (1) KEY MISMATCH —
      pendingByEmail is keyed on raw p.email and the webhook deliberately matches
      `mode: "insensitive"`, but PendingInvite.email is normalised at write time
      (users/route.ts:75) and the lookup key is the already-normalised `email`
      from :74-77 (getClerkPrimaryEmail returns normalizeEmail(primary)), so
      exact match holds. The map was deliberately NOT re-keyed: its other
      consumer at :148 looks up with Clerk's raw inv.emailAddress and re-keying
      would put that at risk for no gain. (2) MISSING FIELD — the query at :37
      has no `select`, so role is present, and PendingInvite.role is the Role
      ENUM (schema.prisma:194), so unlike the webhook's :109 no `as` cast is
      needed.
      NO REPAIR STEP NEEDED — evidence, 2026-07-29/30, Gary ran both queries.
      Q2 (post-webhook signature: role STAFF holding store assignments) returned
      ZERO ROWS on branch `preview/staging` and ZERO ROWS on branch
      `production`. Q1 on branch `preview/staging` returned ONE row
      (kevajuice14@icloud.com, MANAGER vs invited STORE) which is NOT this bug:
      the page can only ever write ADMIN or STAFF, and this row's error runs
      DOWNWARD (STAFF is the floor) whereas that discrepancy runs upward. So the
      fix is code-only; no data repair.
      STILL OPEN AND DELIBERATELY NOT DONE: option C (extract a shared
      syncOrgMembership()). Direction B leaves the GET-that-writes smell in
      place, which was accepted at decision time — "C LATER IF THE SMELL EARNS A
      PHASE". Note BUILD-2's interaction below still applies to C.
      ── ORIGINAL NOTES BELOW, UNEDITED ──
      Filed 2026-07-28 during PERM-7's staging post-mortem. INDEPENDENT OF
      PERM-7 and SHIPS IN PRODUCTION TODAY — it is in no phase's diff and was
      found by tracing every writer of User.role.
      THE BUG: src/app/(app)/users/page.tsx:65-91 auto-syncs "any Clerk member
      who has no DB User record yet" by upserting a User with
      `role: m.role === "org:admin" ? "ADMIN" : "STAFF"` (:86). It never
      consults PendingInvite. The Clerk webhook, which DOES consult it
      (webhooks/clerk/route.ts, `resolvedRole = pending?.role ?? ...`), is the
      only path that knows the admin picked MANAGER or STORE — because
      POST /api/users maps every non-ADMIN role to the same Clerk role,
      `org:member` (users/route.ts:102). The app role is recoverable ONLY from
      PendingInvite.
      CONSEQUENCE: whichever writer runs FIRST wins, and the page can win. An
      admin who invites someone as STORE or MANAGER and then opens /users
      before the webhook lands persists role STAFF permanently — the webhook's
      upsert later takes its UPDATE branch, which sets only `email` and never
      role. The invite's intended role is silently discarded, and PendingInvite
      is not cleaned up either, so the two disagree with no signal.
      Direction of the error is DOWNWARD (STAFF is the floor), so this is a
      lockout/annoyance rather than an escalation — an invited manager lands
      with no manager access and nothing explains why. An org:admin invite is
      unaffected, since both writers agree on ADMIN.
      NOT TRIGGERED in the 2026-07-28 staging attempt — corrected 2026-07-28.
      An earlier version of this line said the invited account "has no User row
      at all"; that came from a mis-branched query. On preview/staging the
      webhook won the race and persisted role STORE correctly from
      PendingInvite. So this remains a REAL but UNEXERCISED race, found by
      code-reading rather than by observation. Its severity is unchanged; only
      the claim that it had been seen is withdrawn.
      FIX DIRECTION: have the page consult PendingInvite exactly as the webhook
      does, or (better) stop writing roles from a render path entirely and let
      the page display an unsynced member as pending rather than materialising
      a guess. A GET that writes is the underlying smell.
      ── AUDIT 2026-07-28 (audit only, NOT implemented; row stays OPEN) ──
      STILL REAL against current code. The block is users/page.tsx:65-98 (the
      row said :65-91 — it extends to :98 including the post-sync re-fetch);
      the role guess at :86 is exact. Sharper than the row states: the page
      ALREADY BUILDS pendingByEmail at :46 from the same PendingInvite rows the
      webhook reads, and the upsert simply does not consult it. The data is in
      hand and unused. Only an ADMIN can trigger the write (requireAdmin,
      users/page.tsx:162). Also drifted: the Clerk role mapping is
      users/route.ts:106, not :102.
      THE WINDOW — NOT MEASURED, and this is stated as structure, not timing.
      It opens when Clerk fires organizationMembership.created and closes when
      the handler's upsert commits. The event is ACCEPTANCE-time, not
      invitation-time: the handler reads membership.public_user_data.user_id
      (webhooks/clerk/route.ts:140), which exists only once someone has joined.
      So normally SECONDS. But it can persist: the handler returns 500 on
      "Failed to resolve member email" (:95) and on any unhandled DB error, and
      Svix retries on a seconds → minutes → hours backoff; and if the webhook
      is misconfigured for an environment or CLERK_WEBHOOK_SECRET is wrong, the
      window is UNBOUNDED and the page becomes the only writer by design rather
      than by race. The trigger — an admin reloading /users to see whether the
      invite was accepted — is the natural admin behaviour in exactly that
      window, which is why "unexercised" should not be read as "unlikely".
      THE WRONG ROW IS PERMANENT, CONFIRMED. webhooks/clerk/route.ts:139-156:
      `update: { email: userEmail }`. `role` appears ONLY in the create branch
      (:154). The page's STAFF row is never corrected. Recovery exists but
      requires an admin to NOTICE — the Edit User dialog sets role and
      assignments (users/[id]/route.ts:136).
      THIS ROW WAS WRONG ABOUT THE AFTERMATH — corrected 2026-07-28. It said
      "PendingInvite is not cleaned up either, so the two disagree with no
      signal." FALSE against current code. The `if (pending)` block at
      webhooks/clerk/route.ts:158-196 is NOT gated on which upsert branch ran;
      it fires whenever a PendingInvite matched. So even when the page wins the
      race, the webhook still creates the correct StoreUserAssignments (:179),
      binds the staff profile (:189), and DELETES the PendingInvite (:195).
      Two consequences pulling opposite ways: LESS BAD — store access lands
      correctly, so the victim gets the right locations with the wrong role;
      WORSE — the forensic evidence self-destructs, so there is normally no
      surviving PendingInvite to compare against. End state is a distinctive
      shape: role STAFF holding store assignments.
      OPTIONS FOR THE FIX — Gary's decision, deliberately not taken here.
      (A) Page stops writing; render unsynced Clerk members as "pending sync".
      Kills the race and the GET-that-writes smell outright. BUT the auto-sync
      is evidently a safety net for missed webhooks, and this removes it: the
      Edit dialog uses prisma.user.update({where:{id}}) and needs the row to
      already exist, so a broken webhook would leave members with no row and no
      path to one. Needs an explicit "Sync now" admin action or it deletes a
      recovery route.
      (B) Page reads PendingInvite as the webhook does. Cheapest — roughly one
      line against data already loaded at :46. Fixes the role; keeps the
      GET-that-writes. Does not reproduce the webhook's store fan-out, but the
      webhook's if(pending) block still lands those later, so it converges. If
      the webhook never lands: role-correct row, no stores, PendingInvite
      survives — strictly better than today. Risk: role resolution now lives in
      two places and can drift.
      (C) Extract the webhook body into a shared syncOrgMembership() called by
      both. One implementation, no drift; whoever wins does the whole job
      correctly and the loser's upsert is a no-op. Biggest diff, in an untested
      production path (the repo has NO tests), still leaves real writes in a
      render path, and needs idempotency care around pendingInvite.delete under
      concurrency.
      (D) Leave the write; warn when role disagrees with a surviving
      PendingInvite. No behaviour change, cheapest to reason about — but per
      the correction above the PendingInvite usually will NOT survive, so it
      detects almost nothing.
      DECISION — GARY, 2026-07-28: **B NOW, C LATER IF THE SMELL EARNS A
      PHASE.** Taken on the audit above, after the correction to the aftermath
      claim. Rationale as presented and accepted: B is roughly one line against
      data the page already loads at :46, it closes the actual harm (the wrong
      role), and it cannot regress the webhook. A is the architecturally right
      answer but silently removes the missed-webhook recovery path, which does
      not look disposable — A is only on the table bundled with an explicit
      "Sync now" admin action. D is close to worthless given the correction,
      because the PendingInvite it would compare against is usually already
      deleted.
      This row therefore stays OPEN as a decided-but-unimplemented fix, not as
      an open question. The next session picking it up implements B and does
      NOT re-litigate the fork.
      EVIDENCE IT HAS OCCURRED — MOSTLY FORECLOSED by the correction above:
      because the webhook deletes the PendingInvite, the direct
      role-vs-PendingInvite comparison survives only where the webhook NEVER
      landed. Two read-only queries were WRITTEN FOR GARY TO RUN, not run here
      (per the session's Neon-console-only rule); run on branch `production`
      first, then `preview/staging`, and label every result with its branch.
      Q1 (webhook never landed) — join "User" to "PendingInvite" on
      organizationId + lower(email) where u.role <> p.role, selecting both
      roles, p."storeIds" and both createdAt.
      Q2 (post-webhook signature, weaker) — "User" u join "StoreUserAssignment"
      a on a."userId" = u.id where u.role = 'STAFF', grouped, counting
      assignments. FALSE POSITIVES ARE POSSIBLE on Q2: an admin can legitimately
      assign stores to a STAFF user by hand via users/[id]/route.ts:136. Q2 is
      a lead, not proof.
      Full query text is in the Appendix of
      docs/prompts/DEBT-10_team_members_pii.md; nothing has been run, so NO
      branch-labelled result exists yet.
      BUILD-2 INTERACTION (2026-07-29). BUILD-2 added a defaultStoreId write
      INSIDE the `if (pending)` block at webhooks/clerk/route.ts:158-196 — the
      same block this row's aftermath correction established fires regardless of
      which writer won the race. Consequences for the decided fix: DIRECTION B
      (page reads PendingInvite) touches the page only and CANNOT disturb it —
      no change needed. OPTION C (shared syncOrgMembership()) WOULD have to
      carry the default-setting across deliberately; it is easy to lose in that
      extraction because it is a `prisma.user.update` sitting AFTER the upsert
      rather than part of it. Also sharpens this row's end-state signature:
      "role STAFF holding store assignments" now additionally carries a
      defaultStoreId when exactly one store was provisioned, which slightly
      strengthens Q2 as a lead (still not proof).


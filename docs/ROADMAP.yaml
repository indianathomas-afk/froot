  - id: SQ-1
    track: square
    size: S
    status: verified
    title: "Audit — Square OAuth access-token refresh (read-only)"
    notes: >
      Refresh EXISTS and is wired: refreshTokenIfNeeded() at src/lib/square.ts:37,
      called only from getSquareClient() (src/lib/square.ts:202), which refreshes
      when squareTokenExpiresAt is inside 7 days. Lazy only — no refresh cron.
      Production DB confirms Keva Juice has both an access and a REFRESH token
      stored, expiring 2026-08-06T09:48:55Z, so the 8-06 cliff is survivable
      without a reconnect provided one getSquareClient path runs on/after
      2026-07-30. Residual risk is silence, not absence: a failed refresh
      returns the stale org with no log (square.ts:56), the settings UI reports
      "Connected" off token presence alone, and dashboard sync errors are caught
      and served from cache. Four Square helpers bypass the wrapper entirely
      (fetchSquareTeamMembers / fetchSquareTeamMember /
      updateSquareTeamMemberName in square.ts, plus /api/square/locations) and

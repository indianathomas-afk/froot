    commits: [5119a6b, 24eb289, 6fb4b4f, 2a7e044, 72bcf30]
    title: "Per-user capability overrides — the toggle layer"
    notes: >
      Grant or remove a capability for ONE user against their role baseline —
      e.g. one staff member gets inventory-count access, or the inventory nav,
      while others do not. PERM-1's can()/scope() layer plus PERM-2's
      discipline (every decision routed through a capability, nav visibility
      kept separate from API access) is the substrate this depends on: there is
      one place to hook the override. Must keep the shim's rule that a stored
      permission set RESTRICTS BELOW the Clerk role ceiling and never elevates
      above it.
      SCOPE SHARPENED 2026-07-27 — three things changed, none of them the core
      idea.
      (1) RESTRICT-ONLY IS NOW A RECORDED RULING, not just an implementation
      note. See DECISIONS.md 2026-07-27: role choice at provisioning is
      unrestricted, while overrides stay restrict-only. Those are DIFFERENT
      MECHANISMS and were argued as if they were the same during scoping — an
      ADMIN device account is not an "elevated STORE user", it is a user whose
      role is ADMIN. If a future session finds itself asking PERM-5 to grant
      something a role does not already have, the answer is a different role,
      not a wider override.
      (2) PERM-7 DEVICE ACCOUNTS ARE THE FIRST REAL CONSUMER. The motivating
      case is no longer hypothetical: an admin dials an individual store's
      device DOWN from the STORE baseline — this location's iPad does not get
      labor, that one does not get inventory counts. Restrict-only is exactly
      the right direction for that, so PERM-5 and PERM-7 fit together without
      either bending. Design the override UI knowing the population may be
      one row per store rather than a handful of exceptional humans.
      (3) MANAGEMENT SURFACE GREW. With a device account per location, twelve
      stores means twelve override targets. That raises the value of UM-2's
      capability-matrix page rendered FROM THE LIVE REGISTRY, and makes a
      per-user diff beside the role baseline close to required rather than
      nice-to-have.
      SEQUENCE: after PERM-7. The devices have to exist before dialling them
      down is a real task, and PERM-6 (which clears the blocker below) is
      already a PERM-7 prerequisite — so the ordering falls out naturally as

        CONFIRMED LIVE 2026-07-27 — not stale, and worse than "never confirmed
        closed" implied. SQUARE_WEBHOOK_SIGNATURE_KEY is ABSENT from EVERY
        Vercel environment. The Square vars that do exist are
        SQUARE_ENVIRONMENT, SQUARE_APPLICATION_SECRET, SQUARE_APPLICATION_ID,
        NEXT_PUBLIC_SQUARE_APP_ID and SQUARE_ACCESS_TOKEN. Consequence: order
        webhooks have NEVER been signature-verified in production, so F-4's
        headline feature — live intraday pacing — has been silently degraded to
        the nightly sales-reconcile backfill since 2026-07-10. The dashboard has
        been showing day-old pacing, not live pacing, for 17 days without
        erroring.
      - >
        The fix is TWO parts and neither alone is sufficient: (a) set
        SQUARE_WEBHOOK_SIGNATURE_KEY per environment, and (b) register a webhook
        subscription in EACH Square app — the production app and the separate
        "Froot Staging" app, which have different keys. Setting the env var
        against an app with no subscription registered yields exactly the same
        silence as today.
    open:
      - >
        Determine whether src/app/api/webhooks/square fails CLOSED (rejects
        every event when the key is unset — the degradation described above) or
        fails OPEN (skips verification when the key is unset). Fail-open would
        make it an UNAUTHENTICATED WRITE ENDPOINT reachable by anyone who knows
        the URL, writing into the sales caches that drive pacing — a materially
        different and more urgent finding than degraded pacing. Logged
        2026-07-27, deliberately NOT investigated in that session; resolve this
        before the env var is set, since fail-open would mean the endpoint has
        been exposed since 7-10.


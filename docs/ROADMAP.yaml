# Froot roadmap — single source of truth for phase status.
# Supersedes docs/ROADMAP.md (now a pointer), the old CLAUDE.md "Phase Status"
# section, and the external sheet. If any of those disagree with this file,
# this file wins. Narrative history (verification fixtures, migration names,
# decision cross-refs) lives in docs/ROADMAP_ARCHIVE.md, frozen 2026-07-24.
#
# UPDATE RULE: every Claude Code session updates its phase's entry here before
# the session is done. See "Session completion rules" in docs/WORKFLOW.md.
#
# status: planned | in_progress | staging | shipped | verified | withdrawn
#   staging  — merged to `staging`, on Vercel preview, NOT in prod
#   shipped  — merged to `main`, live in prod
#   verified — shipped AND smoke-tested against real store data
#   withdrawn — retracted, not fixed; kept for the record. Counts as RESOLVED
#              on /internal/roadmap and carries NO `commits` (nothing was
#              fixed, so there is no SHA to cite). Added 2026-08-01.
#   GAP: no status fits an audit-only phase with no shipped code (SQ-1 sits in "verified") — a future "closed"/"documented" would.
#
# blockers — problems in a phase regardless of status (unset env vars,
#            prod-promotion gates, unverified pixel work).
#   AN ENTRY IS ONE OF THREE THINGS: a BARE STRING (LIVE), or
#   `{narrowed: true, text: >}` (STILL BLOCKS, but on strictly less than it
#   originally asserted), or `{resolved: true, text: >}` (CLOSED, kept for the
#   record). "Anything here blocks" was true when written
#   and stopped being true as soon as the preserve-and-mark convention started
#   keeping closed gates in the array: by 2026-08-01, 8 of 19 entries were
#   closed and /internal/roadmap counted every one of them as live. Corrected
#   by P-4 the same day, which added the flag.
#   NARROWED is DEBT-41's third state, added 2026-08-08 after two entries sat
#   half-closed with nowhere to say so. It is COUNTED SEPARATELY and it STILL
#   BLOCKS: the panel reads "16 live · 2 narrowed", the phase stays in the
#   blocked list and in the "Phases blocked" tile. Use it when part of what an
#   entry asserted is answered and a NAMED REMAINDER is still live — say what
#   remains in the entry's own text, since the flag carries no second field.
#   A MISSING FLAG MEANS LIVE — DEBT-14's "a missing status means OPEN" one
#   level down, and the safe direction: an unclassified entry keeps blocking.
#   NEVER WRITE `resolved: false` OR `narrowed: false`. Each is exactly the
#   value the flag's ABSENCE already carries, and either one destroys the
#   missing-flag-means-live default. The type makes them unwritable (three
#   union members, not one object with optional flags) — keep it that way.
#   NEVER edit an entry's text to mark it resolved or narrowed. The prose is the
#   record and on several rows the ORDER of the entries is the lesson; the flag
#   is additive and sits over text that does not change.
#   DO NOT infer the state from the leading words. Live entries open "VERIFIED
#   STILL TRUE" (F-5) and "CONFIRMED LIVE" (F-4), and PERM-6's two closed
#   entries carry no marker at all — they are closed by the entry prepended
#   ABOVE them. Only the flag is read.
# deferred — scope intentionally cut.
# open     — unresolved questions that aren't yet blockers.
#   Both are still BARE STRINGS ONLY and both still keep resolved entries in
#   the array (PERM-2 `deferred`, and PERM-6/PERM-7/SEC-1 `open`). Known and
#   deliberately not fixed — no count on the page reads either field. DEBT-42.
#   NOTE: blockers/deferred/open/tags exist ONLY on `phases`. `bugs:` accepts
#   id/title/status/shipped/commits/notes; `debt:` accepts
#   id/title/status/commits/notes.
#   Adding `open:` to a debt row type-errors the build (see src/lib/roadmap.ts)
#   — fold it into notes instead. Learned the hard way 2026-07-27.
# tags     — [pre-launch] must close before external merchants.
#
# `shipped:` dates are when the work reached main/prod; where a phase was built
# earlier and promoted later, the build date is in notes.


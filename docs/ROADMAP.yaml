  - id: BUG-4
    title: "Labor Budget card and Weekly Plan disagree on schedulable hours when no weather adjustment exists"
    status: planned
    notes: >
      Logged 2026-07-27, not fixed. The dashboard Labor Budget card shows
      `totalSchedulableHours` unless a weather adjustment exists, while the
      Weekly Plan ALWAYS shows `adjustedTotalSchedulableHours`. Confirmed in
      source: src/app/(app)/dashboard/labor-budget-card.tsx:179 reads
      `adjusted ? res.adjustedTotalSchedulableHours ?? budget.totalSchedulableHours
      : budget.totalSchedulableHours`, whereas
      src/app/(app)/labor/weekly-plan-client.tsx:206 renders
      `adjustedTotalSchedulableHours` unconditionally. On a week with NO weather
      adjustment the two values still differ — they are computed by different
      paths (src/lib/labor-budget.ts:100 sums salaried + hourly; the adjusted
      figure at src/lib/labor-plan.ts:285 re-sums salaried + the per-day
      hourlyHours AFTER the floor-first 0.5-step flooring), so the adjusted
      total carries flooring residue even with no adjustment applied.
      The card's behavior is DELIBERATE per its own inline comment, so this is
      not a straightforward bug — but two screens showing different
      schedulable-hour totals for the same store and the same week is a
      correctness problem for the operator regardless of which number is
      defensible. Decide which figure is canonical and make both surfaces say
      it, or label them differently. Numbered BUG-4 because BUG-1…BUG-3 exist;
      docs/prompts/verification-smoke-pass.md already referenced a "BUG-4" in
      its holds list before any BUG-4 row existed — this fills that reference.


      rewrite, and the two ship independently.
      THE FACT, so nobody re-derives it: print/checklist/[id]/page.tsx:30 loads
      `template.tasks` fresh on every render and groups them at :43-51. Nothing
      about the task list is frozen. A task DELETED from a template is the one
      case that is safe, and only by accident — api/templates/[id]/route.ts:96-101

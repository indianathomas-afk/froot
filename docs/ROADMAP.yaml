      to that account's own store — and editable by the user themselves.
      ALSO CORRECTED: the premise that "first store" is nondeterministic is
      FALSE for store pickers. Every page selects with
      `orderBy: { name: "asc" }` and takes `stores[0]`, so today's default is
      deterministic — just arbitrary (alphabetically first). The unspecified
      ordering of `dbUser.storeAssignments` is real (no orderBy at

      No migration, no schema change. DATABASE_URL_UNPOOLED pre-exists in all
      Vercel envs (Neon integration); local .env gets it manually. See
      DECISIONS.md BUG-3. Staging proof required: build log Datasource "db"
      host without -pooler; a green deploy alone is not proof (P1002 is
      intermittent).
      History: f6818f1 reached main via c463af3 (2026-07-26), but status was
      deliberately held at in_progress through the 2026-07-26 reconcile because
      the required proof had never been recorded. Code shipped ≠ bug closed.
      PROOF SATISFIED 2026-07-27 — flipped to shipped. Both build logs show the
      Datasource resolving to the DIRECT endpoint, neither host ending
      `-pooler`:
        staging    (13:14): Datasource "db": ... at "ep-odd-rain-a6gr4xmm..."
        production (14:49): Datasource "db": ... at
                            "ep-green-smoke-a6xthq4r.us-west-2.aws.neon.tech"
